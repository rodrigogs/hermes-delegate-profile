name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # The test job owns the 100% coverage gate, and pytest collects
      # tests/test_js_suites_run.py (runs every tests/test_*.js suite) plus the
      # node --check syntax tests in test_webui_extension.py. Without node
      # those skip, so the gate that owns the coverage never exercises the JS
      # suites — the rot-detector that exists precisely because they rotted
      # unnoticed. Same node-version as the webui job so the two jobs agree.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # fastapi is NOT a dependency of this plugin (pyyaml is the only one). It is
      # installed here because dashboard/plugin_api.py imports it, and without it
      # that module is invisible to this job in two ways at once:
      #
      #   * tests/test_dashboard_plugin_api.py gates on it and skips — 42 parity
      #     tests never run;
      #   * dashboard/plugin_api.py is never imported, so coverage never descends
      #     into it and its 185 statements / 58 branches leave the denominator
      #     entirely. Measured on this tree: 5184 statements gated without fastapi
      #     vs 5369 with it, and --cov-fail-under=100 PASSED either way.
      #
      # A gate whose denominator shrinks to fit is not a gate. Worse, until the
      # 2026-09-01 split those 42 tests shared a module with the 25 console
      # contract tests (XSS sinks, the one-wall-clock rule, the tab structure, the
      # CSS token contract), and a module-level importorskip skips the WHOLE
      # MODULE — so all 67 silently did not run here either.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-cov fastapi

      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term --cov-report=json --cov-report=xml --cov-fail-under=100

      - name: Upload coverage to Codecov (optional)
        if: false
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml

      - name: Coverage badge summary
        run: |
          python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          pct = data['totals']['percent_covered']
          print(f'Coverage: {pct:.1f}%')
          "

  # The WebUI extension and the console carry real behaviour (rail state
  # signalling, replay step mapping, the write-mode gate). Their tests ran only
  # locally before, so a regression could ship green.
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The console suite prices a malformed price window with
      # router/capabilities.py ITSELF and compares the two answers, so this job
      # needs an interpreter as well as a runtime. It is declared rather than
      # inherited from the image, which is also what the syntax check below has
      # been relying on.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # DISCOVERED BY GLOB, RUN ONE FILE AT A TIME — the same way
      # tests/test_js_suites_run.py invokes them, from the same plugin root, so the
      # two cannot drift.
      #
      # This step used to name three paths, and two of them
      # (test_router_nav_cooldowns.js, test_router_nav_writespine.js) had not
      # existed since that behaviour moved into console.html — while
      # test_router_nav_mount.js, which does exist, was named nowhere. `node --test
      # <missing path>` prints "Could not find" and EXITS 0, so this job was green
      # while running 135 of the branch's 139 tests: a gate that passes when its
      # inputs vanish is not a gate.
      #
      # So the list is not a list any more. A new suite is picked up without an
      # edit here, an empty glob is a failure rather than a pass, and each suite is
      # invoked separately so the output names which one failed.
      - name: Run WebUI extension + console tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tests/test_*.js)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no JavaScript suites matched tests/test_*.js — they are the only thing this job runs"
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "── $suite"
            node --test "$suite"
          done

      # dashboard/dist/index.js is a SHIPPED browser asset with no test and no CI
      # step of any kind. A syntax check is the floor, not coverage.
      - name: Syntax-check shipped browser assets
        run: |
          node --check webui_extension/hermes-smart-router/router-nav.js
          node --check dashboard/dist/index.js
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, pathlib
          html = pathlib.Path("webui_extension/hermes-smart-router/console.html").read_text(encoding="utf-8")
          # `<script\b[^>]*>`, not `<script>`: the bare form does not see
          # `<script type="module">`, so a second script block added with any
          # attribute at all would slip past the count AND past every harness that
          # extracts "the" inline script by the same pattern.
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, re.S)
          assert len(scripts) == 1, f"console.html must carry exactly one inline script, found {len(scripts)}"
          with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as fh:
              fh.write(scripts[0])
              path = fh.name
          result = subprocess.run(["node", "--check", path], capture_output=True, text=True)
          if result.returncode:
              sys.exit(result.stderr)
          print("console.html inline script: syntax OK")
          PY
