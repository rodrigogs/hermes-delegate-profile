<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Capability Router</title>
  <!--
    THESIS: An operator opens this to answer three questions — is it healthy, how
      does it route, what did it decide. Everything that serves none of them is
      absent. It refuses the dashboard reflex of framing each fact in its own card
      with a subtitle explaining the card.
    OWN-WORLD: Inherited Hermes One dark control room. Structure comes from
      hairlines and space, not from boxes: one accent (the lock), five state
      colours that mean the same thing everywhere, --mono for anything an operator
      would copy, --sans for prose.
    STORY: Health first — the models it can reach. Pipeline to see and change how
      tasks route, behind an explicit lock. Routes to replay what really happened,
      step by step.
    FIRST VIEWPORT: The rail names three destinations, each carrying its own live
      state. Beside it, the model list at full width: name, state, why. Nothing
      else competes.
    FORM: Single self-contained file. Rail when it owns the window, horizontal
      deck when embedded. See DESIGN.md for the rules of subtraction.
  -->
  <style>
    :root {
      --bg: #090b10;
      --surface: #10141c;
      --surface-raised: #151b26;
      --surface-hover: #1b2331;
      --line: #263144;
      --line-strong: #3a4a65;
      --text: #ecf2fb;
      --muted: #92a0b7;
      --faint: #62708a;
      --accent: #8fb8ff;
      --accent-strong: #4a8cff;
      --green: #5ee1ad;
      --amber: #f6bf5f;
      --red: #ff7f8d;
      --violet: #bf9cff;
      --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius: 10px;
      --focus: 0 0 0 3px rgba(143, 184, 255, .28);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: var(--bg); font: 14px/1.5 var(--sans);
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    h1, h2 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
    h1 { font-size: 15px; }
    h2 { font-size: 15px; }
    p { margin: 0; }

    /* ── Frame ─────────────────────────────────────────────────────── */
    .shell {
      --rail: 210px;
      display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
      gap: 28px; width: min(1500px, 100%); margin: 0 auto;
      padding: 20px clamp(14px, 2.4vw, 32px) 40px;
    }
    .shell.is-narrow { grid-template-columns: minmax(0, 1fr); gap: 18px; }

    /* ── Rail ──────────────────────────────────────────────────────── */
    .rail { position: sticky; top: 20px; align-self: start; display: flex; flex-direction: column; gap: 18px; }
    .is-narrow .rail { position: static; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 12px 18px; }
    .brand { display: flex; align-items: baseline; gap: 8px; }
    .brand-name { font-size: 15px; font-weight: 650; }
    .brand-host { color: var(--faint); font: 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .is-narrow .brand-host { display: none; }

    .nav { display: flex; flex-direction: column; gap: 1px; }
    .is-narrow .nav { flex-direction: row; gap: 2px; }
    .tab {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
      padding: 7px 0; border: 0; background: none; color: var(--muted);
      font: 650 13px var(--sans); text-align: left; white-space: nowrap;
    }
    .is-narrow .tab { padding: 7px 12px; border-radius: 8px; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--text); }
    .tab[aria-selected="true"] .tab-name::after {
      content: ""; display: block; height: 1.5px; margin-top: 3px; background: var(--accent);
    }
    .tab-state { display: inline-flex; align-items: center; gap: 6px; }
    .count { color: var(--faint); font: 600 11px var(--mono); }
    .count[hidden] { display: none; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: 0 0 auto;
    }
    .is-alive   .dot { background: var(--green); }
    .is-degraded .dot { background: var(--amber); }
    .is-quota   .dot { background: var(--violet); }
    .is-dead    .dot { background: var(--red); }

    /* The lock is the only filled control in the rail — a write gate must never
       share a shape with a status chip. */
    .lock {
      display: flex; align-items: center; gap: 8px; padding: 8px 11px;
      border: 1px solid var(--line-strong); border-radius: 8px;
      background: var(--surface-raised); font: 650 12px var(--sans);
    }
    .lock:hover { border-color: var(--accent); }
    .lock[aria-pressed="true"] {
      border-color: rgba(246, 191, 95, .6); color: #ffe0a8;
      background: rgba(246, 191, 95, .14);
    }
    .lock-icon { font-size: 12px; }
    .rail-foot { display: flex; flex-direction: column; gap: 8px; }
    .is-narrow .rail-foot { flex-direction: row; margin-left: auto; }
    .quiet {
      border: 0; background: none; color: var(--muted); font: 600 12px var(--sans);
      padding: 4px 0; text-align: left;
    }
    .is-narrow .quiet { padding: 4px 8px; }
    .quiet:hover { color: var(--text); }
    .reach { display: flex; align-items: center; gap: 7px; color: var(--muted); font: 11px var(--mono); }

    /* ── Screens ───────────────────────────────────────────────────── */
    .screen { display: none; }
    .screen.active { display: block; }
    .screen-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      flex-wrap: wrap; margin-bottom: 18px;
    }
    .screen-note { color: var(--muted); font-size: 12px; }
    .group { margin-top: 26px; }
    .group-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      padding-bottom: 7px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .group-head h2 { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .nothing { color: var(--faint); font-size: 12px; padding: 2px 0; }

    /* Rows: the console's one structural primitive. */
    .row {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
      gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(38, 49, 68, .55);
    }
    .row:last-child { border-bottom: 0; }
    .row-name { font: 600 13px var(--mono); overflow-wrap: anywhere; }
    .row-note { color: var(--faint); font-size: 12px; }
    .row-value { color: var(--muted); font: 12px var(--mono); text-align: right; white-space: nowrap; }
    .state { font: 700 10px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .is-alive .state { color: var(--green); }
    .is-degraded .state { color: var(--amber); }
    .is-quota .state { color: var(--violet); }
    .is-dead .state { color: var(--red); }

    .facts { display: flex; flex-wrap: wrap; gap: 6px 22px; }
    .fact { display: flex; align-items: baseline; gap: 7px; }
    .fact-label { color: var(--faint); font: 10px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .fact-value { font: 600 13px var(--mono); }

    /* ── Pipeline graph ────────────────────────────────────────────── */
    .canvas-row { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
    .canvas-row.solo { grid-template-columns: minmax(0, 1fr); }
    .is-narrow .canvas-row { grid-template-columns: minmax(0, 1fr); }
    /* Routes: the decision list is the subject here, not the graph beside it. */
    .canvas-row.routes { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    .is-narrow .canvas-row.routes { grid-template-columns: minmax(0, 1fr); }
    .route-list { max-height: 72vh; overflow: auto; }
    .canvas { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .graph { display: block; width: 100%; min-height: 220px; }
    .pnode { cursor: default; }
    .pnode.editable { cursor: pointer; }
    .pnode-box { fill: var(--surface-raised); stroke: var(--line-strong); stroke-width: 1.2; }
    .pnode.editable:hover .pnode-box { stroke: var(--accent); }
    .pnode-name { fill: var(--text); font: 600 11px var(--mono); }
    .pnode-sub { fill: var(--faint); font: 9px var(--mono); }
    .pnode.runtime .pnode-box { stroke-dasharray: 3 3; }
    .pnode.runtime .pnode-name { fill: var(--muted); }
    .pnode.selected .pnode-box { stroke: var(--accent-strong); stroke-width: 2; }
    .pnode.on .pnode-box { stroke: var(--accent); stroke-width: 2; }
    .pnode.past .pnode-box { stroke: rgba(143, 184, 255, .55); }
    .pnode.off { opacity: .32; }
    .pedge { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
    .pedge.stop { stroke: var(--red); stroke-dasharray: 4 3; }

    .field { display: grid; gap: 4px; margin-bottom: 10px; }
    .field label { color: var(--faint); font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .field input, .field select {
      border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 9px;
      background: #080b11; font: 12px var(--mono);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .btn {
      border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 12px;
      background: var(--surface-raised); font: 650 12px var(--sans);
    }
    .btn:hover { border-color: var(--accent); background: var(--surface-hover); }
    .btn.go { border-color: var(--accent-strong); color: #f0f6ff; background: #2f6ccb; }
    .btn.warn { border-color: rgba(255, 127, 141, .5); color: #ffd2d7; background: rgba(255, 127, 141, .1); }
    .msg { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .msg.ok { color: var(--green); }
    .msg.bad { color: var(--red); }
    .code {
      margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: #080b11; color: #d8e6fb; font: 11px/1.55 var(--mono);
      white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto;
    }
    .editor {
      width: 100%; min-height: 240px; resize: vertical; padding: 10px 12px;
      border: 1px solid var(--line-strong); border-radius: 8px; background: #080b11;
      font: 12px/1.55 var(--mono); tab-size: 2;
    }
    details > summary { color: var(--muted); font: 650 12px var(--sans); cursor: pointer; padding: 6px 0; }
    details > summary:hover { color: var(--text); }

    /* ── Routes + replay ───────────────────────────────────────────── */
    .route { cursor: pointer; }
    .route:hover { background: var(--surface-hover); }
    .route.picked { background: var(--surface-hover); box-shadow: inset 2px 0 0 var(--accent); }
    .cause { font: 700 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .scrub { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .scrub input[type=range] { flex: 1; accent-color: var(--accent-strong); }
    .step-head { display: flex; align-items: baseline; gap: 12px; margin-top: 14px; }
    .step-index { color: var(--faint); font: 700 10px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .step-stage { font: 650 13px var(--mono); }
    .io { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 8px; }
    .io-label { color: var(--faint); font: 10px var(--mono); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; }

    .warn-line { display: flex; gap: 9px; align-items: baseline; padding: 9px 11px; margin-bottom: 14px;
      border-left: 2px solid var(--amber); background: rgba(246, 191, 95, .07); color: var(--muted); font-size: 12px; }
    .warn-line.bad { border-left-color: var(--red); background: rgba(255, 127, 141, .07); }

    @media (max-width: 700px) {
      .shell { padding: 12px 12px 28px; }
      .io { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <aside class="rail">
      <div class="brand">
        <span class="brand-name">Capability Router</span>
        <span class="brand-host">Hermes One</span>
      </div>

      <nav class="nav" role="tablist" aria-label="Console sections">
        <button class="tab" id="tab-health" role="tab" aria-selected="true" aria-controls="panel-health" data-tab="health" type="button">
          <span class="tab-name">Health</span>
          <span class="tab-state" id="stateHealth"><span class="count" id="countHealth" hidden></span><span class="dot"></span></span>
        </button>
        <button class="tab" id="tab-pipeline" role="tab" aria-selected="false" aria-controls="panel-pipeline" data-tab="pipeline" type="button">
          <span class="tab-name">Pipeline</span>
          <span class="tab-state" id="statePipeline"><span class="count" id="countPipeline" hidden></span><span class="dot"></span></span>
        </button>
        <button class="tab" id="tab-routes" role="tab" aria-selected="false" aria-controls="panel-routes" data-tab="routes" type="button">
          <span class="tab-name">Routes</span>
          <span class="tab-state" id="stateRoutes"><span class="count" id="countRoutes" hidden></span><span class="dot"></span></span>
        </button>
      </nav>

      <button class="lock" id="lock" type="button" aria-pressed="false" title="Unlock editing">
        <span class="lock-icon" aria-hidden="true">🔒</span><span id="lockLabel">Locked</span>
      </button>

      <div class="rail-foot">
        <span class="reach" id="reach"><span class="dot"></span><span id="reachText">checking</span></span>
        <button class="quiet" id="refresh" type="button">Refresh</button>
      </div>
    </aside>

    <div>
      <div id="warnings"></div>

      <!-- ── Health: which models can this router reach right now ────── -->
      <section class="screen active" id="panel-health" role="tabpanel" aria-labelledby="tab-health">
        <div class="screen-head">
          <h2>Models</h2>
          <div class="facts" id="healthFacts"></div>
        </div>
        <div id="models"></div>

        <div class="group" id="bansGroup" hidden>
          <div class="group-head"><h2>Blocked</h2></div>
          <div id="bans"></div>
        </div>

        <div class="group">
          <div class="group-head"><h2>Compaction</h2><span class="screen-note" id="compactionNote"></span></div>
          <div class="facts" id="compaction"></div>
          <details id="compactionApply">
            <summary>Recalculate thresholds</summary>
            <div class="field" style="margin-top:10px">
              <label for="compactConfirm">Type COMPACT to confirm — this restarts the agent</label>
              <input id="compactConfirm" autocomplete="off" placeholder="COMPACT">
            </div>
            <div class="actions"><button class="btn warn" id="compactGo" type="button">Recalculate</button></div>
            <p class="msg" id="compactMsg" aria-live="polite"></p>
          </details>
        </div>
      </section>

      <!-- ── Pipeline: how a task becomes a model ───────────────────── -->
      <section class="screen" id="panel-pipeline" role="tabpanel" aria-labelledby="tab-pipeline">
        <div class="screen-head">
          <h2>Routing pipeline</h2>
          <p class="screen-note" id="pipelineNote">Unlock to change a node.</p>
        </div>
        <div class="canvas-row" id="pipelineRow">
          <div class="canvas"><svg id="pipelineSvg" class="graph" role="img" aria-label="Routing pipeline"></svg></div>
          <div id="inspector"></div>
        </div>
        <div class="group">
          <details>
            <summary>Edit the whole policy as JSON</summary>
            <textarea id="policyEditor" class="editor" spellcheck="false" readonly aria-label="Policy JSON"></textarea>
            <div class="actions">
              <button class="btn" id="jsonPlan" type="button">Validate</button>
              <button class="btn go" id="jsonApply" type="button">Apply</button>
              <button class="btn" id="jsonConfirm" type="button">Confirm</button>
              <button class="btn warn" id="jsonRevert" type="button">Revert</button>
            </div>
            <p class="msg" id="jsonMsg" aria-live="polite"></p>
            <pre class="code" id="jsonDiff" hidden></pre>
          </details>
        </div>
      </section>

      <!-- ── Routes: what it actually decided ───────────────────────── -->
      <section class="screen" id="panel-routes" role="tabpanel" aria-labelledby="tab-routes">
        <div class="screen-head">
          <h2>Recent decisions</h2>
          <p class="screen-note" id="routesNote"></p>
        </div>
        <div class="canvas-row routes">
          <div id="routesTable" class="route-list"></div>
          <div>
            <div class="canvas"><svg id="replaySvg" class="graph" role="img" aria-label="Replayed path"></svg></div>
            <div class="scrub" id="scrub" hidden>
              <button class="quiet" id="stepPrev" type="button" aria-label="Previous step">◀</button>
              <input id="stepRange" type="range" min="0" max="0" value="0" aria-label="Step">
              <button class="quiet" id="stepNext" type="button" aria-label="Next step">▶</button>
            </div>
            <div id="stepDetail"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      const SIDECAR = '/api/extensions/capability-router/sidecar';
      const NARROW_BELOW = 1120;

      const state = {
        mode: 'locked',
        health: null, status: null, policy: null, blocklist: null,
        liveness: null, compaction: null, routes: [],
        plan: null, draft: null, selected: null, replay: null,
        pending: new Set(), unreachable: false, checkedAt: null,
      };

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = String(text);
        return n;
      };
      const svgEl = (tag, attrs) => {
        const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
        if (attrs) for (const k of Object.keys(attrs)) n.setAttribute(k, String(attrs[k]));
        return n;
      };
      const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
      const pretty = (v) => {
        if (typeof v === 'string') return v;
        try { return JSON.stringify(v, null, 2); } catch (_) { return String(v); }
      };

      // Booleans and enums become operator words; DESIGN.md §2.5.
      const say = (v, fallback = '—') => {
        if (v === true) return 'yes';
        if (v === false) return 'no';
        if (v === undefined || v === null || v === '') return fallback;
        if (typeof v === 'object') return Array.isArray(v) ? String(v.length) : pretty(v);
        return String(v);
      };
      const ago = (ts) => {
        if (!ts) return '—';
        const s = Math.max(0, Math.round(Date.now() / 1000 - Number(ts)));
        if (s < 60) return `${s}s ago`;
        if (s < 3600) return `${Math.round(s / 60)}m ago`;
        if (s < 86400) return `${Math.round(s / 3600)}h ago`;
        return `${Math.round(s / 86400)}d ago`;
      };
      const clock = (d) => d.toTimeString().slice(0, 5);

      // The WebUI binds a CSRF token to the session and injects it only into pages
      // it renders itself; without one the proxy refuses every write.
      const csrf = () => {
        try { return (window.__HERMES_CONFIG__ || {}).csrfToken || ''; } catch (_) { return ''; }
      };

      async function call(path, options = {}) {
        const method = options.method || 'GET';
        const key = `${method} ${path.replace(/\?.*$/, '')}`;
        const headers = options.body ? { 'Content-Type': 'application/json' } : {};
        const token = csrf();
        if (token && method !== 'GET') headers['X-Hermes-CSRF-Token'] = token;
        try {
          const res = await fetch(`${SIDECAR}${path}`, {
            method,
            headers: Object.keys(headers).length ? headers : undefined,
            body: options.body ? JSON.stringify(options.body) : undefined,
            credentials: 'same-origin',
          });
          const raw = await res.text();
          let data = {};
          try { data = raw ? JSON.parse(raw) : {}; } catch (_) { data = { raw }; }
          if (res.status === 404) { state.pending.add(key); return { missing: true, data }; }
          state.pending.delete(key);
          if (!res.ok) return { error: true, status: res.status, data };
          return { data, status: res.status };
        } catch (error) {
          state.unreachable = true;
          return { error: true, offline: true, data: { message: error.message } };
        }
      }

      // ── state semantics ─────────────────────────────────────────────
      const RANK = { alive: 0, degraded: 1, quota: 2, dead: 3 };
      function modelState(entry) {
        const raw = String((entry && (entry.state || entry.status)) || '').toLowerCase();
        if (raw.includes('quota')) return 'quota';
        if (raw.includes('dead') || raw.includes('unreachable')) return 'dead';
        if (raw.includes('degrad') || raw.includes('half')) return 'degraded';
        if (raw.includes('alive') || raw === 'ok' || raw === 'closed') return 'alive';
        return '';
      }
      function worstOf(models) {
        return models.reduce((worst, m) => {
          const s = modelState(m);
          return (RANK[s] ?? -1) > (RANK[worst] ?? -1) ? s : worst;
        }, 'alive');
      }
      function causeColor(cause) {
        const c = String(cause || '');
        if (c.includes('veto') || c.includes('fail_safe')) return 'var(--red)';
        if (c === 'classifier') return 'var(--violet)';
        return 'var(--green)';
      }

      // ── rail ────────────────────────────────────────────────────────
      function renderRail() {
        const models = (state.liveness && Array.isArray(state.liveness.models)) ? state.liveness.models : [];
        const rules = (state.policy && Array.isArray(state.policy.rules)) ? state.policy.rules : [];
        const routes = Array.isArray(state.routes) ? state.routes : [];
        const bl = state.blocklist || {};
        const bans = Array.isArray(bl.manual_bans) ? bl.manual_bans : [];
        const breakers = Array.isArray(bl.breaker_cooldowns) ? bl.breaker_cooldowns : [];

        const set = (wrapId, countId, cls, count) => {
          const wrap = $(wrapId);
          if (wrap) wrap.className = `tab-state${cls ? ` is-${cls}` : ''}`;
          const badge = $(countId);
          if (badge) { badge.textContent = String(count); badge.hidden = !count; }
        };
        const health = state.unreachable ? 'dead' : (models.length ? worstOf(models) : '');
        set('stateHealth', 'countHealth', health, bans.length + breakers.length || models.length);
        set('statePipeline', 'countPipeline', state.mode === 'unlocked' ? 'degraded' : (state.policy ? 'alive' : ''), rules.length);
        set('stateRoutes', 'countRoutes', routes.length ? 'alive' : '', routes.length);

        const reach = $('reach');
        reach.className = `reach${state.unreachable ? ' is-dead' : (state.health ? ' is-alive' : '')}`;
        $('reachText').textContent = state.unreachable
          ? 'sidecar unreachable'
          : state.checkedAt ? `checked ${clock(state.checkedAt)}` : 'checking';
      }

      // ── warnings: only conditions that need an operator ─────────────
      function renderWarnings() {
        const box = $('warnings');
        clear(box);
        if (state.unreachable) {
          const line = el('div', 'warn-line bad');
          line.append(el('strong', '', 'Sidecar unreachable.'),
                      el('span', '', 'Reads and writes are unavailable until the proxy answers.'));
          box.append(line);
          return;
        }
        if (state.mode === 'unlocked' && !csrf()) {
          const line = el('div', 'warn-line');
          line.append(el('strong', '', 'Editing cannot apply here.'),
                      el('span', '', 'This console is open standalone, so the WebUI grants it no write token. Open the Router panel inside Hermes One.'));
          box.append(line);
        }
      }

      // ── Health ──────────────────────────────────────────────────────
      function renderHealth() {
        const facts = $('healthFacts');
        clear(facts);
        const st = state.status || {};
        const rules = (state.policy && state.policy.rules) || [];
        const fact = (label, value) => {
          const f = el('div', 'fact');
          f.append(el('span', 'fact-label', label), el('span', 'fact-value', value));
          facts.append(f);
        };
        fact('routing', say(st.enabled === undefined ? undefined : st.enabled, '—') === 'yes' ? 'on' : 'off');
        fact('rules', String(rules.length || st.rules_count || 0));
        const classifier = (st.classifier && st.classifier.model) || (state.policy && state.policy.classifier && state.policy.classifier.model);
        if (classifier) fact('classifier', classifier);
        const errors = Array.isArray(st.validation_errors) ? st.validation_errors : [];
        if (errors.length) fact('invalid', `${errors.length} error${errors.length > 1 ? 's' : ''}`);

        const list = $('models');
        clear(list);
        const models = (state.liveness && Array.isArray(state.liveness.models)) ? state.liveness.models : [];
        if (!models.length) {
          list.append(el('p', 'nothing', state.unreachable ? 'Unavailable while the sidecar is unreachable.' : 'No routable models reported.'));
        } else {
          models.forEach((m) => {
            const cls = modelState(m);
            const row = el('div', `row${cls ? ` is-${cls}` : ''}`);
            row.append(el('span', 'dot'));
            const name = el('div');
            name.append(el('div', 'row-name', m.model || m.model_key || '—'));
            const rail = m.provider || (String(m.model_key || '').split('@')[1] || '');
            if (rail) name.append(el('div', 'row-note', rail));
            row.append(name);
            const right = el('div');
            right.append(el('span', 'state', cls || 'unknown'));
            const cooldown = m.breaker && Number(m.breaker.cooldown_remaining_s);
            if (cooldown > 0) right.append(el('div', 'row-value', `${Math.ceil(cooldown)}s cooldown`));
            row.append(right);
            list.append(row);
          });
        }

        const bl = state.blocklist || {};
        const bans = Array.isArray(bl.manual_bans) ? bl.manual_bans : [];
        const breakers = Array.isArray(bl.breaker_cooldowns) ? bl.breaker_cooldowns : [];
        const group = $('bansGroup');
        const banBox = $('bans');
        clear(banBox);
        group.hidden = !(bans.length || breakers.length);
        bans.forEach((b) => {
          const row = el('div', 'row is-dead');
          row.append(el('span', 'dot'));
          const name = el('div');
          name.append(el('div', 'row-name', b.model || say(b)));
          if (b.reason) name.append(el('div', 'row-note', b.reason));
          row.append(name, el('span', 'state', 'banned'));
          banBox.append(row);
        });
        breakers.forEach((b) => {
          const row = el('div', 'row is-degraded');
          row.append(el('span', 'dot'));
          const name = el('div');
          name.append(el('div', 'row-name', b.model_key || '—'));
          if (b.last_failure_kind) name.append(el('div', 'row-note', b.last_failure_kind));
          row.append(name);
          row.append(el('span', 'row-value', `${Math.ceil(Number(b.cooldown_remaining_s) || 0)}s left`));
          banBox.append(row);
        });

        const comp = $('compaction');
        clear(comp);
        const c = state.compaction;
        $('compactionNote').textContent = c ? '' : 'not implemented by this sidecar';
        $('compactionApply').hidden = !c;
        if (c) {
          const fact2 = (label, value) => {
            const f = el('div', 'fact');
            f.append(el('span', 'fact-label', label), el('span', 'fact-value', value));
            comp.append(f);
          };
          fact2('aggressiveness', say(c.aggressiveness));
          fact2('summarizer window', say(c.summarizer_window));
          fact2('compacts at', say(c.threshold_tokens));
          if (c.warning) fact2('warning', 'threshold exceeds the window');
        }
      }

      // ── Pipeline graph ──────────────────────────────────────────────
      const NODE_W = 132, NODE_H = 40, PAD = 18, MIN_COL = 172, MIN_ROW = 52;
      const FIXED = [
        { id: 'blocklist', name: 'blocklist', col: 0, bind: 'blocklist' },
        { id: 'signals', name: 'signals', col: 1, runtime: true },
        { id: 'default', name: 'default', col: 2, bind: 'default' },
        { id: 'classifier', name: 'classifier', col: 3, bind: 'classifier' },
        { id: 'cache', name: 'cache', col: 3, runtime: true },
        { id: 'session_pin', name: 'session pin', col: 3, runtime: true },
        { id: 'fail_safe', name: 'fail-safe', col: 5, bind: 'fail_safe' },
      ];

      function graphNodes(width) {
        const policy = state.policy || {};
        const rules = Array.isArray(policy.rules) ? policy.rules : [];
        const tiers = (policy.tiers && typeof policy.tiers === 'object') ? policy.tiers : {};
        const nodes = FIXED.map((n) => ({ ...n }));
        rules.forEach((r, i) => nodes.push({
          id: `rule:${r.id != null ? r.id : i}`, name: r.id != null ? String(r.id) : `rule ${i}`,
          col: 2, bind: 'rule', ruleIndex: i,
          sub: (r.then && (r.then.deny ? 'deny' : r.then.model)) || '',
        }));
        Object.keys(tiers).forEach((t) => nodes.push({
          id: `tier:${t}`, name: t, col: 4, bind: 'tier', tier: t,
          sub: (tiers[t] && tiers[t].model) || '',
        }));
        const byCol = {};
        nodes.forEach((n) => { (byCol[n.col] = byCol[n.col] || []).push(n); });
        const maxCol = Math.max(...nodes.map((n) => n.col), 0);
        const colGap = Math.max(MIN_COL, Math.min((width - 2 * PAD - NODE_W) / (maxCol || 1), 260));
        Object.keys(byCol).forEach((col) => byCol[col].forEach((n, row) => {
          n.x = PAD + Number(col) * colGap;
          n.y = PAD + row * MIN_ROW;
        }));
        return nodes;
      }

      function graphEdges(nodes) {
        const by = {};
        nodes.forEach((n) => { by[n.id] = n; });
        const edges = [];
        const link = (a, b, cls) => { if (by[a] && by[b]) edges.push({ a: by[a], b: by[b], cls: cls || '' }); };
        link('blocklist', 'signals');
        const rules = (state.policy && state.policy.rules) || [];
        rules.forEach((r, i) => {
          const id = `rule:${r.id != null ? r.id : i}`;
          link('signals', id);
          const then = r.then || {};
          if (then.action === 'classify') link(id, 'classifier');
          else if (typeof then.model === 'string' && by[`tier:${then.model}`]) link(id, `tier:${then.model}`);
        });
        link('signals', 'default');
        link('default', 'classifier');
        link('classifier', 'fail_safe');
        return edges;
      }

      function drawGraph(svg, opts) {
        const editable = !!(opts && opts.editable);
        clear(svg);
        if (!state.policy) {
          const t = svgEl('text', { x: PAD, y: 30, class: 'pnode-sub' });
          t.textContent = 'Policy unavailable.';
          svg.appendChild(t);
          return;
        }
        const width = svg.clientWidth || (svg.parentElement && svg.parentElement.clientWidth) || 900;
        const nodes = graphNodes(width);
        const edges = graphEdges(nodes);
        const w = Math.max(...nodes.map((n) => n.x + NODE_W)) + PAD;
        const h = Math.max(...nodes.map((n) => n.y + NODE_H)) + PAD;
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.setAttribute('height', String(h));

        const edgeLayer = svgEl('g'); svg.appendChild(edgeLayer);
        edges.forEach((e) => {
          const x1 = e.a.x + NODE_W, y1 = e.a.y + NODE_H / 2;
          const x2 = e.b.x, y2 = e.b.y + NODE_H / 2;
          const mid = (x1 + x2) / 2;
          edgeLayer.appendChild(svgEl('path', {
            class: `pedge ${e.cls}`, d: `M ${x1} ${y1} C ${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`,
          }));
        });

        nodes.forEach((n) => {
          const canEdit = editable && n.bind && !n.runtime;
          const classes = ['pnode'];
          if (n.runtime) classes.push('runtime');
          if (canEdit) classes.push('editable');
          if (editable && state.selected === n.id) classes.push('selected');
          const g = svgEl('g', { class: classes.join(' '), transform: `translate(${n.x} ${n.y})` });
          g.dataset.nodeId = n.id;
          g.appendChild(svgEl('rect', { class: 'pnode-box', width: NODE_W, height: NODE_H, rx: 7 }));
          const name = svgEl('text', { class: 'pnode-name', x: 10, y: n.sub ? 17 : 24 });
          name.textContent = n.name;
          g.appendChild(name);
          if (n.sub || n.runtime) {
            const sub = svgEl('text', { class: 'pnode-sub', x: 10, y: n.sub ? 30 : 30 });
            sub.textContent = n.runtime ? 'runtime' : String(n.sub);
            g.appendChild(sub);
          }
          if (canEdit) g.addEventListener('click', () => pickNode(n));
          svg.appendChild(g);
        });
      }

      function pickNode(node) {
        state.selected = node.id;
        drawGraph($('pipelineSvg'), { editable: state.mode === 'unlocked' });
        renderInspector(node);
      }

      const EDITABLE = new Set(['tier', 'rule', 'classifier', 'fail_safe', 'default']);

      function fullPolicy() {
        const base = state.policy && typeof state.policy === 'object' ? state.policy : {};
        const full = JSON.parse(JSON.stringify(base));
        const st = state.status || {};
        if (full.classifier === undefined && st.classifier) full.classifier = JSON.parse(JSON.stringify(st.classifier));
        if (full.enabled === undefined && typeof st.enabled === 'boolean') full.enabled = st.enabled;
        if (full.blocklist === undefined && state.blocklist) {
          full.blocklist = {
            manual_ban: state.blocklist.manual_bans || [],
            fallback_chain: state.blocklist.fallback_chain || [],
          };
        }
        return full;
      }

      function renderInspector(node) {
        const box = $('inspector');
        clear(box);
        if (!node) {
          const rules = (state.policy && state.policy.rules) || [];
          const tiers = Object.keys((state.policy && state.policy.tiers) || {});
          box.append(el('p', 'nothing', state.mode === 'unlocked'
            ? 'Click a node to change it.'
            : `${rules.length} rules routing to ${tiers.length} tiers. Unlock to edit.`));
          return;
        }
        const editing = state.mode === 'unlocked' && node.bind && EDITABLE.has(node.bind);
        box.append(el('h2', '', node.name));
        if (!editing) {
          const policy = state.policy || {};
          let fragment = null;
          if (node.bind === 'rule') fragment = (policy.rules || [])[node.ruleIndex];
          else if (node.bind === 'tier') fragment = (policy.tiers || {})[node.tier];
          else if (node.bind) fragment = policy[node.bind];
          if (node.runtime) box.append(el('p', 'nothing', 'Runtime state — rebuilt per call, nothing to configure.'));
          else box.append(Object.assign(el('pre', 'code', pretty(fragment || {})), {}));
          return;
        }

        state.draft = fullPolicy();
        const field = (label, get, set, options) => {
          const wrap = el('div', 'field');
          wrap.append(el('label', '', label));
          let input;
          if (options) {
            input = document.createElement('select');
            options.forEach((o) => {
              const opt = document.createElement('option');
              opt.value = o; opt.textContent = o || '—';
              input.appendChild(opt);
            });
          } else {
            input = document.createElement('input');
          }
          input.value = get() == null ? '' : String(get());
          input.addEventListener('input', () => set(input.value));
          wrap.append(input);
          box.append(wrap);
        };

        const d = state.draft;
        if (node.bind === 'tier') {
          const t = d.tiers[node.tier] = d.tiers[node.tier] || {};
          field('model', () => t.model, (v) => { t.model = v; });
          field('provider', () => t.provider, (v) => { t.provider = v; });
        } else if (node.bind === 'rule') {
          const r = d.rules[node.ruleIndex] = d.rules[node.ruleIndex] || {};
          r.then = r.then || {};
          const tiers = Object.keys(d.tiers || {});
          field('routes to', () => r.then.model, (v) => { r.then.model = v; }, tiers.concat(['']));
          field('profile', () => r.then.profile, (v) => { r.then.profile = v; });
        } else if (node.bind === 'classifier' || node.bind === 'fail_safe') {
          const f = d[node.bind] = d[node.bind] || {};
          field('model', () => f.model, (v) => { f.model = v; });
          field('provider', () => f.provider, (v) => { f.provider = v; });
        } else if (node.bind === 'default') {
          const def = d.default = d.default || {};
          field('routes to', () => def.model, (v) => { def.model = v; });
          field('action', () => def.action, (v) => { def.action = v; });
        }

        const actions = el('div', 'actions');
        const plan = el('button', 'btn', 'Validate');
        const apply = el('button', 'btn go', 'Apply');
        const revert = el('button', 'btn warn', 'Revert');
        actions.append(plan, apply, revert);
        box.append(actions);
        const msg = el('p', 'msg'); msg.id = 'nodeMsg'; msg.setAttribute('aria-live', 'polite');
        box.append(msg);
        const diff = el('pre', 'code'); diff.id = 'nodeDiff'; diff.hidden = true;
        box.append(diff);

        plan.addEventListener('click', () => doPlan(state.draft, msg, diff));
        apply.addEventListener('click', () => doApply('/apply', msg));
        revert.addEventListener('click', () => doApply('/apply/revert', msg));
      }

      // ── write path ──────────────────────────────────────────────────
      function writable(msg, action) {
        if (state.unreachable) { setMsg(msg, `${action} unavailable — sidecar unreachable.`, 'bad'); return false; }
        if (state.mode !== 'unlocked') { setMsg(msg, `${action} needs the lock opened first.`, 'bad'); return false; }
        if (!csrf()) {
          setMsg(msg, `${action} cannot apply from a standalone console — open the Router panel inside Hermes One.`, 'bad');
          return false;
        }
        return true;
      }
      function setMsg(node, text, kind) {
        if (!node) return;
        node.textContent = text;
        node.className = `msg${kind ? ` ${kind}` : ''}`;
      }

      async function doPlan(policy, msg, diffNode) {
        if (!writable(msg, 'Validate')) return;
        setMsg(msg, 'Checking…');
        const res = await call('/plan', { method: 'POST', body: { policy } });
        if (res.missing) { setMsg(msg, 'This sidecar has no /plan endpoint.', 'bad'); return; }
        if (res.error) { setMsg(msg, `Rejected (HTTP ${res.status || 'network'}).`, 'bad'); return; }
        state.plan = res.data;
        if (diffNode) {
          diffNode.hidden = false;
          diffNode.textContent = res.data.diff || pretty(res.data.preview || {});
        }
        setMsg(msg, res.data.valid ? 'Valid — apply to write it.' : `Invalid: ${(res.data.errors || []).join('; ')}`,
               res.data.valid ? 'ok' : 'bad');
      }

      async function doApply(path, msg) {
        if (!writable(msg, 'Apply')) return;
        if (path !== '/apply/revert') {
          if (!state.plan) { setMsg(msg, 'Validate first.', 'bad'); return; }
          if (!state.plan.valid) { setMsg(msg, 'That plan is invalid.', 'bad'); return; }
        }
        const body = path === '/apply/revert' ? {} : { plan: state.plan, policy: state.plan.policy };
        const res = await call(path, { method: 'POST', body });
        if (res.missing) { setMsg(msg, 'This sidecar has no such endpoint.', 'bad'); return; }
        if (res.status === 409) { setMsg(msg, 'Policy changed underneath — validate again.', 'bad'); state.plan = null; await load(); return; }
        if (res.error) { setMsg(msg, `Failed (HTTP ${res.status || 'network'}).`, 'bad'); return; }
        setMsg(msg, 'Written.', 'ok');
        state.plan = null; state.draft = null;
        await load();
      }

      async function doCompaction() {
        const msg = $('compactMsg');
        if (!writable(msg, 'Recalculate')) return;
        if ($('compactConfirm').value !== 'COMPACT') { setMsg(msg, 'Type COMPACT exactly to confirm.', 'bad'); return; }
        const aggressiveness = state.compaction && Number.isFinite(state.compaction.aggressiveness)
          ? state.compaction.aggressiveness : 50;
        const res = await call('/apply', { method: 'POST', body: { action: 'compaction', confirm: 'COMPACT', aggressiveness } });
        if (res.error || res.missing) { setMsg(msg, `Refused (HTTP ${res.status || 'n/a'}).`, 'bad'); return; }
        $('compactConfirm').value = '';
        setMsg(msg, 'Scheduled — the agent restarts and reverts itself if unhealthy.', 'ok');
      }

      // ── Routes + replay ─────────────────────────────────────────────
      function renderRoutes() {
        const box = $('routesTable');
        clear(box);
        const routes = Array.isArray(state.routes) ? state.routes : [];
        $('routesNote').textContent = routes.length
          ? 'Pick one to replay its path.'
          : (state.pending.has('GET /routes') ? 'This sidecar does not record decisions yet.' : '');
        if (!routes.length) {
          box.append(el('p', 'nothing', 'No decisions recorded yet.'));
          return;
        }
        routes.forEach((r) => {
          const row = el('div', `row route${state.replay && state.replay.id === r.id ? ' picked' : ''}`);
          row.dataset.routeId = r.id;
          const cause = el('span', 'cause', String(r.cause || '—').replace(/_/g, ' '));
          cause.style.color = causeColor(r.cause);
          row.append(cause);
          const mid = el('div');
          mid.append(el('div', 'row-name', r.model || '—'));
          if (r.task) mid.append(el('div', 'row-note', r.task));
          row.append(mid, el('span', 'row-value', ago(r.ts)));
          row.addEventListener('click', () => pickRoute(r.id));
          box.append(row);
        });
      }

      function stepNode(step) {
        const stage = step && step.stage;
        if (stage === 'rules') {
          const out = step.out || {};
          return out.rule_id != null ? `rule:${out.rule_id}` : 'default';
        }
        if (stage === 'veto') return 'blocklist';
        return stage || null;
      }

      async function pickRoute(id) {
        const res = await call(`/routes?id=${encodeURIComponent(id)}`);
        if (res.error || res.missing) { $('routesNote').textContent = 'That trace could not be read.'; return; }
        const steps = Array.isArray(res.data.steps) ? res.data.steps : [];
        state.replay = { id, steps, at: 0 };
        drawGraph($('replaySvg'), { editable: false });
        $('scrub').hidden = steps.length < 2;
        $('stepRange').max = String(Math.max(0, steps.length - 1));
        $('stepRange').value = '0';
        renderRoutes();
        renderStep();
      }

      function renderStep() {
        if (!state.replay) return;
        const { steps, at } = state.replay;
        const active = at < steps.length ? stepNode(steps[at]) : null;
        const past = new Set();
        for (let i = 0; i < at && i < steps.length; i++) { const id = stepNode(steps[i]); if (id) past.add(id); }
        $('replaySvg').querySelectorAll('.pnode').forEach((g) => {
          const id = g.dataset.nodeId;
          g.classList.toggle('on', id === active);
          g.classList.toggle('past', past.has(id) && id !== active);
          g.classList.toggle('off', active != null && id !== active && !past.has(id));
        });

        const box = $('stepDetail');
        clear(box);
        const step = steps[at] || {};
        const head = el('div', 'step-head');
        head.append(el('span', 'step-index', `step ${at + 1} of ${steps.length}`),
                    el('span', 'step-stage', String(step.stage || '—')));
        if (step.cause) {
          const c = el('span', 'cause', String(step.cause).replace(/_/g, ' '));
          c.style.color = causeColor(step.cause);
          head.append(c);
        }
        box.append(head);
        const io = el('div', 'io');
        [['in', step.in], ['out', step.out]].forEach(([label, value]) => {
          if (value === undefined) return;
          const cell = el('div');
          cell.append(el('div', 'io-label', label));
          cell.append(el('pre', 'code', pretty(value)));
          io.append(cell);
        });
        box.append(io);
      }

      function scrub(delta) {
        if (!state.replay || !state.replay.steps.length) return;
        const max = state.replay.steps.length - 1;
        const next = delta === 'range' ? Number($('stepRange').value)
                                      : Math.max(0, Math.min(max, state.replay.at + delta));
        state.replay.at = next;
        $('stepRange').value = String(next);
        renderStep();
      }

      // ── lock ────────────────────────────────────────────────────────
      function setMode(mode) {
        state.mode = mode;
        const open = mode === 'unlocked';
        const lock = $('lock');
        lock.setAttribute('aria-pressed', String(open));
        lock.title = open ? 'Lock editing' : 'Unlock editing';
        lock.querySelector('.lock-icon').textContent = open ? '✎' : '🔒';
        $('lockLabel').textContent = open ? 'Unlocked' : 'Locked';
        $('policyEditor').readOnly = !open;
        $('pipelineNote').textContent = open ? 'Click a node to change it.' : 'Unlock to change a node.';
        renderWarnings();
        renderRail();
        renderInspector(null);
        drawGraph($('pipelineSvg'), { editable: open });
      }

      // ── layout ──────────────────────────────────────────────────────
      function isNarrow() {
        const embedded = window.self !== window.top;
        return embedded || window.innerWidth < NARROW_BELOW;
      }
      function applyLayout() {
        $('shell').classList.toggle('is-narrow', isNarrow());
        $('pipelineRow').classList.toggle('solo', isNarrow());
        drawGraph($('pipelineSvg'), { editable: state.mode === 'unlocked' });
        drawGraph($('replaySvg'), { editable: false });
      }

      // ── load ────────────────────────────────────────────────────────
      function renderAll() {
        renderWarnings();
        renderRail();
        renderHealth();
        renderRoutes();
        drawGraph($('pipelineSvg'), { editable: state.mode === 'unlocked' });
        drawGraph($('replaySvg'), { editable: false });
        if (!state.selected) renderInspector(null);
        if (state.replay) renderStep();
        if (state.mode !== 'unlocked' || !$('policyEditor').value) {
          $('policyEditor').value = state.policy ? pretty(fullPolicy()) : '';
        }
      }

      async function load() {
        state.unreachable = false;
        const [health, status, policy, blocklist, liveness, compaction, routes] = await Promise.all([
          call('/health'), call('/status'), call('/policy'), call('/blocklist'),
          call('/liveness'), call('/compaction'), call('/routes'),
        ]);
        state.health = health.data || null;
        state.status = status.data || null;
        state.policy = policy.data || null;
        state.blocklist = blocklist.data || null;
        state.liveness = liveness.data || null;
        state.compaction = compaction.missing ? null : (compaction.data || null);
        state.routes = (routes.data && Array.isArray(routes.data.routes)) ? routes.data.routes : [];
        state.checkedAt = new Date();
        renderAll();
      }

      function wire() {
        document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => {
          const name = tab.dataset.tab;
          document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
          document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === `panel-${name}`));
        }));
        $('lock').addEventListener('click', () => setMode(state.mode === 'unlocked' ? 'locked' : 'unlocked'));
        $('refresh').addEventListener('click', load);
        $('stepRange').addEventListener('input', () => scrub('range'));
        $('stepPrev').addEventListener('click', () => scrub(-1));
        $('stepNext').addEventListener('click', () => scrub(1));
        $('compactGo').addEventListener('click', doCompaction);
        $('jsonPlan').addEventListener('click', () => {
          let draft;
          try { draft = JSON.parse($('policyEditor').value); }
          catch (e) { setMsg($('jsonMsg'), `Not valid JSON: ${e.message}`, 'bad'); return; }
          doPlan(draft, $('jsonMsg'), $('jsonDiff'));
        });
        $('jsonApply').addEventListener('click', () => doApply('/apply', $('jsonMsg')));
        $('jsonConfirm').addEventListener('click', () => doApply('/apply/confirm', $('jsonMsg')));
        $('jsonRevert').addEventListener('click', () => doApply('/apply/revert', $('jsonMsg')));
        window.addEventListener('resize', applyLayout);
      }

      wire();
      applyLayout();
      setMode('locked');
      load();

      globalThis.__router = {
        state, setMode, renderRail, renderHealth, renderRoutes, renderStep, renderInspector,
        drawGraph, graphNodes, graphEdges, stepNode, causeColor, worstOf, modelState,
        say, ago, isNarrow, csrf, writable, call, load,
      };
    })();
  </script>
</body>
</html>
