        structured_output: () => ({ family: 'capability', kind: 'needs', text: 'structured output' }),
      };
      function requirementChips(requirements) {
        const req = requirements && typeof requirements === 'object' ? requirements : {};
        return Object.keys(req).map((key) => {
          const value = req[key];
          const build = REQUIREMENT_CHIP[key];
          // A requirement key this console has not learned still renders: a
          // silently dropped one makes an unexplainable rejection.
          if (!build) return { family: 'capability', kind: 'needs', text: `${key.replace(/_/g, ' ')} ${say(value)}` };
          // Only a TRUE boolean constrains anything (capabilities.satisfies), so a
          // false one is not a requirement and must not be drawn as one.
          if (key !== 'min_context' && !value) return null;
          return build(value);
        }).filter(Boolean);
      }

      function phraseWhen(when) {
        if (!when || typeof when !== 'object') return 'every task';
        const clauses = Object.keys(when)
          .map((field) => phraseCondition(field, when[field]))
          .filter(Boolean);
        return clauses.length ? clauses.join(', ') : 'every task';
      }

      // ── elos: how they are billed, how big they are, whose rail they use ──
      // An elo is a tier member: the primary or a fallback hop. Three facts decide
      // whether a chain is any good, and none of them is a colour.

      // Billing is the operator's cost question, and the words are router.yaml's
      // own (BILLING_MODES in router/capabilities.py). A mode the console does not
      // recognise is shown as written rather than swallowed — and a MISSING one is
      // a finding, because a request whose rail is undeclared cannot be costed.
      const BILLING = {
        plan:         'covered by a plan — no per-token invoice',
        subscription: 'covered by a subscription seat',
        metered:      'invoiced per token',
        free:         'no charge',
      };
      function billingBadge(mode) {
        const key = String(mode == null ? '' : mode).trim().toLowerCase();
        if (BILLING[key]) return { word: key, meaning: BILLING[key], unknown: false };
        if (!key) return { word: 'billing undeclared', meaning: 'this elo declares no billing_mode, so its cost cannot be read here', unknown: true };
        return { word: key.replace(/_/g, ' '), meaning: 'not a billing mode this router knows', unknown: true };
      }

      // A context window is compared, not counted: 1M against 200K is the whole
      // reading, and 1,048,576 spends four characters saying nothing an operator
      // acts on. '' means "we do not know", which must never render as zero.
      function ctxWindow(tokens) {
        const value = Number(tokens);
        if (!Number.isFinite(value) || value <= 0) return '';
        if (value >= 1e6) {
          const millions = Math.round(value / 1e5) / 10;
          return `${millions}M`;
        }
        if (value >= 1000) return `${Math.round(value / 1000)}K`;
        return fmt(value);
      }

      // Why an elo was dropped, in words an operator can act on. The engine's
      // reason set is closed (router/capabilities.py _REASONS), so it translates
      // exactly; an unknown one still renders, because a rejection with no reason
      // is the one thing this panel must never show.
      const REJECT = {
        context_too_small:    'its context window is smaller than this task needs',
        no_vision:            'it cannot read images',
        no_tool_calling:      'it cannot call tools',
        no_structured_output: 'it cannot return schema-constrained output',
        capability_unknown:   'its capabilities are unverified',
        // The time cap is a COST refusal, not a capability one: the elo can do the
        // work, the tier declines to pay this hour's price for it.
        time_cap:             'it costs more this hour than the tier’s price cap allows',
        over_time_cap:        'it costs more this hour than the tier’s price cap allows',
      };
      function rejectWhy(reason) {
        const key = String(reason == null ? '' : reason).trim();
        if (REJECT[key]) return REJECT[key];
        if (!key) return 'the capability filter gave no reason';
        return key.replace(/_/g, ' ');
      }
      // The two numbers that make a context rejection actionable: what the elo
      // holds against what the task asked for.
      //
      // WHEN THE COMPARISON IS TIGHTER THAN THE ROUNDING, THE EXACT FIGURES ARE USED.
      // ctxWindow spends four characters on 1,050,000 deliberately, but two values one
      // rounding step apart then print the same string — and "its context window is
      // smaller than this task needs · holds 1.1M, needs 1.1M" is the row denying its
      // own reason. It is reachable on the shipped policy: min_context is
      // ceil(est_input_tokens × 1.25), so a turn of 840,001 tokens needs 1,050,002
      // against gpt-5.6-terra's 1,050,000. A near-miss is exactly when the operator
      // needs the digits, so that is when they are shown.
      function contextShortfall(windowTokens, neededTokens) {
        const have = ctxWindow(windowTokens);
        const need = ctxWindow(neededTokens);
        if (!have || !need) return '';
        if (have === need) {
          const exactHave = Number(windowTokens);
          const exactNeed = Number(neededTokens);
          if (exactHave !== exactNeed) return `holds ${fmt(exactHave)}, needs ${fmt(exactNeed)}`;
        }
        return `holds ${have}, needs ${need}`;
      }

      // ── the clock, and what it does to a price ──────────────────────
      // THE CLOCK IS INJECTED, NEVER READ, in every function below. The router's
      // rules.py and capabilities.py hold that contract because reading a wall
      // clock inside a pure function makes every test time-dependent; the console
      // holds it for the same reason, and because a rendering test that depends on
      // the hour it runs at is a test that fails at 06:00 UTC and nowhere else.
      // So `when` is a parameter — {hour, weekday} with weekday 0 = Monday, the
      // router's own two injected features (utc_hour / utc_weekday) — and
      // `when === null` means TIME-AGNOSTIC: the multiplier is 1.0, no window is
      // reported, and time-relative ordering degrades to sequential. Nothing here
      // guesses an hour. Only nowUtc(), at the edge, touches the real clock.
      //
      // WHERE THE ROUTER HAS ALREADY DONE THE ARITHMETIC, ITS NUMBER WINS. A chain
      // plan reports the hour it planned against (planWhen) and the multiplier the
      // ordering decision was actually made on (plan.multipliers), and both are
      // preferred over anything computed here — the console must not quietly
      // overwrite the router's reasoning with its own. The functions below are what
      // answers the question where no plan reported one, which is every screen that
      // shows DECLARED config rather than a probed task.
      function whenOf(date) {
        if (!date || typeof date.getUTCHours !== 'function') return null;
        const hour = date.getUTCHours();
        if (!Number.isFinite(hour)) return null;
        // JS counts weekdays from Sunday; the router counts from Monday, because
        // that is what a vendor means by "Mon-Fri". Convert once, here.
        return { hour, weekday: (date.getUTCDay() + 6) % 7 };
      }
      const hourLabel = (hour) => {
        const value = Number(hour);
        if (!Number.isFinite(value)) return '—';
        return `${String(Math.floor(value) % 24).padStart(2, '0')}:00 UTC`;
      };
      // A multiplier is read, not computed: "2×" and "0.8×" say the whole thing,
      // and 2.0 would read as a price.
      const times = (value) => `${Number(value)}×`;

      // Both clocks, each LABELLED. The windows are published in UTC and the
      // operator lives in a local zone (UTC−03 here), so a bare "07:14" is
      // ambiguous by exactly the offset — which is the difference between "the
      // peak is on now" and "the peak is three hours off". The offset is passed
      // in rather than read, so this stays pure and testable in any timezone.
      function timeFace(date, offsetMinutes) {
        if (!date || typeof date.getUTCHours !== 'function') return null;
        const pad = (n) => String(n).padStart(2, '0');
        const utcMinutes = date.getUTCHours() * 60 + date.getUTCMinutes();
        const offset = Number.isFinite(Number(offsetMinutes)) ? Math.round(Number(offsetMinutes)) : 0;
        const localMinutes = ((utcMinutes + offset) % 1440 + 1440) % 1440;
        const sign = offset < 0 ? '−' : '+';   // U+2212, so a minus is not a hyphen
        const abs = Math.abs(offset);
        return {
          utc: `${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())} UTC`,
          local: `${pad(Math.floor(localMinutes / 60))}:${pad(localMinutes % 60)} local`,
          zone: `UTC${sign}${pad(Math.floor(abs / 60))}:${pad(abs % 60)}`,
        };
      }

      // The declared windows, per RAIL — and PER RAIL IS THE WHOLE SCOPE OF THIS
      // TABLE. It answers one question, on one line: which vendor is expensive at
      // this hour. It is deliberately here rather than fetched because
      // /capabilities is an OPTIONAL read (DESIGN.md §3c, §7), so a sidecar that
      // does not publish it would leave the clock line blank — and "no window
      // declared" is indistinguishable on screen from "off-peak right now", which
      // is the one confusion that line exists to remove. A registry entry that DOES
      // declare price_windows wins over this table, exactly as `declared` wins over
      // the registry.
      //
      // WHAT IT IS NOT: an elo's price. It used to stand in for one — eloWindows()
      // handed a rail's window to every elo on that rail — and that is how the
      // console came to render flat-priced glm-4.6 as "2× peak" at Monday 07:00
      // while capabilities.price_multiplier('glm-4.6', ...) returned 1.0 and its
      // effective price never moved off (0.60, 2.20). A vendor's peak is a fact
      // about the vendor's windowed models, not about every id it serves, so an
      // ELO's multiplier now comes from what the elo itself declares, from the
      // plan, or from liveness — never from here (see eloWindows).
      // Verified against each vendor's own wording:
      //   deepseek 2.0× at 01:00-04:00 and 06:00-10:00 UTC, every day
      //   zai      2.0× at 06:00-10:00 UTC, Mon-Fri only (14:00-18:00 UTC+8)
      //   xiaomi   0.8× at 16:00-00:00 UTC — a CHEAP window, not a peak
      // Hours are half-open [start, end): hour 10 already bills at base. A window
      // that wraps midnight is written as two entries, so nothing here has to do
      // wrap-around arithmetic. No other rail in this policy varies by clock —
      // OpenAI Batch/Flex and Gemini Batch are 50% off but are separate
      // ENDPOINTS, not hours, and modelling them as windows would misprice every
      // interactive request.
      const RAIL_WINDOWS = {
        deepseek: [{ hours: [1, 4], multiplier: 2 }, { hours: [6, 10], multiplier: 2 }],
        zai: [{ hours: [6, 10], weekdays: [0, 1, 2, 3, 4], multiplier: 2 }],
        xiaomi: [{ hours: [16, 24], multiplier: 0.8 }],
      };

      // A registry entry's windows, read defensively: the payload is a sidecar's,
      // so a shape nobody agreed on must leave the console reporting flat pricing
      // rather than throwing on the first elo. Two spellings are accepted because
      // both are real — `price_windows` is the declared form, and
      // `peak_windows_utc` + `peak_multiplier` is what the registry carried for
      // deepseek before the windows were generalised.
      function entryWindows(entry) {
        const e = entry && typeof entry === 'object' ? entry : {};
        const out = [];
        const push = (hours, multiplier, weekdays) => {
          const pair = Array.isArray(hours) ? hours : [];
          const start = Number(pair[0]);
          const end = Number(pair[1]);
          const m = Number(multiplier);
          if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return;
          if (!Number.isFinite(m) || m <= 0) return;
          const days = (Array.isArray(weekdays) ? weekdays.map(Number) : [])
            .filter((d) => Number.isFinite(d));
          out.push({ hours: [start, end], multiplier: m, weekdays: days.length ? days : null });
        };
        if (Array.isArray(e.price_windows)) {
          e.price_windows.forEach((w) => {
            if (w && typeof w === 'object') push(w.hours_utc || w.hours, w.multiplier, w.weekdays);
          });
        }
        if (!out.length && Array.isArray(e.peak_windows_utc)) {
          e.peak_windows_utc.forEach((w) => push(w, e.peak_multiplier, e.peak_weekdays));
        }
        return out;
      }
      // ONE ELO'S OWN WINDOWS, and nothing else's. This is exactly what
      // capabilities._windows_of reads off the merged capability dict — the elo's
      // declared `price_windows` (or the registry's, which `declared` overrides) —
      // so the console prices an elo off the same declaration the router prices it
      // off, and an elo that declares no window is priced flat by both.
      //
      // THERE IS NO RAIL FALLBACK HERE, and its absence is the fix. Falling back to
      // RAIL_WINDOWS[provider] made this function state a price the running path
      // contradicts: glm-4.6 declares no window and bills a flat (0.60, 2.20), yet
      // it rendered "2× peak · $1.20 in / $4.40 out per 1M" at Monday 07:00 UTC
      // because zai — the rail — has a peak there. An empty list is the honest
      // answer for "this elo declares no window", and it is what makes the elo's
      // multiplier agree with capabilities.price_multiplier for every model in the
      // registry. Which vendor is expensive right now is still said, once, on the
      // clock line, where the claim is about the vendor and is therefore true.
      function eloWindows(caps) {
        return entryWindows(caps);
      }

      // 1.0 when no window matches, when the clock is not supplied, and when
      // nothing declares a window — the same three answers capabilities.
      // price_multiplier gives.
      //
      // THE FIRST MATCH WINS, because capabilities._multiplier_at returns on its
      // first match. Overlaps are a lint error upstream, so neither side is a
      // resolution POLICY — both are determinism guarantees for a malformed
      // registry, and two deterministic fallbacks that disagree are worse than
      // either. This function used to accumulate (last match wins), so for the
      // overlapping pair [{[6,10]: 2.0}, {[8,12]: 3.0}] the router priced hour 9 at
      // 2.0 and this console displayed 3.0 — the display contradicting the run on
      // the one input where the resolution order is observable at all.
      //
      // Preferred over this arithmetic wherever a number exists: the plan's own
      // `multipliers` (what the ordering decision ran on) and liveness's per-elo
      // `price_multiplier`. This is the answer for a view that has neither.
      // THE WEEKDAY, OR NaN FOR "NOBODY SAID". `Number(null)` is 0, and 0 is Monday —
      // so reading `when.weekday` with a bare Number() turns "the plan reported no
      // weekday" into "Monday" and matches zai's Mon-Fri peak on a day nobody named.
      // planWhen produces exactly that shape (`{hour, weekday: null}`) for a plan
      // carrying utc_hour without utc_weekday, so the coercion has to be explicit.
      const weekdayOf = (when) => {
        const value = when && typeof when === 'object' ? when.weekday : null;
        return value === null || value === undefined ? NaN : Number(value);
      };

      // A multiplier SOMEBODY ELSE reported — the plan's, liveness's, the cap's own —
      // or null when they reported nothing usable. null and undefined are both "not
      // reported", and a non-positive number is not a multiplier: capabilities
      // ._multiplier_at skips `multiplier <= 0` for the same reason, and the console
      // must skip it for a louder one. `plan.multipliers` is a mapping the router
      // always emits, so a lookup miss yields undefined — but a plan that omitted the
      // key entirely left this a `null`, which Number() reads as 0, and every elo in
      // the chain then rendered "0× cheap window": a free peak hour, invented by a
      // missing field.
      function reportedMultiplier(value) {
        if (value === undefined || value === null) return null;
        const number = Number(value);
        return Number.isFinite(number) && number > 0 ? number : null;
      }

      function priceMultiplier(windows, when) {
        if (!when || typeof when !== 'object') return 1;
        const hour = Number(when.hour);
        if (!Number.isFinite(hour)) return 1;
        const weekday = weekdayOf(when);
        const list = Array.isArray(windows) ? windows : [];
        for (let i = 0; i < list.length; i += 1) {
          const w = list[i];
          if (!w || !Array.isArray(w.hours)) continue;
          if (hour < w.hours[0] || hour >= w.hours[1]) continue;
          // A weekday-restricted window with no weekday to check against does not
          // match: claiming a peak on an unknown day would overstate the price.
          if (w.weekdays && !(Number.isFinite(weekday) && w.weekdays.indexOf(weekday) >= 0)) continue;
          return w.multiplier;
        }
        return 1;
      }

      // The UTC hour at which this multiplier next changes — what powers "2×
      // until 10:00 UTC". A week of hours is enough to find it: the longest cycle
      // any declared window has is weekly (zai's Mon-Fri peak). null when nothing
      // changes, which is the honest answer for a flat rail.
      function nextWindowChange(windows, when) {
        const list = (Array.isArray(windows) ? windows : []).filter(Boolean);
        if (!list.length || !when || !Number.isFinite(Number(when.hour))) return null;
        const from = priceMultiplier(list, when);
        const hour0 = Math.floor(Number(when.hour));
        // Same rule as priceMultiplier's: an absent or null weekday is unknown, never
        // Monday. It walks the week with `weekday: null`, so a weekday-gated window
        // matches at no hour and the honest answer comes back — null, "cannot say when
        // this changes without knowing the day" — rather than a countdown to a peak
        // that may be two days off.
        const day0 = weekdayOf(when);
        const weekday0 = Number.isFinite(day0) ? day0 : null;
        for (let ahead = 1; ahead <= 24 * 7; ahead += 1) {
          const hour = (hour0 + ahead) % 24;
          const weekday = weekday0 === null ? null : (weekday0 + Math.floor((hour0 + ahead) / 24)) % 7;
          const multiplier = priceMultiplier(list, { hour, weekday });
          if (multiplier !== from) return { hour, weekday, hoursAhead: ahead, multiplier };
        }
        return null;
      }

      // What a rail costs right now, and until when. Written as one clause so the
      // clock line reads as a sentence rather than a table of numbers.
      function windowWords(windows, when) {
        const list = (Array.isArray(windows) ? windows : []).filter(Boolean);
        if (!list.length) return 'no time-varying price';
        if (!when || typeof when !== 'object') return 'time-agnostic — no clock supplied';
        const multiplier = priceMultiplier(list, when);
        const next = nextWindowChange(list, when);
        const until = next ? ` until ${hourLabel(next.hour)}` : '';
        if (multiplier > 1) return `${times(multiplier)} peak${until}`;
        if (multiplier < 1) return `${times(multiplier)} cheap window${until}`;
        if (!next) return 'base rate at every hour';
        return `base rate until ${hourLabel(next.hour)}, then ${times(next.multiplier)}`;
      }

      // The clock line's own rows: one per rail that prices by the hour, the
      // expensive ones first because they are the ones that change a decision.
      function railWindowRows(registry, when) {
        const rails = {};
        Object.keys(RAIL_WINDOWS).forEach((rail) => { rails[rail] = RAIL_WINDOWS[rail].slice(); });
        const table = registry && typeof registry === 'object' ? registry : {};
        const fromRegistry = {};
        Object.keys(table).forEach((model) => {
          const entry = table[model];
          const rail = String((entry && entry.provider) || '').trim().toLowerCase();
          const windows = entryWindows(entry);
          if (!rail || !windows.length || fromRegistry[rail]) return;
          rails[rail] = windows;   // a published window beats the built-in table
          fromRegistry[rail] = true;
        });
        return Object.keys(rails).map((rail) => {
          const windows = rails[rail];
          const multiplier = priceMultiplier(windows, when);
          const next = nextWindowChange(windows, when);
          return {
            rail,
            multiplier,
            expensive: multiplier > 1,
            cheap: multiplier < 1,
            changesAt: next ? next.hour : null,
            words: windowWords(windows, when),
          };
        }).sort((a, b) => (b.multiplier - a.multiplier) || (a.rail < b.rail ? -1 : 1));
      }

      // ── the multipliers THE SERVER ALREADY COMPUTED ──────────────────
      // GET /liveness reports, per elo, `price_multiplier`, `in_expensive_window`
      // and `next_window_change` — service.py asks capabilities for all three, so
      // they are the running path's own numbers rather than a second opinion. This
      // console computed its own instead and read none of them; where both exist
      // the server's wins, which is the only arrangement in which the two cannot
      // disagree.
      //
      // THE HOUR IS THE GATE. liveness names the hour it evaluated at
      // (`evaluated_at.utc_hour` / `utc_weekday`), and a payload read at 09:59 and
      // rendered at 10:00 describes the PREVIOUS hour — a stale peak is exactly as
      // wrong as an invented one, and this line repaints every minute. So the index
      // is EMPTY unless the server's hour (and, when both report one, weekday) is
      // the hour being rendered. Empty means "no server answer for this hour", and
      // the caller then falls back to the declared windows; it never means 1.0.
      function liveMultipliers(liveness, when) {
        const source = liveness && typeof liveness === 'object' ? liveness : {};
        const at = source.evaluated_at && typeof source.evaluated_at === 'object'
          ? source.evaluated_at : {};
        const target = when && typeof when === 'object' ? Number(when.hour) : NaN;
        const hour = Number(at.utc_hour);
        if (!Number.isFinite(hour) || !Number.isFinite(target)) return {};
        if (Math.floor(hour) !== Math.floor(target)) return {};
        const day = at.utc_weekday === null || at.utc_weekday === undefined ? NaN : Number(at.utc_weekday);
        const targetDay = weekdayOf(when);
        // A weekday-gated window (zai's Mon-Fri peak) makes the same hour cost
        // double or nothing depending on the day, so a reported day that disagrees
        // disqualifies the whole read. A read that reports no day is not
        // contradicted by one, so it still counts — and an ABSENT day is absent, not
        // Monday, which is what Number(null) would have made it.
        if (Number.isFinite(day) && Number.isFinite(targetDay) && day !== targetDay) return {};
        const index = {};
        (Array.isArray(source.models) ? source.models : []).forEach((entry) => {
          if (!entry || typeof entry !== 'object') return;
          const model = String(entry.model || '');
          const multiplier = Number(entry.price_multiplier);
          if (!model || index[model]) return;
          // A multiplier that is not a positive number is not an answer. Reporting
          // 1.0 for it would claim the base rate was checked.
          if (!Number.isFinite(multiplier) || multiplier <= 0) return;
          const change = entry.next_window_change && typeof entry.next_window_change === 'object'
            ? entry.next_window_change : null;
          const changesAt = change ? Number(change.hour) : NaN;
          index[model] = {
            multiplier,
            // The SERVER decides what counts as expensive: in_expensive_window is
            // True only above 1.0, so xiaomi's 0.8× discount never reads as
            // "avoid this now". A recomputed `multiplier > 1` would be a second
            // definition of the same word.
            expensive: entry.in_expensive_window === true,
            changesAt: Number.isFinite(changesAt) ? Math.floor(changesAt) : null,
          };
        });
        return index;
      }

      // The price the comparison actually used. null — never (0, 0) — when nothing
      // publishes a per-token rate: a plan model is not free, its cost is
      // denominated in credits, and a rendered $0 would make it look like the
      // cheapest thing on the screen when it is merely the least priced. A real
      // 0.00 (a genuinely free rail) is a published price and survives.
      //
      // WHERE THE RATE COMES FROM: the elo's own declared keys, which reach here
      // through GET /policy (a tier's `declared_capabilities` is merged onto the
      // primary by rules._build_chain, and a fallback hop arrives whole), and
      // otherwise the capability registry where the sidecar publishes one. Declared
      // wins, so an operator who corrects a stale rate in router.yaml sees their own
      // number. Where NEITHER publishes a rate the console says nothing about
      // price, which is the only honest answer available to it.
      function effectivePrices(caps, multiplier) {
        const e = caps && typeof caps === 'object' ? caps : {};
        if (e.price_in == null || e.price_out == null) return null;
        const inRate = Number(e.price_in);
        const outRate = Number(e.price_out);
        if (!Number.isFinite(inRate) || !Number.isFinite(outRate)) return null;
        const m = Number.isFinite(Number(multiplier)) ? Number(multiplier) : 1;
        return { in: inRate * m, out: outRate * m };
      }
      // USD per 1M tokens. Two decimals, three under a cent — a cache-hit rate of
      // $0.007 must not round to "$0.01" on a screen used to check an invoice.
      function money(value) {
        const v = Number(value);
        if (!Number.isFinite(v)) return '';
        if (v === 0) return '$0';
        return `$${v < 0.01 ? v.toFixed(3) : v.toFixed(2)}`;
      }
      // DOES THIS ELO PUBLISH A PER-TOKEN RATE? THREE-VALUED, like pin_primary and
      // for the same reason: `true` and `false` are answers somebody gave, and null
      // means NOBODY ANSWERED. Collapsing null into false is how the panel came to
      // print "no per-token price published" against deepseek-v4-flash, which
      // publishes 0.22 in / 0.66 out — a confident false statement about the busiest
      // metered rail, produced by an unread catalogue rather than by any missing
      // price. An unanswered question renders as silence.
      //
      // `price_published` is the catalogue's own field, and service.py computes it by
      // asking capabilities.effective_price — the function cheapest_now RANKS on —
      // so this surface cannot disagree with the ordering it is auditing. A rate
      // declared on the elo in router.yaml still wins over it, exactly as `declared`
      // wins over the registry everywhere else.
      function pricePublished(caps, entry) {
        const e = caps && typeof caps === 'object' ? caps : {};
        // A usable pair IS a published price, whoever published it.
        if (effectivePrices(e, 1)) return true;
        const record = entry && typeof entry === 'object' ? entry : null;
        if (record && typeof record.price_published === 'boolean') return record.price_published;
        // The key is present and explicitly empty: that is a publisher saying "no
        // dollar rate for this one", which is a fact and not a gap.
        if (e.price_in === null || e.price_out === null) return false;
        return null;
      }

      // One elo's cost at the hour it was planned for: the multiplier that was
      // applied — the ROUTER'S whenever the plan or liveness reports one — and the
      // two prices the comparison ran on. Empty when there is nothing to say: a flat
      // rail with no published rate spends no line on saying so twice.
      //
      // `published` is pricePublished()'s three-valued answer. false is a REPORTED
      // absence and earns words — the credits an elo is billed in are what it costs,
      // and an operator has to know a plan rail is not free. null is an unanswered
      // question and earns none: nothing here may state that a price does not exist
      // on the strength of not having read one. A missing rate is NEVER $0 either
      // way (see effectivePrices), because a plan rail billed in credits rendered as
      // zero would look like the cheapest thing on the screen.
      function priceWords(caps, multiplier, billingMode, published) {
        const m = Number.isFinite(Number(multiplier)) ? Number(multiplier) : 1;
        const prices = effectivePrices(caps, m);
        const parts = [];
        if (m > 1) parts.push(`${times(m)} peak`);
        else if (m < 1) parts.push(`${times(m)} cheap window`);
        if (prices) parts.push(`${money(prices.in)} in / ${money(prices.out)} out per 1M`);
        else {
          // Three arguments is the old call shape and it carried no answer, so the
          // caps themselves are asked. Nothing here invents one.
          const known = published === undefined ? pricePublished(caps, null) : published;
          const mode = String(billingMode == null ? '' : billingMode).trim().toLowerCase();
          const covered = mode === 'plan' || mode === 'subscription';
          if (known === false && (m !== 1 || covered)) {
            parts.push(covered
              ? `billed in ${mode} credits — no per-token price published`
              : 'no per-token price published');
          }
        }
        return parts.join(' · ');
      }

      // Sequential, random and cheapest_now must be distinguishable instantly AND
      // honestly: one is a list with a first and a next, the second is a set with
      // neither, and the third is a list whose order is only true of one hour. The
      // renderer reads `ordered` to decide whether the chain gets ordinals and a
      // spine at all. An unrecognised strategy degrades to sequential exactly as
      // capabilities.order_chain does, and says so — silently pretending the
      // typo'd word worked is how a chain gets read backwards.
      //
      // pin_primary is now THREE-VALUED here, and that is the point. true and
      // false are what the tier declares; null means nobody told us. The console
      // used to read an absent field as true, so a chain plan that never carried
      // the key at all printed "the primary stays first" and drew hop 1 as
      // ordinal 1 while order_chain had shuffled index 0 — the console stating
      // the opposite of what ran. Unknown therefore draws NO ordinals and says
      // the ordering is unreported: a missing fact must fail toward saying so,
      // never toward a confident wrong claim.
      const STRATEGIES = { sequential: true, random: true, cheapest_now: true };
      function strategyWords(strategy, options) {
        const opts = options || {};
        const raw = String(strategy == null ? '' : strategy).trim().toLowerCase();
        const key = raw || 'sequential';
        const pinPrimary = opts.pinPrimary === true ? true : (opts.pinPrimary === false ? false : null);
        const when = opts.when && typeof opts.when === 'object' ? opts.when : null;
        const degraded = opts.degraded === true;
        const ordered = (extra) => Object.assign({
          declared: key, key: 'sequential', ordered: true, pinPrimary,
          timeRelative: false, label: 'tried in order', note: '',
        }, extra || {});

        if (!STRATEGIES[key]) {
          return ordered({ note: `“${raw}” is not a strategy the router knows, so it falls back to trying them in order` });
        }
        if (key === 'random') {
          // The router degrades `random` to declared order when no random source
          // was injected, and the plan still reports the declared word — so the
          // console reports the DEGRADATION, not the label it was handed.
          if (degraded) {
            return ordered({ note: '“random” needed a random source the caller did not supply, so the chain was tried in declared order' });
          }
          return {
            declared: 'random', key: 'random', ordered: false, pinPrimary, timeRelative: false,
            label: 'tried in a random order',
            note: pinPrimary === true
              ? 'the primary stays first; the rest are drawn at random on every request'
              : pinPrimary === false
                ? 'every elo is drawn at random on every request'
                : 'pin_primary is not reported here, so which elo runs first is unknown — none is drawn as first',
          };
        }
        if (key === 'cheapest_now') {
          // With no clock, cheapest_now IS sequential (capabilities.order_chain),
          // and an order labelled "cheapest" that is really declared order is the
          // most expensive kind of wrong on this screen.
          if (degraded || !when) {
            return ordered({ note: '“cheapest now” needs a clock; none was supplied, so the chain was tried in declared order' });
          }
          return {
            declared: 'cheapest_now', key: 'cheapest_now', ordered: true, pinPrimary, timeRelative: true,
            label: 'tried cheapest first',
            note: `ordered by output price at ${hourLabel(when.hour)} — TIME-RELATIVE, not the declared order${pinPrimary === true ? ', primary pinned first' : ''}`,
          };
        }
        // No note for the ordinary case: "top to bottom, every time" is one fact
        // written twice beside "tried in order", which DESIGN.md §2.3 forbids. A
        // note exists only where the strategy does something the label cannot
        // imply — a random draw, a price-ordered chain, or a word the router did
        // not understand.
        return ordered();
      }

      // pin_primary as the ROUTER reads it off a tier: rules._pin_primary_of
      // defaults it to True and coerces a non-boolean to True. The console reads
      // the same file the router does, so absence in the POLICY is the documented
      // default rather than missing information — unlike absence in a chain plan,
      // which is a computed result that simply did not report it.
      const declaredPin = (value) => (typeof value === 'boolean' ? value : true);

      // Redundancy is about UPSTREAMS, not names. Nous Portal is a white-label
      // reseller in front of OpenRouter, so a chain that hops from one to the
      // other survives nothing — this mirrors capabilities._UPSTREAM_GROUPS, and
      // it is two entries rather than a fetch because getting it wrong overstates
      // redundancy, which is the failure this line exists to catch.
      const UPSTREAM = { nous: 'openrouter', openrouter: 'openrouter' };
      function upstreamGroup(provider) {
        const name = String(provider == null ? '' : provider).trim().toLowerCase();
        if (!name) return '';
        return UPSTREAM[name] || name;
      }
      function independentRails(hops) {
        const groups = [];
        (Array.isArray(hops) ? hops : []).forEach((hop) => {
          const group = upstreamGroup(hop && hop.provider);
          // An unattributable hop is not evidence of independence.
          if (group && groups.indexOf(group) < 0) groups.push(group);
        });
        return groups.length;
      }
      // The first two hops are the ones that matter: a chain whose primary and
      // first fallback share an upstream has no redundancy where redundancy is
      // actually used, however many vendors are listed below them.
      function sharedUpstream(hops) {
        const list = Array.isArray(hops) ? hops : [];
        for (let i = 0; i < list.length; i += 1) {
          for (let j = i + 1; j < list.length; j += 1) {
            const a = upstreamGroup(list[i] && list[i].provider);
            const b = upstreamGroup(list[j] && list[j].provider);
            if (a && a === b) return { group: a, first: i + 1, second: j + 1 };
          }
        }
        return null;
      }

      // Capability facts for one elo. The keys are the capability and commercial
      // fields router.yaml may carry on an elo, and they arrive through GET /policy;
      // `declared` keys on the elo itself WIN over the registry — the same
      // precedence capabilities.capabilities_for applies, so an operator who
      // corrects a stale window or rate in YAML sees THEIR number here. Nothing is
      // inferred: an absent window renders as no claim, never as zero. `verified`
      // false means nothing knows this model: it routes, but unchecked, which the
      // chain view has to say out loud.
      // The price fields are in this list for the same reason the window is: an
      // operator who corrects a stale rate on the elo in router.yaml must see
      // THEIR number in the comparison, not the registry's.
      const CAP_FIELDS = ['provider', 'context_window', 'max_input_tokens', 'max_output',
                          'vision', 'tool_calling', 'structured_output', 'billing_mode',
                          'price_in', 'price_out', 'price_windows',
                          'peak_multiplier', 'peak_windows_utc'];
      function hopCaps(hop, registry) {
        const elo = hop && typeof hop === 'object' ? hop : {};
        const model = String(elo.model || '');
        const table = registry && typeof registry === 'object' ? registry : {};
        const entry = model && table[model] && typeof table[model] === 'object' ? table[model] : null;
        const caps = Object.assign({}, entry);
        CAP_FIELDS.forEach((key) => { if (elo[key] !== undefined) caps[key] = elo[key]; });
        // `published` travels WITH the caps, because the question "is there a rate?"
        // is only answerable next to the catalogue entry that answered it: an elo the
        // catalogue never described has no answer at all, and priceWords must then
        // say nothing rather than assert an absence.
        return {
          caps,
          verified: !!entry || caps.context_window !== undefined,
          published: pricePublished(caps, entry),
        };
      }

      // The registry as this console needs it: {model: {context_window, ...}}. The
      // payload is read defensively rather than trusted — a sidecar that answers
      // 404, or answers with a shape nobody agreed on, must leave the chain view
      // saying "unverified" instead of throwing on the first tier.
      //
      // GET /capabilities now exists and serves `{models: {...}, unknown_models,
      // warnings, registry_available, time_agnostic}` — the catalogue behind the
      // price audit, carrying `price_in`/`price_out`/`price_windows` and the
      // `price_published` flag service.py asks the running path for. So the envelope
      // is read by NAME first: `{models: {}}` is a real answer ("the endpoint
      // answered and the registry knows nothing"), and letting it fall through to
      // reading the envelope itself as a model table produced a registry holding one
      // entry called "models" — a model id that does not exist, presented as
      // verified capability data.
      function capabilityRegistry(result) {
        const res = result && typeof result === 'object' ? result : {};
        if (res.missing || res.error) return null;
        const data = res.data && typeof res.data === 'object' && !Array.isArray(res.data) ? res.data : {};
        const named = [data.models, data.capabilities].find(
          (candidate) => candidate && typeof candidate === 'object' && !Array.isArray(candidate),
        );
        // A flat map is accepted too, for a sidecar that publishes no envelope: the
        // console must not need a shape negotiation to show a context window.
        const table = named || (Object.keys(data).some(
          (key) => data[key] && typeof data[key] === 'object' && !Array.isArray(data[key]),
        ) ? data : null);
        if (!table) return null;
        const clean = {};
        Object.keys(table).forEach((model) => {
          const entry = table[model];
          if (entry && typeof entry === 'object' && !Array.isArray(entry)) clean[model] = entry;
        });
        return Object.keys(clean).length ? clean : null;
      }

      // Every billing mode the POLICY declares, indexed by model. The chain plan's
      // primary hop carries only {model, provider} (rules._build_chain), so without
      // this the elo an operator reads most often would be the one whose rail is
      // reported as undeclared — false, and about the most important hop.
      function billingIndex(policy) {
        const index = {};
        const learn = (elo) => {
          if (!elo || typeof elo !== 'object') return;
          const model = String(elo.model || '');
          if (model && !index[model] && elo.billing_mode) index[model] = elo.billing_mode;
        };
        const walk = (elo) => {
          learn(elo);
          if (elo && Array.isArray(elo.fallback)) elo.fallback.forEach(learn);
          if (elo && Array.isArray(elo.chain)) elo.chain.forEach(learn);
        };
        const p = policy && typeof policy === 'object' ? policy : {};
        const tiers = p.tiers && typeof p.tiers === 'object' ? p.tiers : {};
        Object.keys(tiers).forEach((name) => walk(tiers[name]));
        walk(p.fail_safe);
        walk(p.classifier);
        walk(p.default);
        return index;
      }

      // ── state semantics ─────────────────────────────────────────────
      const RANK = { alive: 0, degraded: 1, quota: 2, dead: 3 };
      function modelState(entry) {
        const raw = String((entry && (entry.state || entry.status)) || '').toLowerCase();
        if (raw.includes('quota')) return 'quota';
        if (raw.includes('dead') || raw.includes('unreachable')) return 'dead';
        if (raw.includes('degrad') || raw.includes('half')) return 'degraded';
        if (raw.includes('alive') || raw === 'ok' || raw === 'closed') return 'alive';
        return '';
      }
      function worstOf(models) {
        return models.reduce((worst, m) => {
          const s = modelState(m);
          return (RANK[s] ?? -1) > (RANK[worst] ?? -1) ? s : worst;
        }, 'alive');
      }
      function causeColor(cause) {
        const c = String(cause || '');
        if (c.includes('veto') || c.includes('fail_safe')) return 'var(--bad-text)';
        if (c === 'classifier') return 'var(--info-text)';
        return 'var(--ok-text)';
      }

      // ── rail ────────────────────────────────────────────────────────
      function renderRail() {
        const models = (state.liveness && Array.isArray(state.liveness.models)) ? state.liveness.models : [];
        const rules = (state.policy && Array.isArray(state.policy.rules)) ? state.policy.rules : [];
        const routes = Array.isArray(state.routes) ? state.routes : [];
        const bl = state.blocklist || {};
        const bans = Array.isArray(bl.manual_bans) ? bl.manual_bans : [];
        const breakers = Array.isArray(bl.breaker_cooldowns) ? bl.breaker_cooldowns : [];

        const set = (wrapId, countId, cls, count) => {
          const wrap = $(wrapId);
          if (wrap) wrap.className = `tab-state${cls ? ` is-${cls}` : ''}`;
          const badge = $(countId);
          if (badge) { badge.textContent = String(count); badge.hidden = !count; }
        };
        const health = state.unreachable ? 'dead' : (models.length ? worstOf(models) : '');
        set('stateHealth', 'countHealth', health, bans.length + breakers.length || models.length);
        // The Pipeline dot reports the POLICY, never the operator's own mode. It
        // used to go amber ('degraded') whenever editing was open, so the console
        // claimed the router was degraded because someone had clicked a button —
        // and amber is the colour that means "this needs your attention". An
        // invalid policy is a real degradation; an open editor is not.
        const invalid = Array.isArray(state.status && state.status.validation_errors)
          && state.status.validation_errors.length > 0;
        set('statePipeline', 'countPipeline',
            invalid ? 'degraded' : (state.policy ? 'alive' : ''), rules.length);
        set('stateRoutes', 'countRoutes', routes.length ? 'alive' : '', routes.length);

        const reach = $('reach');
        // is-fresh means "nothing to report about the read itself", which is what
        // lets the phone drop the clock and keep the title. Anything else — no read
        // yet, or a dead sidecar — keeps its words at every width.
        const fresh = !state.unreachable && !!state.checkedAt;
        reach.className = `reach${fresh ? ' is-fresh' : ''}`
          + `${state.unreachable ? ' is-dead' : (state.health ? ' is-alive' : '')}`;
        $('reachText').textContent = state.unreachable
          ? 'sidecar unreachable'
          : state.checkedAt ? `checked ${clock(state.checkedAt)}` : 'checking';
      }

      // ── the pricing clock ───────────────────────────────────────────
      // One persistent line, on every screen: what hour it is and which rails are
      // expensive at it. It is persistent because the hour is not a screen's
      // subject — it changes what every screen means, and an operator who opens
      // the console at 06:30 UTC to ask why a task went to the subscription rail
      // has to be able to see the answer without probing anything.
      function renderClock() {
        const bar = $('clockbar');
        if (!bar) return;
        const at = nowUtc();
        const face = timeFace(at, -at.getTimezoneOffset());
        const rows = railWindowRows(state.capabilities, whenOf(at));
        bar.hidden = !face || !rows.length;
        if (bar.hidden) return;
        const utc = $('clockNow');
        utc.textContent = face.utc;
        // A real <time> with a machine-readable instant, so the value is not only
        // a string that happens to look like a clock.
        utc.setAttribute('datetime', at.toISOString());
        // The local reading names its own offset. "04:14 local" alone is the
        // ambiguity this line exists to remove, not a shorter way of saying it.
        $('clockLocal').textContent = `${face.local} (${face.zone})`;
        const list = $('clockRails');
        clear(list);
        rows.forEach((row) => {
          const item = el('li', `clock-rail${row.expensive ? ' peak' : ''}`);
          item.append(el('span', 'clock-rail-name', row.rail), el('span', '', ` ${row.words}`));
          list.append(item);
        });
      }

      // ── warnings: only conditions that need an operator ─────────────
      function renderWarnings() {
        const box = $('warnings');
        clear(box);
        if (state.unreachable) {
          const line = el('div', 'warn-line bad');
          line.append(el('strong', '', 'Sidecar unreachable.'),
                      el('span', '', 'Reads and writes are unavailable until the proxy answers.'));
          box.append(line);
          return;
        }
        // A policy that fails lint is the one condition that stops the console
        // answering its own questions: RouterService.explain refuses outright, so
        // the probe and the chain plan are dead until it passes. The errors are
        // named here, where the operator is, rather than left in the lint endpoint.
        const errors = Array.isArray(state.status && state.status.validation_errors)
          ? state.status.validation_errors : [];
        if (errors.length) {
          const line = el('div', 'warn-line');
          line.append(el('strong', '', `Policy invalid — ${errors.length} error${errors.length === 1 ? '' : 's'}.`),
                      el('span', '', `Dry runs are refused until it passes lint. First: ${String(errors[0])}`));
          box.append(line);
        }
        if (state.mode === 'editing' && !csrf()) {
          const line = el('div', 'warn-line');
          line.append(el('strong', '', 'Editing cannot apply here.'),
                      el('span', '', 'This console is open standalone, so the WebUI grants it no write token. Open the Router panel inside Hermes One.'));
          box.append(line);
        }
      }

      // ── Health ──────────────────────────────────────────────────────
      function renderHealth() {
        const facts = $('healthFacts');
        clear(facts);
        const st = state.status || {};
        const rules = (state.policy && state.policy.rules) || [];
        // Mono is for machine facts — a model id, a count, something an operator
        // would copy — and sans for words. "on" is a word; "deepseek-v3.2" is not.
        const fact = (label, value, mono) => {
          const f = el('div', 'fact');
          f.append(el('span', 'fact-label', label),
                   el('span', `fact-value${mono ? ' is-mono' : ''}`, value));
          facts.append(f);
        };
        fact('routing', say(st.enabled === undefined ? undefined : st.enabled, '—') === 'yes' ? 'on' : 'off');
        fact('rules', String(rules.length || st.rules_count || 0), true);
        const classifier = (st.classifier && st.classifier.model) || (state.policy && state.policy.classifier && state.policy.classifier.model);
        if (classifier) fact('classifier', classifier, true);
        const errors = Array.isArray(st.validation_errors) ? st.validation_errors : [];
        if (errors.length) fact('invalid', `${errors.length} error${errors.length > 1 ? 's' : ''}`);

        const list = $('models');
        clear(list);
        const models = (state.liveness && Array.isArray(state.liveness.models)) ? state.liveness.models : [];

        // Say the state of the SET, so an operator does not have to count rows and
        // compare their colours to answer "is everything fine?". Only the exception
        // is named: "5 reachable" is the whole story when it is true, and when it
        // is not, the number that matters is how many are not.
        const notWell = models.filter((m) => {
          const st = modelState(m);
          return st && st !== 'alive';
        });
        // Never claim reachability the console cannot currently know. state.liveness
        // keeps the LAST successful read, so when the sidecar goes away this line
        // would go on asserting "all 5 reachable" over a dead measurement — the one
        // moment an operator most needs to distrust it. Unreachable says so; the rows
        // below still show the last known states, which is useful as history but not
        // as a claim about now.
        //
        // This sentence is now the FIRST LINE of the screen — the answer to
        // "which models can be routed to right now" — so it is set at the 16px
        // step rather than as a 13px note beside a heading that repeated the
        // rail. When there is nothing to answer with yet, it renders nothing at
        // all rather than an empty line holding space open (DESIGN.md §2.1).
        const note = $('modelsNote');
        note.textContent = !models.length ? ''
          : state.unreachable ? 'last known — the sidecar is not answering'
          : notWell.length
            ? `${notWell.length} of ${models.length} not routable`
            : `all ${models.length} reachable`;

        if (!models.length) {
          list.append(el('p', 'nothing', absence('No routable models reported.')));
        } else {
          models.forEach((m) => {
            const cls = modelState(m);
            const row = el('div', `row${cls ? ` is-${cls}` : ''}`);
            row.append(el('span', 'dot'));
            const name = el('div', 'row-main');
            name.append(el('div', 'row-name', m.model || m.model_key || '—'));
            const rail = m.provider || (String(m.model_key || '').split('@')[1] || '');
            if (rail) name.append(el('div', 'row-note', rail));
            row.append(name);
            const right = el('div');
            right.append(el('span', 'state', cls || 'unknown'));
            const cooldown = m.breaker && Number(m.breaker.cooldown_remaining_s);
            if (cooldown > 0) right.append(el('div', 'row-value', `${Math.ceil(cooldown)}s cooldown`));
            row.append(right);
            list.append(row);
          });
        }

        const bl = state.blocklist || {};
        const bans = Array.isArray(bl.manual_bans) ? bl.manual_bans : [];
        const breakers = Array.isArray(bl.breaker_cooldowns) ? bl.breaker_cooldowns : [];
        const group = $('bansGroup');
        const banBox = $('bans');
        clear(banBox);
        group.hidden = !(bans.length || breakers.length);
        bans.forEach((b) => {
          const row = el('div', 'row is-dead');
          row.append(el('span', 'dot'));
          const name = el('div', 'row-main');
          name.append(el('div', 'row-name', b.model || say(b)));
          if (b.reason) name.append(el('div', 'row-note', b.reason));
          row.append(name, el('span', 'state', 'banned'));
          banBox.append(row);
        });
        breakers.forEach((b) => {
          const row = el('div', 'row is-degraded');
          row.append(el('span', 'dot'));
          const name = el('div', 'row-main');
          name.append(el('div', 'row-name', b.model_key || '—'));
          if (b.last_failure_kind) name.append(el('div', 'row-note', b.last_failure_kind));
          row.append(name);
          row.append(el('span', 'row-value', `${Math.ceil(Number(b.cooldown_remaining_s) || 0)}s left`));
          banBox.append(row);
        });

        const comp = $('compaction');
        clear(comp);
        const c = state.compaction;
        $('compactionApply').hidden = !c;
        if (!c) {
          $('compactionNote').textContent = 'not implemented by this sidecar';
          return;
        }

        // The three numbers here were printed raw: "aggressiveness 50",
        // "summarizer window 272000", "compacts at 208352". An operator cannot act
        // on that without doing arithmetic — 208352 is only meaningful next to the
        // window it is a fraction of. The sidecar already returns
        // threshold_fraction and computes the ratio; the console was discarding it.
        // So the sentence says the relationship, and the numbers back it up.
        const window = Number(c.summarizer_window) || 0;
        const at = Number(c.threshold_tokens) || 0;
        const share = c.threshold_fraction !== undefined
          ? Number(c.threshold_fraction)
          : (window ? at / window : 0);
        // "at 77% of the window" is the trigger POINT, not current usage — and next
        // to a label reading COMPACTS AT it could be read as "we are at 77%", which
        // is a wrong reading of an action that restarts the agent. So the sentence
        // says when, explicitly. (Verified against router/threshold.py: p_eff(272000,
        // 50) == 0.766 and 0.766 * 272000 == 208352, matching what the sidecar
        // returns. The console does not know current usage — nothing in /compaction
        // reports it — so it must not imply it.)
        $('compactionNote').textContent = window && at
          ? `fires once a conversation fills ${Math.round(share * 100)}% of the ${fmt(window)}-token window`
          : '';

        const fact2 = (label, value, note) => {
          const f = el('div', 'fact');
          f.append(el('span', 'fact-label', label), el('span', 'fact-value', value));
          if (note) f.append(el('span', 'fact-note', note));
          comp.append(f);
        };
        // The dial has NAMES on the server — router/threshold.py PRESETS maps
        // Max-context 0, Conservative 25, Balanced 50, Aggressive 100 — so the
        // console says the word and keeps the number, rather than printing a bare
        // 50 that reads like a token count beside 272,000.
        //
        // The direction is counter-intuitive and worth stating: p_eff subtracts
        // 0.002 per point (threshold.py:28), so MORE aggressive means a LOWER
        // threshold, i.e. compacting sooner and more often. An operator raising this
        // to "make it do less" would get the opposite.
        const PRESETS = { 0: 'max context', 25: 'conservative', 50: 'balanced', 100: 'aggressive' };
        const dial = Number(c.aggressiveness);
        const preset = PRESETS[dial];
        fact2('aggressiveness',
              preset || `${say(c.aggressiveness)}/100`,
              preset ? `${dial}/100 · compacts sooner as this rises` : 'compacts sooner as this rises');
        fact2('compacts at', fmt(at), window ? `of ${fmt(window)}` : '');
        if (c.warning) {
          const line = el('div', 'warn-line');
          line.append(el('strong', '', 'Threshold exceeds the window.'),
                      el('span', '', 'Compaction would never fire — lower the aggressiveness.'));
          comp.append(line);
        }
      }

      // ── chain views: the shared vocabulary ──────────────────────────
      // One set of builders serves the rule sheet, the tier chains and the probed
      // task's chain plan, so an elo looks the same wherever it is read and an
      // operator learns the row once. Text only — every string here reaches the DOM
      // through textContent.

      function chipList(chips) {
        const list = el('ul', 'whens');
        chips.forEach((chip) => {
          const item = el('li', `chip ${chip.family}`);
          if (chip.kind) item.append(el('span', 'chip-kind', chip.kind));
          item.append(el('span', 'chip-val', chip.text));
          list.append(item);
        });
        return list;
      }

      // One elo: what it is, whose rail it runs on, how it is billed, how much it
      // can hold. `ord` is null for a chain with no order, and then no ordinal is
      // drawn at all — a "1" on a random draw would be a lie about which runs first.
      function eloRow(hop, opts) {
        const o = opts || {};
        const elo = hop && typeof hop === 'object' ? hop : {};
        const { caps, verified, published } = hopCaps(elo, o.registry);
        const row = el('li', 'hop');
        if (o.ord) row.append(el('span', 'hop-ord', String(o.ord)));
        row.append(el('span', 'hop-model', elo.model || '—'));
        const rail = caps.provider || elo.provider;
        if (rail) row.append(el('span', 'hop-rail', rail));
        const billing = billingBadge(elo.billing_mode !== undefined ? elo.billing_mode
                                    : (caps.billing_mode !== undefined ? caps.billing_mode : o.billing));
        const badge = el('span', `badge${billing.unknown ? ' is-unknown' : ''}`, billing.word);
        badge.title = billing.meaning;
        row.append(badge);
        const window = ctxWindow(caps.context_window);
        // An unverified elo is not a blank cell. Nothing in the registry knows this
        // model, so it routes UNCHECKED — the capability filter cannot reject it and
        // cannot vouch for it either, and that is the operator's problem to know.
        if (window) row.append(el('span', 'hop-ctx', `${window} context`));
        else row.append(el('span', 'hop-ctx unverified', verified ? 'context unpublished' : 'unverified'));
        // What it costs at the injected hour, in ONE order of precedence and never
        // the console's own arithmetic where a server number exists:
        //   1. the plan's `multipliers` — the number the ordering decision RAN on;
        //   2. liveness's per-elo `price_multiplier`, when it was evaluated at this
        //      same hour (see liveMultipliers);
        //   3. the windows the elo itself declares, which is what capabilities
        //      .price_multiplier reads too.
        // Rendered when it is news — inside a window, or when the order itself is
        // price-relative and the operator has to be able to check it.
        const live = o.live && typeof o.live === 'object' ? o.live : null;
        const fromPlan = reportedMultiplier(o.multiplier);
        const planned = fromPlan !== null;
        if (o.when || planned || live) {
          const multiplier = planned ? fromPlan
            : (live ? live.multiplier : priceMultiplier(eloWindows(caps), o.when || null));
          // "Expensive" is the server's own word wherever the server supplied the
          // number: in_expensive_window is True only above 1.0, so a cheap window
          // never takes the amber that means "this needs your attention".
          const expensive = (!planned && live) ? live.expensive : multiplier > 1;
          const words = priceWords(caps, multiplier,
            elo.billing_mode !== undefined ? elo.billing_mode : (caps.billing_mode !== undefined ? caps.billing_mode : o.billing),
            published);
          if (words && (multiplier !== 1 || o.showPrice)) {
            row.append(el('span', `hop-price${expensive ? ' peak' : ''}`, words));
          }
        }
        // Why it sits where it sits: the tier's time policy moved it, and a
        // position an operator cannot explain reads as a bug in the console.
        const moved = timePolicyMove(elo, o.flags);
        if (moved) row.append(el('span', 'hop-move', moved));
        return row;
      }

      // `avoid_peak` demotes an elo to the end of the chain while its rail is in
      // an expensive window; `prefer` promotes one that is not. Both are said in
      // words an operator can act on — the flag alone ("demoted: true") describes
      // a position, not a reason.
      function timePolicyMove(elo, flags) {
        const f = flags && typeof flags === 'object' ? flags : {};
        const own = elo && typeof elo === 'object' ? elo : {};
        const rail = String(own.provider || '').trim().toLowerCase();
        if (own.demoted === true || f.demoted === true) {
          return `moved to the end — ${rail || 'its rail'} is in an expensive window, so it is tried only if everything ahead of it fails`;
        }
        if (own.promoted === true || f.promoted === true) {
          return `moved to the front — this tier prefers it while it is not in an expensive window`;
        }
        return '';
      }

      // Which elos the time layer touched. The plan may report a flag per elo or
      // as a plan-level list of entries (router/cli.py reads both shapes), so the
      // console accepts both and indexes by model.
      const TIME_FLAGS = ['capped', 'demoted', 'promoted'];
      function timeFlagIndex(plan) {
        const p = plan && typeof plan === 'object' ? plan : {};
        const index = {};
        const mark = (model, flag) => {
          const key = String(model || '');
          if (!key) return;
          index[key] = Object.assign({}, index[key]);
          index[key][flag] = true;
        };
        TIME_FLAGS.forEach((flag) => {
          const value = p[flag];
          if (!Array.isArray(value)) return;
          value.forEach((item) => {
            if (item && typeof item === 'object') mark(item.model, flag);
            else if (typeof item === 'string') mark(item, flag);
          });
        });
        return index;
      }

      // A chain, drawn as what it IS. Sequential gets ordinals down a spine;
      // random gets neither, because a set has no first. pin_primary is the honest
      // middle: hop 1 is genuinely first, and the tail genuinely is not ordered, so
      // the primary is drawn ordered and the rest as a set beneath it.
      function chainList(hops, opts) {
        const o = opts || {};
        const list = Array.isArray(hops) ? hops.filter((h) => h && typeof h === 'object') : [];
        const box = el('div');
        if (!list.length) return box;
        const strategy = o.strategy || strategyWords('sequential');
        const draw = (subset, ordered, startAt) => {
          const ul = el('ul', `hops ${ordered ? 'ordered' : 'drawn'}`);
          subset.forEach((hop, i) => {
            const model = String(hop.model || '');
            ul.append(eloRow(hop, {
              ord: ordered ? startAt + i : null,
              registry: o.registry,
              billing: o.billing && o.billing[model],
              when: o.when,
              showPrice: o.showPrice,
              multiplier: o.multipliers && o.multipliers[model],
              live: o.live && o.live[model],
              flags: o.flags && o.flags[model],
            }));
          });
          return ul;
        };
        if (strategy.ordered) { box.append(draw(list, true, 1)); return box; }
        // pinPrimary === true is the only value that earns an ordinal on hop 1.
        // null means the plan did not report it, and an unreported pin drawn as a
        // pin is the exact claim F7 was: "hop 1 runs first" about a chain whose
        // index 0 may have been shuffled.
        if (strategy.pinPrimary === true && list.length > 1) {
          box.append(draw(list.slice(0, 1), true, 1));
          box.append(draw(list.slice(1), false, 0));
          return box;
        }
        box.append(draw(list, false, 0));
        return box;
      }

      // An elo the capability filter dropped. The reason is a sentence, and where
      // the numbers exist they follow it, because "too small" without "holds 200K,
      // needs 500K" is not something an operator can fix.
      function rejectRow(hop, opts) {
        const o = opts || {};
        const elo = hop && typeof hop === 'object' ? hop : {};
        const { caps } = hopCaps(elo, o.registry);
        const row = el('div', 'reject');
        row.append(el('span', 'hop-model', elo.model || '—'));
        const rail = caps.provider || elo.provider;
        if (rail) row.append(el('span', 'hop-rail', rail));
        row.append(el('span', 'reject-why', rejectWhy(elo.reject_reason)));
        if (String(elo.reject_reason || '') === 'context_too_small') {
          const numbers = contextShortfall(caps.context_window, o.needed);
          if (numbers) row.append(el('span', 'reject-num', numbers));
        }
        // A price refusal is only fixable next to the two numbers behind it: what
        // this hour multiplies the rate by, and what the tier is willing to pay. The
        // multiplier is THE CAP'S OWN, in this order: plan.multipliers, then the
        // number apply_time_cap reported on the capped entry itself
        // ({model, multiplier}), then liveness, then the declared windows. Every one
        // of the first three is the value the refusal was actually decided on; the
        // last is the only one this console derives, and it is a fallback.
        const capped = /time_cap/.test(String(elo.reject_reason || '')) || (o.flags && o.flags.capped === true);
        if (capped) {
          const live = o.live && typeof o.live === 'object' ? o.live : null;
          const reported = [o.multiplier, elo.multiplier, live ? live.multiplier : null]
            .map(reportedMultiplier).find((value) => value !== null);
          const multiplier = reported !== undefined && reported !== null ? reported
            : priceMultiplier(eloWindows(caps), o.when || null);
          const cap = Number.isFinite(Number(o.cap)) ? Number(o.cap) : null;
          row.append(el('span', 'reject-num',
            cap !== null ? `${times(multiplier)} now, cap ${times(cap)}` : `${times(multiplier)} now`));
        }
        return row;
      }

      // ── The decision sheet ──────────────────────────────────────────
      // Hit counts come from the recorded traces (cause + rule_id), never from
      // invented telemetry. A rule with zero hits is a real finding, so it is
      // called out rather than hidden.
      function ruleHits() {
        const byRule = {};
        const byCause = {};
        (state.routes || []).forEach((r) => {
          if (r.rule_id) byRule[r.rule_id] = (byRule[r.rule_id] || 0) + 1;
          if (r.cause) byCause[r.cause] = (byCause[r.cause] || 0) + 1;
        });
        return { byRule, byCause, total: (state.routes || []).length };
      }

      // A count is only true of the window it was counted over. Naming that
      // window is what separates "16×" from a claim about right now — the sheet
      // showed 34% fail-safe long after the cause had been fixed.
      function hitsWindow() {
        const routes = state.routes || [];
        if (!routes.length) return '';
        const oldest = routes[routes.length - 1];
        return `counts over the last ${routes.length} decisions, since ${ago(oldest && oldest.ts)}`;
      }

      function renderSheet() {
        const box = $('sheet');
        clear(box);
        const policy = state.policy;
        if (!policy) { box.append(el('p', 'nothing', absence('Policy unavailable.'))); return; }
        const { byRule, byCause, total } = ruleHits();
        const rules = Array.isArray(policy.rules) ? policy.rules : [];
        const editable = state.mode === 'editing';

        const stage = (title, cls, note) => {
          const s = el('div', `stage${cls ? ` ${cls}` : ''}`);
          s.append(el('span', '', title));
          if (note) s.append(el('span', 'stage-note', note));
          return s;
        };

        const line = (opts) => {
          const step = el('div', `step${opts.editable ? ' editable' : ''}${opts.cold ? ' cold' : ''}`);
          // Mark the probe winner HERE rather than after the fact. It used to be applied
          // in probe(), so clicking Edit or Refresh rebuilt the sheet with no .hit while
          // #probeResult still named the winning rule — the verdict and the list
          // disagreed until the operator probed again.
          if (opts.id && !opts.synthetic && String(opts.id) === state.probeRule) {
            step.classList.add('hit');
            step.setAttribute('aria-current', 'true');
          }
          // The dry run names the rule that won; without this the operator has to
          // read a sentence and then find that rule by eye in the list below it.
          // Kong and LaunchDarkly both mark the winning rule in place for the same
          // reason: first-match-wins is only legible if you can see WHERE it stopped.
          // Synthetic rows (default / classifier / fail-safe / blocklist / the runtime
          // note) share the id namespace with real rule ids, and all of those names are
          // lint-clean for a rule. Without a prefix a rule named "default" marked two
          // rows — one of which never matched — and emitted two aria-current. Real ids
          // are matched against String(matched_rule_id); synthetic ones can never
          // collide because a policy id cannot start with the marker.
          if (opts.id) {
            step.dataset.ruleId = opts.synthetic ? `__${opts.id}` : String(opts.id);
          }
          step.append(el('div', 'step-ord', opts.ord || ''));
          const what = el('div', 'step-what');
          what.append(el('div', 'step-id', opts.id));
          // A rule's conditions are a LIST of independent clauses, so they are
          // marked up as one: a real <ul> keeps them separately announced instead
          // of running together into "has codeover 400,000 tokens" — the same trap
          // the probe verdict fell into when a flex gap stood in for a space.
          if (opts.chips && opts.chips.length) what.append(chipList(opts.chips));
          else if (opts.when) what.append(el('div', 'step-when', opts.when));
          step.append(what);
          const to = el('div', 'step-to');
          const dest = el('div', 'step-dest');
          if (opts.target) {
            dest.append(el('span', 'step-arrow', '→'));
            const t = el('span', 'step-target', opts.target);
            if (opts.targetColor) t.style.color = opts.targetColor;
            dest.append(t);
          }
          to.append(dest);
          if (opts.hits !== undefined) {
            const h = el('span', `step-hits${opts.hits === 0 ? ' zero' : ''}`,
                         opts.hits === 0 ? 'never fired' : `${opts.hits}×`);
            to.append(h);
          }
          step.append(to);
          if (opts.onPick) step.addEventListener('click', opts.onPick);
          return step;
        };

        // Stage 0 — deterministic. The product's core principle is that cheap,
        // auditable rules decide before any inference happens.
        box.append(stage('Stage 0 · deterministic', '', hitsWindow()));
        // COLOUR BUDGET FOR THIS SCREEN. Only a REFUSAL is coloured in the
        // destination column. The classifier used to be coloured too, which put
        // five cyan destinations in one viewport against one gold underline, one
        // amber finding and two reds — four hues competing, which is exactly what
        // the host's guide forbids ("one accent at a time; semantic colours for
        // semantic state"). And "goes to the classifier" is not a condition, it is
        // a KIND of destination: it is already named once, on the Stage 1 heading
        // that says asking a model costs a model call. Naming it again on every
        // line that reaches it spends the loudest channel on the least news.
        // What survives: --bad for a refusal (the router declining IS a
        // condition), --warn for a rule that never fired, --info on the single
        // Stage 1 heading, and the accent on the line a probe matched.
        box.append(line({
          ord: '', id: 'blocklist', synthetic: true,
          when: 'the requested model is banned or cooling down',
          target: 'refuse', targetColor: 'var(--bad-text)',
          hits: byCause.blocklist_veto || 0,
          editable, onPick: editable ? () => pickBind({ id: 'blocklist', name: 'blocklist', bind: 'blocklist' }) : null,
        }));
        rules.forEach((r, i) => {
          const then = r.then || {};
          const target = then.deny ? 'refuse' : (then.action === 'classify' ? 'classifier' : (then.model || '—'));
          box.append(line({
            ord: String(i + 1),
            id: r.id != null ? String(r.id) : `rule ${i + 1}`,
            // Chips when there are clauses; the prose form when there are none,
            // because "every task" is a sentence about the rule, not a condition
            // chip an operator can compare against another rule's.
            chips: predicateChips(r.when),
            when: phraseWhen(r.when),
            target,
            targetColor: then.deny ? 'var(--bad-text)' : '',
            hits: byRule[r.id] || 0,
            editable,
            onPick: editable ? () => pickBind({ id: `rule:${r.id}`, name: String(r.id), bind: 'rule', ruleIndex: i }) : null,
          }));
        });
        const def = policy.default || {};
        box.append(line({
          ord: '·', id: 'default', synthetic: true,
          when: 'nothing above matched',
          target: def.action === 'classify' ? 'classifier' : (def.model || '—'),
          targetColor: '',
          editable,
          onPick: editable ? () => pickBind({ id: 'default', name: 'default', bind: 'default' }) : null,
        }));

        // Stage 1 — inference. Marked apart because it costs a model call.
        box.append(stage('Stage 1 · asks a model', 'inference', 'costs a model call'));
        const cls = (state.status && state.status.classifier) || policy.classifier || {};
        box.append(line({
          ord: '', id: 'classifier', synthetic: true,
          when: `${cls.model || '—'} picks a tier`,
          target: 'a tier', targetColor: '',
          hits: byCause.classifier || 0,
          editable,
          onPick: editable ? () => pickBind({ id: 'classifier', name: 'classifier', bind: 'classifier' }) : null,
        }));
        const fs = policy.fail_safe || {};
        const fsHits = byCause.fail_safe_strong || 0;
        box.append(line({
          ord: '', id: 'fail-safe', synthetic: true,
          when: fsHits && total
            ? `when the classifier cannot answer — ${Math.round(100 * fsHits / total)}% of the decisions counted here did`
            : 'when the classifier cannot answer',
          // The fail-safe's target is a model it DID route to, so it is not
          // painted as a refusal. Measured against the live log: 17 of 21
          // off-rule decisions named a model they routed to successfully, so
          // colouring this red called 81% of them failures. The line's own words
          // carry the caveat ("when the classifier cannot answer").
          target: fs.model || '—', targetColor: '',
          hits: fsHits,
          editable,
          onPick: editable ? () => pickBind({ id: 'fail_safe', name: 'fail-safe', bind: 'fail_safe' }) : null,
        }));

        // Runtime helpers are honest about being cold on the live path.
        box.append(stage('Runtime'));
        box.append(line({
          ord: '', id: 'cache · session pin', synthetic: true, cold: true,
          when: 'rebuilt per call on this deployment, so neither carries between tasks',
        }));
      }

      // The elos a tier declares, primary first — the same assembly
      // rules._build_chain performs, so the console shows the chain the router
      // will actually walk rather than a prettier one.
      function tierChain(tier) {
        const t = tier && typeof tier === 'object' ? tier : {};
        const chain = [];
        if (t.model) {
          const primary = { model: t.model, provider: t.provider };
          if (t.billing_mode !== undefined) primary.billing_mode = t.billing_mode;
          const declared = t.declared_capabilities;
          if (declared && typeof declared === 'object') Object.assign(primary, declared);
          chain.push(primary);
        }
        if (Array.isArray(t.fallback)) {
          t.fallback.forEach((hop) => { if (hop && typeof hop === 'object' && hop.model) chain.push(hop); });
        }
        return chain;
      }

      // A tier's declared time knobs, said as what they DO. Each is rendered only
      // when declared: a tier with no cap and no policy spends no words saying so.
      function timeKnobWords(tier) {
        const t = tier && typeof tier === 'object' ? tier : {};
        const words = [];
        const cap = t.time_cap && typeof t.time_cap === 'object' ? Number(t.time_cap.max_multiplier) : NaN;
        if (Number.isFinite(cap)) {
          words.push(`declines any rail over ${times(cap)} — the cap is dropped if that would empty the chain`);
        }
        const policy = t.time_policy && typeof t.time_policy === 'object' ? t.time_policy : {};
        const avoid = Array.isArray(policy.avoid_peak)
          ? policy.avoid_peak.map((p) => String(p)).filter(Boolean) : [];
        if (avoid.length) words.push(`moves ${avoid.join(' and ')} to the end while they are in a peak window`);
        const prefer = Array.isArray(policy.prefer)
          ? policy.prefer.map((m) => String(m)).filter(Boolean) : [];
        if (prefer.length) words.push(`prefers ${prefer.join(' and ')} while they are off-peak`);
        return words;
      }

      // ── Tier chains ─────────────────────────────────────────────────
