<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capability Router</title>
  <!--
    THESIS: An operator opens this to answer three questions — is it healthy, how
      does it route, what did it decide. Everything that serves none of them is
      absent. It refuses the dashboard reflex of framing each fact in its own card
      with a subtitle explaining the card.
    OWN-WORLD: Hermes One's own. There is no palette here: every colour reads a
      --host-* property the theme bridge forwards from the running shell, so the
      console repaints with all 21 skins and both polarities. The header, the tab
      strip, the type ladder and the button shape are the host's measured values.
      The skin's accent marks WHERE YOU ARE and WHAT YOU PICKED; the semantic four
      (--ok/--warn/--info/--bad) report CONDITION and nothing else, so a gold
      underline can never be read as health.
    STORY: Health first — the models it can reach. Pipeline to see and change how
      tasks route, in an explicit edit mode. Routes to replay what really happened,
      step by step.
    FIRST VIEWPORT: A host-shaped header names the surface, a tab strip names the
      three destinations and carries their live state, and then the screen's own
      question is answered in its first line: how many models are routable, or
      where a task would land, or what the log holds.
    FORM: Single self-contained file, one column under a fixed header. Both the
      policy and a trace read as ordered vertical sequences down one spine —
      never a canvas. See DESIGN.md for the rules of subtraction.
  -->
  <style>
    /* ── WHERE EVERY COLOUR COMES FROM ─────────────────────────────────
       Nothing below is a palette. Each token reads a --host-* property that
       hermes-theme-bridge.js forwards from the running shell's resolved theme,
       and the hex after the comma is a FALLBACK — what this console looks like
       when the shell cannot be read at all (bridge missing, frame not yet
       adopted). Those fallbacks are this console's previous hard-coded values,
       so the worst case is the design we already shipped rather than an
       unstyled page.
       The reason is measured: the host ships 21 skins x light/dark. default/dark
       is navy #0D0D1A on warm cream #FFF8DC with a GOLD accent; catppuccin/light
       is #EFF1F5 with a PURPLE one. A copied palette is wrong in 20 skins out of
       21, and in any light skin this console was a black rectangle inside a
       parchment shell — screenshotted.

       ── THE COLOUR RULE, RESTATED FOR A GOLD SHELL ───────────────────
       This console used to have a paper-white accent so that no hue competed
       with a health dot. Inside Hermes One the accent is the SKIN'S IDENTITY and
       the host uses exactly one at a time, so the rule is now split by meaning
       rather than by hue:

         --accent (the skin's gold) marks WHERE YOU ARE and WHAT YOU PICKED:
           the selected tab's underline, the focus ring, the armed Edit mode, the
           selected scope, the row you are replaying, the line your probed task
           matched, and the one committing button. It never reports a condition.

         The semantic four report CONDITION, and only condition:
           --ok alive · --warn degraded · --info quota (and the classifier stage,
           because "it asked a model" is the same kind of fact) · --bad dead or
           refused. Same colour, same meaning, on every screen.

       So a gold underline can never be mistaken for health, and a green dot can
       never be mistaken for selection. */
    :root {
      /* Planes, in the host's own lightness order. --surface-raised and
         --surface-hover take the host's authored WASHES rather than a mix toward
         --text: measured, mixing toward the text colour INVERTS in catppuccin/
         light (bg #EFF1F5, surface #FFFFFF), so a raised plane read as recessed. */
      --bg: var(--host-bg, #0a0a0c);
      --surface: var(--host-surface, #101013);
      --surface-raised: var(--host-surface-subtle, #15151a);
      --surface-hover: var(--host-hover-bg, #1c1c23);
      --line: var(--host-border, #212127);
      --line-strong: var(--host-border2, #33333d);

      /* Text. The host ships exactly TWO steps and so do we: --faint is the same
         value as --muted deliberately. Measured across 21 skins x both
         polarities, --host-muted bottoms out at 3.47:1 against --bg; a third,
         fainter step derived from it measured 2.31:1 — under the 3:1 floor. The
         step below --muted is therefore made in TYPE (11px, uppercase, tracked),
         not in contrast. */
      --text: var(--host-text, #f3f3f6);
      --muted: var(--host-muted, #9a9aa8);
      --faint: var(--host-muted, #61616e);

      --accent: var(--host-accent, #f3f3f6);
      --accent-strong: var(--host-accent-hover, #ffffff);
      --accent-text: var(--host-accent-text, var(--host-accent, #f3f3f6));
      --accent-bg: var(--host-accent-bg, rgba(243, 243, 246, .08));
      --accent-bg-strong: var(--host-accent-bg-strong, rgba(243, 243, 246, .15));
      /* The host declares --panel-head-primary-fg ONLY under `:root.dark`
         (style.css:6525), so in every LIGHT skin the bridge has nothing to forward
         and THIS FALLBACK is what lands on the one filled button on the screen.
         It is near-black, not #fff, and the reason is measured: this file's own
         fail-safe accent is paper white (#f3f3f6, and #ffffff on hover), so a #fff
         foreground computed 1.1:1 and 1.0:1 — an invisible label on the only
         committing control the console has, in exactly the situation the fallbacks
         exist for (no bridge, no host theme). A light accent takes a dark glyph;
         dark skins are unaffected either way, because there the token IS
         forwarded. */
      --accent-fg: var(--host-accent-fg, #0a0a0c);

      /* Condition. Ours are ok/warn/bad/info, the host's are success/warning/
         error/info; the mapping lives here, once. */
      --ok: var(--host-success, #4ade9b);
      --warn: var(--host-warning, #f7b955);
      --bad: var(--host-error, #ff6b7d);
      --info: var(--host-info, #b490ff);
      --ok-bg: transparent;
      --warn-bg: transparent;
      --bad-bg: transparent;
      --info-bg: transparent;
      /* The four above are authored for FILLS — a badge, a dot — and as TEXT they
         fail badly. Measured against every skin in style.css that declares a full
         set (23 palettes, both polarities), raw state colour on that palette's own
         --bg bottoms out at:
           --info 1.38:1 · --success 1.49:1 · --warning 1.61:1 · --error 3.44:1
         all in neon-paint/light. So state WORDS get their own tokens, derived
         below; the pre-mix values here are the honest fallback for an engine with
         no color-mix, where the raw hue at least still means the right thing. */
      --ok-text: var(--host-success, #4ade9b);
      --warn-text: var(--host-warning, #f7b955);
      --bad-text: var(--host-error, #ff6b7d);
      --info-text: var(--host-info, #b490ff);

      --mono: var(--host-font-mono, ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace);
      --sans: var(--host-font-ui, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);

      /* The host's ladder, not a parallel one: it declares 11/12/14px and its
         .main-view-title measures 18px/600/-0.18px. The old 10.5px and 20px
         steps were guest sizes and read as an accident next to host chrome.
         --t-value 16px has no host equivalent and sits between body and heading
         for a fact that must be scannable without being a headline. */
      --t-label: var(--host-font-size-xs, 11px);
      --t-small: var(--host-font-size-sm, 12px);
      --t-body: var(--host-font-size-md, 14px);
      --t-value: 16px;
      --t-head: 18px;

      --radius-sm: var(--host-radius-sm, 4px);
      --radius: var(--host-radius-md, 8px);
      --radius-input: var(--host-radius-md, 8px);
      --radius-pill: var(--host-radius-pill, 999px);
      --focus: 0 0 0 3px var(--host-focus-ring, rgba(243, 243, 246, .22));

      --ease: cubic-bezier(.16, 1, .3, 1);
      --enter: 160ms;

      /* The shell's polarity, so native scrollbars and form controls are right
         before any of our CSS paints. The host carries this as a CLASS on
         <html>, never as a property, so the bridge resolves it for us. */
      color-scheme: var(--host-color-scheme, dark);
    }

    /* Two derivations, both from a STATE colour, so neither can invert. They need
       @supports rather than the usual declare-twice fallback: a custom property
       accepts any token stream at parse time, so an engine without color-mix()
       would keep the declaration and fail later, at computed-value time. */
    @supports (color: color-mix(in srgb, red 50%, blue)) {
      :root {
        --ok-bg: color-mix(in srgb, var(--host-success, #4ade9b) 14%, transparent);
        --warn-bg: color-mix(in srgb, var(--host-warning, #f7b955) 14%, transparent);
        --bad-bg: color-mix(in srgb, var(--host-error, #ff6b7d) 14%, transparent);
        --info-bg: color-mix(in srgb, var(--host-info, #b490ff) 14%, transparent);
        /* State as TYPE: 45% hue over the skin's own --text. One ratio for all four,
           chosen by measurement across the 23 full palettes in style.css x both
           polarities, using the same alpha-free compositing the shell does:
             45% -> worst case 5.08:1 (--info, neon-paint/light); ok 5.47, warn 5.57,
                    error 7.66. Clears the 4.5:1 body-text floor in every skin.
             50% -> worst 4.44:1, which does NOT clear it.
           Going further toward --text (35% -> 6.79 worst) buys contrast the floor
           does not need and starts costing hue identity, which is the whole point
           of a state colour. Mixing toward --text rather than away from --bg is
           what makes this polarity-proof: it darkens on parchment and lightens on
           navy, automatically. */
        --ok-text: color-mix(in srgb, var(--host-success, #4ade9b) 45%, var(--host-text, #f3f3f6));
        --warn-text: color-mix(in srgb, var(--host-warning, #f7b955) 45%, var(--host-text, #f3f3f6));
        --bad-text: color-mix(in srgb, var(--host-error, #ff6b7d) 45%, var(--host-text, #f3f3f6));
        --info-text: color-mix(in srgb, var(--host-info, #b490ff) 45%, var(--host-text, #f3f3f6));
      }
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); color-scheme: var(--host-color-scheme, dark); }
    /* dvh, not vh: on iOS the visual viewport shrinks under the toolbar and a vh
       column overflows by exactly the toolbar's height. */
    body {
      margin: 0; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      color: var(--text); background: var(--bg);
      font: var(--t-body)/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    h1, h2 { margin: 0; font-weight: 600; }
    p { margin: 0; }
    [hidden] { display: none !important; }

    /* ── The header the host itself uses ───────────────────────────────
       Measured from the running shell: .main-view-header is min-height 41px,
       padding 8px 32px, a 1px bottom border on --border; .main-view-title is
       18px / 600 / letter-spacing -.18px in the UI SANS. Not a tracked uppercase
       wordmark: the host's rail already says which surface you are on, so the
       header carries the view's name and its actions and nothing else. The
       "ROUTER HERMES ONE" mark that used to live here said, in 9 characters,
       what the highlighted rail icon says for free. */
    .view-head {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      align-items: center; gap: 8px 16px;
      flex-shrink: 0; min-height: 41px;
      padding: 8px clamp(14px, 2.4vw, 32px);
      border-bottom: 1px solid var(--line); background: var(--bg);
    }
    .view-title {
      font: 600 var(--t-head)/1.3 var(--sans); letter-spacing: -.18px;
      color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .view-actions { display: inline-flex; align-items: center; gap: 8px; justify-self: end; }

    /* Liveness of the console's own reading, next to the controls that refresh
       it: a dot and a clock, 11px, the host's metadata step. */
    .reach { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: var(--t-label) var(--mono); white-space: nowrap; }
    /* At 390px the header's three items need 232px and the title is left 114px, so
       "Capability Router" truncated to "Capability R…" — the one thing in the
       header that says what you are looking at was the thing that yielded.
       Measured: dropping the clock returns 99px, which is enough for the full
       title. So the CLOCK yields, and only when it must. The dot stays: whether
       these numbers are current is not a nicety, and a 6px dot beside the button
       that refreshes them still reads. When the sidecar is unreachable the words
       come back at any width, because that is a condition the operator must see —
       and the wrapped warning line on the body says it too. */
    @media (max-width: 640px) {
      .reach.is-fresh #reachText { display: none; }
    }

    /* ── The three destinations ────────────────────────────────────────
       Drawn as the host draws its own nav tabs: a quiet 14px label that takes
       the accent when selected, plus a 20px x 2px accent bar on the bottom edge
       (style.css:2149-2150). Each tab also carries the live state of what it
       leads to, because a destination whose contents are degraded should say so
       before you arrive. */
    .tabs {
      display: flex; align-items: stretch; gap: 2px; flex-shrink: 0;
      padding: 0 clamp(14px, 2.4vw, 32px);
      border-bottom: 1px solid var(--line); background: var(--bg);
    }
    .tab {
      position: relative; display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 12px 10px; border: 0; background: none;
      color: var(--muted); font: 500 var(--t-body) var(--sans); white-space: nowrap;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }
    .tab:hover { color: var(--text); background: var(--surface-raised); }
    .tab[aria-selected="true"] { color: var(--accent-text); }
    .tab[aria-selected="true"]::after {
      content: ""; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent);
    }
    .tab-state { display: inline-flex; align-items: center; gap: 6px; }
    .count { color: var(--muted); font: 500 var(--t-label) var(--mono); }
    /* A dot keeps the RAW hue — that is what makes it identifiable as green or
       amber — but the raw hue against the plane measures as low as 1.38:1
       (neon-paint/light), under the 3:1 floor for a graphical object. The 1px
       inset edge on the plane's own line colour makes the dot locatable in every
       skin without changing what colour it is; the state WORD beside it carries
       the meaning in text, so colour is never the only channel. */
    .dot {
      width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
      background: var(--muted); outline: 1px solid var(--line-strong); outline-offset: -1px;
    }
    .is-alive    .dot { background: var(--ok);   box-shadow: 0 0 0 3px var(--ok-bg); }
    .is-degraded .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
    .is-quota    .dot { background: var(--info); box-shadow: 0 0 0 3px var(--info-bg); }
    .is-dead     .dot { background: var(--bad);  box-shadow: 0 0 0 3px var(--bad-bg); }

    /* ── controls ──────────────────────────────────────────────────────
       Shaped like the host's own header button (style.css:7074 .logs-copy):
       1px border on --border, --surface behind it, radius 8px, 12px/600. No
       pills for actions — the host reserves pills for chips and badges. */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 5px 11px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); color: var(--text);
      /* 16px line box, so 5 + 16 + 5 + 2 = 28px — the measured height of the
         host's own header button (.logs-copy, style.css:7074, 6px 10px at 12/600
         with a normal line box). The header around it then computes to 8 + 28 + 8
         = 44px, which is what the host's Logs header measures live. Left to the
         inherited 1.5 line-height it came out 32px and the header 48px, 4px taller
         than every native panel — the kind of drift that reads as "not quite
         ours" without ever being nameable. */
      font: 600 var(--t-small)/16px var(--sans); white-space: nowrap;
    }
    .btn:hover { background: var(--surface-hover); border-color: var(--line-strong); }
    .btn[disabled] { opacity: .55; cursor: default; }
    .btn[disabled]:hover { background: var(--surface); border-color: var(--line); }
    /* The committing action is the only FILLED element on a screen, and it is
       filled with the skin's accent — the same signal the host puts on its own
       primary button, with the host's own foreground rule for legibility. */
    .btn.go { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .btn.go:hover { border-color: var(--accent-strong); background: var(--accent-strong); color: var(--accent-fg); }
    .btn.warn { color: var(--bad-text); border-color: var(--line-strong); }
    .btn.warn:hover { border-color: var(--bad); background: var(--bad-bg); }
    /* Editing is a MODE of this console, so its control reads as pressed while
       the mode is on, in the host's own "selected" idiom (accent wash + accent
       text). Deliberately not amber: the four condition colours describe the
       router, and an operator choosing to edit is not the router degrading. */
    .mode[aria-pressed="true"] {
      border-color: var(--accent-bg-strong); background: var(--accent-bg); color: var(--accent-text);
    }

    /* ── the scrolling body ────────────────────────────────────────────
       The host's .main-view-body: it scrolls, the header does not. padding
       24px 32px, and the measure is capped so a line of prose stays readable on
       a wide monitor. */
    .body {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 22px clamp(14px, 2.4vw, 32px) 44px;
    }
    .measure { width: min(1180px, 100%); margin: 0 auto; }

    /* ── screens ───────────────────────────────────────────────────────
       ONE authored moment: the screen you asked for arrives. Ease-out from an
       already-visible layout, 160ms, and nothing else on the page animates. */
    .screen { display: none; }
    .screen.active { display: block; animation: screen-in var(--enter) var(--ease) both; }
    @keyframes screen-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    /* The lede answers the screen's one question in the first line of the first
       viewport: which models are routable, how a task routes, what it decided.
       Its facts sit on the opposite margin so the sentence and the numbers can
       be read in one movement. */
    .lede {
      display: flex; align-items: baseline; justify-content: space-between;
      flex-wrap: wrap; gap: 12px 32px; margin-bottom: 20px;
    }
    .lede-answer {
      font: 500 var(--t-value)/1.4 var(--sans); letter-spacing: -.15px;
      color: var(--text); min-width: 0;
    }
    .lede-answer:empty { display: none; }
    .lede-answer.is-quiet { font: var(--t-body)/1.5 var(--sans); letter-spacing: 0; color: var(--muted); }
    .screen-note { color: var(--muted); font-size: var(--t-body); }

    /* MORE space above a heading than below it. */
    .group { margin-top: 34px; }
    .group-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    /* The host's own section label: 11px / 600 / uppercase / .05em, muted —
       .detail-card-title at style.css:6419. Not tracked mono: mono is for
       machine facts here, and a section name is not one. */
    .group-head h2 {
      font: 600 var(--t-label) var(--sans); letter-spacing: .05em;
      text-transform: uppercase; color: var(--muted);
    }
    /* A second heading inside a group follows content, so it needs the space
       above it that the group's own margin gives the first one. */
    .group-head.later { margin-top: 26px; }
    .nothing { color: var(--muted); font-size: var(--t-body); padding: 4px 0; }

    /* Rows: the console's one structural primitive. */
    .row {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
      gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row-name { font: 500 var(--t-body) var(--mono); overflow-wrap: anywhere; }
    .row-note { color: var(--muted); font: var(--t-small) var(--mono); margin-top: 2px; }
    .row-value { color: var(--muted); font: var(--t-small) var(--mono); text-align: right; white-space: nowrap; }
    /* A condition, in a word. Colour is one of the four and never decorative;
       the word is there so colour is not the only channel. */
    .state {
      font: 600 var(--t-label) var(--sans); letter-spacing: .05em;
      text-transform: uppercase; color: var(--muted);
    }
    .is-alive .state { color: var(--ok-text); }
    .is-degraded .state { color: var(--warn-text); }
    .is-quota .state { color: var(--info-text); }
    .is-dead .state { color: var(--bad-text); }

    /* Facts read as a measured strip: a quiet 11px label above, a value large
       enough to be read from a metre away. Mono only where the value is a
       machine fact — a model id or a count — and sans where it is a word. */
    .facts { display: flex; flex-wrap: wrap; gap: 14px 28px; }
    .lede .facts { justify-content: flex-end; }
    .group > .facts { padding-top: 4px; }
    .fact { display: flex; flex-direction: column; gap: 2px; }
    .fact-label {
      color: var(--muted); font: 600 var(--t-label) var(--sans);
      letter-spacing: .05em; text-transform: uppercase;
    }
    .fact-value { font: 600 var(--t-value) var(--sans); letter-spacing: -.15px; }
    .fact-value.is-mono { font: 500 var(--t-value) var(--mono); letter-spacing: -.01em; }
    /* The denominator of a fraction, under the number it belongs to: "208,352"
       above "of 272,000" says the relationship without a fifth type size. */
    .fact-note { color: var(--muted); font: var(--t-label) var(--mono); margin-top: 1px; }

    /* ── the pricing clock ─────────────────────────────────────────────
       Three of the rails this router uses price by wall-clock window, and the
       swing is 2x — large enough to decide where a task should go. So the
       console carries ONE persistent line: what hour it is, and which rails are
       expensive at it. It is a line and not a card for the same reason every
       other group here is (DESIGN.md §2.4), and it sits above the warnings
       because it is a standing fact rather than a condition to act on.

       The clock is a FACT about the router's cost, not a condition of the
       router, so only the expensive state takes a hue — --warn-text, the
       "this needs your attention" colour, because paying double is exactly
       that. A cheap window stays muted: a discount needs no alarm, and green
       here would collide with alive. The multiplier is in the text either way,
       so colour is never the only channel. */
    .clockbar {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px;
      padding: 9px 0 11px; margin-bottom: 16px; border-bottom: 1px solid var(--line);
    }
    .clock-now { color: var(--text); font: 500 var(--t-small) var(--mono); }
    .clock-local { color: var(--muted); font: var(--t-small) var(--mono); }
    .clock-rails { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 0; padding: 0; list-style: none; }
    .clock-rail { color: var(--muted); font-size: var(--t-small); }
    .clock-rail-name { font-family: var(--mono); }
    .clock-rail.peak { color: var(--warn-text); }

    /* ── the decision sheet ────────────────────────────────────────────
       A router IS an ordered first-match table, so the surface is a numbered
       sheet, not a free-form canvas: precedence is the vertical axis and the eye
       never has to infer order from position. One spine runs down the left
       margin so the sheet reads as a single continuous flow. */
    .probe { display: flex; gap: 8px; }
    .probe-input {
      flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line);
      border-radius: var(--radius-input); background: var(--host-input-bg, var(--surface));
      color: var(--text); font: var(--t-body) var(--mono);
    }
    .probe-input:focus { border-color: var(--accent); }
    .probe-input::placeholder { color: var(--muted); }
    /* A sentence, not a flex row of fragments. As flex with gap:9px it LOOKED
       right and read wrong: the gap is layout, not text, so textContent came out
       "Caught byhard-verbs→gpt-5.6-terraon openai-codex" — which is what a screen
       reader says out loud. Normal inline flow puts real spaces in the string, and
       the mono model names still stand out by font and colour. */
    .verdict { padding: 12px 0 0; color: var(--muted); font-size: var(--t-body); line-height: 1.6; }
    .verdict-model { color: var(--text); font: 500 var(--t-body) var(--mono); }

    .sheet { position: relative; margin-top: 28px; padding-left: 30px; }
    .sheet::before {
      content: ""; position: absolute; left: 8px; top: 8px; bottom: 26px; width: 1px;
      background: var(--line-strong);
    }
    .stage {
      position: relative; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      margin: 30px 0 6px; color: var(--muted);
      font: 600 var(--t-label) var(--sans); letter-spacing: .05em; text-transform: uppercase;
    }
    .stage:first-child { margin-top: 4px; }
    .stage::before {
      content: ""; position: absolute; left: -26px; top: 4px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    /* Asking a model is a different KIND of step, and --info is the condition
       colour for "inference happened" on every screen of this console. */
    .stage.inference { color: var(--info-text); }
    .stage.inference::before { box-shadow: inset 0 0 0 1px var(--info); }
    /* The window a count was taken over — the count means nothing without it. */
    .stage-note {
      color: var(--muted); font: 400 var(--t-small) var(--sans);
      letter-spacing: 0; text-transform: none;
    }

    /* One rule = one line of the sheet: its precedence, what catches, where it
       goes, and how often it really fired. */
    .step {
      position: relative; display: grid;
      /* minmax(0, max-content), not `auto`: an auto track sizes to its content's
         intrinsic width and took it from the 1fr beside it. */
      grid-template-columns: 22px minmax(0, 1fr) fit-content(46%);
      align-items: baseline; gap: 16px; padding: 12px 10px 12px 0;
      border-bottom: 1px solid var(--line); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .step:last-child { border-bottom: 0; }
    .step::before {
      content: ""; position: absolute; left: -22px; top: 19px;
      width: 9px; height: 1px; background: var(--line);
    }
    .step.editable { cursor: pointer; }
    .step.editable:hover { background: var(--surface-hover); }
    /* The line the probed task matched: this is an ANSWER TO YOUR QUESTION, not
       a condition, so it wears the accent. */
    .step.hit { background: var(--accent-bg); box-shadow: inset 2px 0 0 var(--accent); }
    .step.hit::before { background: var(--accent); }
    .step.cold { opacity: .5; }
    .step-ord { color: var(--muted); font: 500 var(--t-label) var(--mono); text-align: right; }
    .step-what { min-width: 0; }
    .step-id { font: 500 var(--t-body) var(--mono); }
    .step-when { color: var(--muted); font-size: var(--t-body); margin-top: 3px; }
    /* Destination and hits are columns, not a floating pair: a reader compares
       down a column, so both must land on the same x on every line. Two ways this
       has failed, both measured on the live sheet:
         * `auto` on the third track sized it to its content's intrinsic width —
           278px for "us.anthropic.claude-opus-5 → deepseek-v4-pro" — and starved
           the minmax(0,1fr) rule column beside it to exactly 0px.
         * capping the CHILD with max-width:46% is circular: the child's
           containing block is a max-content track that the child itself sizes, so
           the destination resolved to 0px wide and "refuse"/"T4"/"classifier"
           vanished from every line while the arrow stayed.
       The cap belongs on the TRACK, where a percentage resolves against the grid
       container: fit-content(46%) is exactly the intent — take the content's own
       width, but never more than 46% of the row — so the rule always keeps the
       majority, and the rule is what the operator reads down the sheet. */
    /* The hits track is 80px, not the old 74px: 74 fitted "never fired" at the
       retired 10.5px step, and at the host's 12px the string wrapped to two lines.
       A wrapped warning reads as damage rather than as a finding. */
    .step-to {
      display: grid; grid-template-columns: minmax(0, 1fr) 80px;
      align-items: baseline; gap: 14px;
    }

    .step-dest { display: flex; align-items: baseline; gap: 8px; justify-content: flex-end; min-width: 0; }
    .step-arrow { color: var(--muted); font: var(--t-body) var(--mono); }
    .step-target { font: 500 var(--t-body) var(--mono); overflow: hidden; text-overflow: ellipsis; }
    .step-hits {
      grid-column: 2; color: var(--muted); font: var(--t-small) var(--mono);
      text-align: right; white-space: nowrap;
    }
    /* A rule that has never fired in the recorded window is a real finding, and
       one of only three hues this screen is allowed. */
    .step-hits.zero { color: var(--warn-text); }

    /* ── a rule's conditions, one chip per clause ──────────────────────
       A `when` block now mixes three FAMILIES of predicate: the task's shape
       (what it looks like), the context it needs (how big it is), and the
       capabilities it requires of a model. An operator has to tell them apart
       at a glance, and the colour language is already spent — the four
       semantic hues report CONDITION and the accent reports SELECTION, so a
       family cannot have a hue without lying about one of those.
       So the families are told apart the way this console already makes its
       third text step: in TYPE and PLANE, plus the family's own word.
         shape      no label, transparent plane, --muted     ("verb is hard")
         context    CONTEXT label, raised plane, --text      ("over 400,000 tokens")
         capability NEEDS label, stronger hairline, --text    ("vision")
       The label is a real word inside the chip, so the family survives being
       read aloud — which a border colour does not. */
    .whens { display: flex; flex-wrap: wrap; gap: 6px; margin: 5px 0 0; padding: 0; list-style: none; }
    .chip {
      display: inline-flex; align-items: baseline; gap: 6px;
      padding: 2px 9px; border: 1px solid var(--line); border-radius: var(--radius-pill);
      color: var(--muted); font: var(--t-small)/1.5 var(--sans); min-width: 0;
    }
    .chip-kind {
      flex: 0 0 auto; color: var(--muted);
      font: 600 var(--t-label) var(--sans); letter-spacing: .05em; text-transform: uppercase;
    }
    .chip-val { min-width: 0; overflow-wrap: anywhere; }
    .chip.context { background: var(--surface-raised); color: var(--text); }
    .chip.capability { border-color: var(--line-strong); color: var(--text); }

    /* ── tier chains ───────────────────────────────────────────────────
       A tier is no longer one model with a trailing list of names: it is an
       ordered (or deliberately unordered) chain of elos, each with the rail it
       runs on, the way it is billed and the context it can hold. The tier head
       carries the three facts an operator judges the chain by — how it picks the
       next hop, how many INDEPENDENT upstreams it really has, and any capability
       floor the tier declares. */
    .tier { padding: 14px 0 15px; border-bottom: 1px solid var(--line); }
    .tier:last-child { border-bottom: 0; }
    .tier-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
    .tier-name { font: 600 var(--t-body) var(--mono); letter-spacing: .04em; color: var(--text); }
    .tier-fact { color: var(--muted); font-size: var(--t-small); }
    .tier-fact.thin { color: var(--warn-text); }
    /* A finding about the chain, in a line — the same shape the console uses for
       every other condition that needs an operator, one step quieter. */
    .tier-fact.rails { margin-top: 9px; }
    .tier-note { margin-top: 8px; color: var(--warn-text); font-size: var(--t-small); }

    /* SEQUENTIAL IS ORDERED AND MUST LOOK ORDERED; RANDOM MUST NOT.
       An ordered chain is drawn the way this console draws every other sequence:
       numbered, down one spine (DESIGN.md §3). A random chain is a SET — it has
       no first and no next — so it loses the ordinals and the spine and wraps
       across the line instead of stacking down it, because a stack is the thing
       that implies an order it does not have. */
    .hops { margin: 10px 0 0; padding: 0; list-style: none; }
    .hops.ordered { position: relative; padding-left: 26px; }
    .hops.ordered::before {
      content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 1px;
      background: var(--line-strong);
    }
    /* The drawn set keeps the ordered list's left indent — without it a random
       tier's elos start 26px left of a sequential one's and the eye has to
       re-find the model on every tier, which is the ragged edge DESIGN.md §3
       exists to remove. It just does not get the spine, because there is no
       sequence to run down. */
    .hops.drawn { display: flex; flex-wrap: wrap; gap: 8px 26px; padding-left: 26px; }
    .hop { position: relative; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 5px 0; }
    .hops.ordered > .hop::before {
      content: ""; position: absolute; left: -19px; top: 14px; width: 8px; height: 1px; background: var(--line);
    }
    .hops.drawn > .hop { padding: 0; }
    .hop-ord {
      position: absolute; left: -26px; top: 4px; width: 14px; text-align: center;
      color: var(--muted); font: 500 var(--t-label) var(--mono);
    }
    .hop-model { font: 500 var(--t-body) var(--mono); overflow-wrap: anywhere; }
    .hop-rail, .hop-ctx { color: var(--muted); font: var(--t-small) var(--mono); }
    .hop-ctx.unverified { color: var(--warn-text); font-family: var(--sans); }
    /* What this elo costs AT THE HOUR the plan was made for: the multiplier the
       comparison used — the router's own whenever the plan reports one — and the
       effective prices where a rate is published. Mono, because these are numbers
       an operator checks against an invoice. Amber only inside an expensive
       window — the same meaning the clock line gives it. */
    .hop-price { color: var(--muted); font: var(--t-small) var(--mono); }
    .hop-price.peak { color: var(--warn-text); }
    /* Why this elo is where it is: the time policy moved it. A sentence, so it
       is sans, and muted — the position it describes is already visible. */
    .hop-move { color: var(--muted); font-size: var(--t-small); }
    /* How the request is PAID for. A badge, not a state: billing is not a
       condition, so it takes the metadata treatment (11px, tracked, uppercase)
       and no hue — until it is missing, which an operator cannot cost a
       request without and so is a real finding. */
    .badge {
      flex: 0 0 auto; padding: 1px 8px; border: 1px solid var(--line); border-radius: var(--radius-pill);
      color: var(--muted); font: 600 var(--t-label) var(--sans); letter-spacing: .05em; text-transform: uppercase;
    }
    .badge.is-unknown { color: var(--warn-text); border-color: var(--line-strong); }

    /* An elo the capability filter dropped, and the reason in words. The model
       keeps mono (it is a machine fact the operator will copy); the reason is a
       sentence, so it is sans. */
    .reject { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
    .reject:last-child { border-bottom: 0; }
    /* Muted, not --bad-text. The heading above already says these were dropped,
       and painting every reason spent this screen's loudest channel on its least
       news — with a bypassed filter (a real refusal) in the same viewport, that
       put three reds against one amber. DESIGN.md §3, colour budget. */
    .reject-why { color: var(--muted); font-size: var(--t-small); }
    .reject-num { color: var(--muted); font: var(--t-small) var(--mono); }

    /* ── replay ────────────────────────────────────────────────────────
       A trace is a short sequence, so it is drawn as one: the same spine-and-
       line vocabulary as the decision sheet, so an operator learns one way of
       reading this console instead of two. */
    .canvas-row { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 26px; align-items: start; }
    .canvas-row.solo { grid-template-columns: minmax(0, 1fr); }
    .is-narrow .canvas-row { grid-template-columns: minmax(0, 1fr); }
    /* Routes: list and replay stay SIDE BY SIDE wherever there is room for two
       readable columns, even in the host panel. Stacked, picking a decision
       appeared to do nothing because the replay was below the fold. */
    .canvas-row.routes { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    @media (max-width: 860px) { .canvas-row.routes { grid-template-columns: minmax(0, 1fr); } }
    /* Until a decision is picked there is no replay, so the second column would
       hold nothing. It appears when it has something in it. */
    .canvas-row.routes.waiting { grid-template-columns: minmax(0, 1fr); }
    .canvas-row.routes.waiting .replay-col { display: none; }
    /* The list scrolls inside its own column so the replay stays next to it
         instead of being pushed down the page by 47 rows. The gutter is
         reserved: without it the scrollbar clipped "22h ago" to "22h ag". */
    .route-list { max-height: min(64dvh, 600px); overflow-y: auto; scrollbar-gutter: stable; padding-right: 4px; }
    .replay-col { position: sticky; top: 0; }
    .filter { width: 100%; margin-bottom: 8px; }
    /* Scope: which subset you are looking at is a SELECTION, not a condition, so
       it wears the accent when chosen — the host's own chip idiom (accent wash,
       accent text, accent-tinted border). */
    .route-scopes { display: flex; gap: 6px; margin-bottom: 10px; }
    .scope {
      padding: 5px 12px; border: 1px solid var(--line); border-radius: var(--radius-pill);
      background: transparent; color: var(--muted); font: 600 var(--t-small) var(--sans);
    }
    .scope:hover { border-color: var(--line-strong); color: var(--text); }
    .scope.is-on { border-color: var(--accent-bg-strong); background: var(--accent-bg); color: var(--accent-text); }
    .scope[disabled] { opacity: .55; cursor: default; }
    .scope-count { color: var(--muted); margin-left: 6px; font: 500 var(--t-label) var(--mono); }
    .scope.is-on .scope-count { color: var(--accent-text); }
    /* Rows are buttons, so they must not inherit button chrome. The cause column
       is fixed so model names line up down the list; a ragged left edge forces
       the eye to re-find the model on every row. */
    .row.route {
      width: 100%; border: 0; border-bottom: 1px solid var(--line);
      background: none; text-align: left; font: inherit; color: inherit;
      /* 118px, not 104: the longest real cause is "FAIL SAFE STRONG" and at the
         host's 11px it needs 112px on one line. At 104 it wrapped to two, which
         made every fail-safe row 20px taller than its neighbours and turned a
         scannable column into a ragged one. Measured against the live log's four
         causes: has_code_rule, fail_safe_strong, hard_rule, blocklist_veto. */
      grid-template-columns: 118px minmax(0, 1fr) auto; gap: 12px;
    }
    .row.route .cause { line-height: 1.3; overflow-wrap: anywhere; }
    /* The task is the row's subject: give it the width and let it wrap to two
       lines rather than trailing off into empty space. */
    .row.route .row-note {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; font-family: var(--sans); font-size: var(--t-body);
    }

    .path { position: relative; padding-left: 30px; }
    .path::before { content: ""; position: absolute; left: 8px; top: 14px; bottom: 14px; width: 1px; background: var(--line); }
    .trace {
      position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: baseline; gap: 14px; width: 100%; padding: 11px 10px 11px 0;
      border: 0; border-bottom: 1px solid var(--line); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: none; text-align: left;
    }
    .trace:last-child { border-bottom: 0; }
    .trace::before {
      content: ""; position: absolute; left: -26px; top: 17px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .trace:hover { background: var(--surface-hover); }
    /* Where the reader is (accent — it is what they picked), what has already
       happened, what is still ahead. */
    .trace.on { background: var(--accent-bg); box-shadow: inset 2px 0 0 var(--accent); }
    .trace.on::before { background: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .trace.past::before { background: var(--muted); box-shadow: inset 0 0 0 1px var(--muted); }
    .trace.ahead { opacity: .72; }
    .trace-ord { color: var(--muted); font: 500 var(--t-label) var(--mono); }
    .trace-stage { font: 500 var(--t-body) var(--sans); color: var(--text); }
    .trace-outcome { color: var(--muted); font: var(--t-small) var(--mono); margin-top: 2px; overflow-wrap: anywhere; }

    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    .field label { color: var(--muted); font: 600 var(--t-label) var(--sans); letter-spacing: .05em; text-transform: uppercase; }
    .field input, .field select {
      border: 1px solid var(--line); border-radius: var(--radius-input); padding: 8px 11px;
      background: var(--host-input-bg, var(--surface)); color: var(--text); font: var(--t-body) var(--mono);
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .msg { margin-top: 12px; color: var(--muted); font-size: var(--t-body); }
    .msg.ok { color: var(--ok-text); }
    .msg.bad { color: var(--bad-text); }
    .code {
      margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--host-code-bg, var(--surface)); color: var(--text);
      font: var(--t-small)/1.6 var(--mono);
      white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto;
    }
    .editor {
      width: 100%; min-height: 240px; resize: vertical; padding: 10px 12px; margin-top: 10px;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--host-code-bg, var(--surface)); color: var(--text);
      font: var(--t-small)/1.6 var(--mono); tab-size: 2;
    }
    /* Noisy internals stay collapsed by default, which is the host's own rule. */
    details > summary { color: var(--muted); font: 500 var(--t-body) var(--sans); cursor: pointer; padding: 8px 0; }
    details > summary:hover { color: var(--text); }

    /* ── routes + replay detail ────────────────────────────────────── */
    .route { cursor: pointer; }
    .route:hover { background: var(--surface-hover); }
    .route.picked { background: var(--accent-bg); box-shadow: inset 2px 0 0 var(--accent); }
    /* The cause of a decision: one of the four condition colours, set in JS.
       Sans, because a cause is a phrase ("fail safe strong"), not code. */
    .cause { font: 600 var(--t-label) var(--sans); letter-spacing: .05em; text-transform: uppercase; }
    .io { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
    /* A step's payload is evidence under its label, not a component. Boxing each
       side put two bordered cards inside a column that already sits inside the
       panel — three nested frames for four lines of JSON. */
    .io .code {
      margin-top: 0; padding: 1px 0 1px 12px;
      border: 0; border-left: 1px solid var(--line); border-radius: 0; background: none;
    }
    .io-label { color: var(--muted); font: 600 var(--t-label) var(--sans); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
    .inspector-head { margin: 28px 0 12px; font: 600 var(--t-head)/1.3 var(--sans); letter-spacing: -.18px; }

    /* A condition that needs an operator is a LINE, marked with the same dot the
       tabs use — not a tinted card with a thick coloured edge. Every other group
       here is made from a hairline and space; the warning was the one element
       that disagreed, and it disagreed loudest. */
    .warn-line {
      display: flex; gap: 10px; align-items: baseline; padding: 11px 0; margin-bottom: 18px;
      border-bottom: 1px solid var(--line); color: var(--muted); font-size: var(--t-body);
    }
    .warn-line::before {
      content: ""; flex: 0 0 auto; width: 6px; height: 6px; margin-top: 6px;
      border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg);
    }
    .warn-line strong { color: var(--text); font-weight: 600; }
    .warn-line.bad { color: var(--text); }
    .warn-line.bad::before { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }

    /* ── narrow: the host panel with the workspace open (~550px) ──────── */
    @media (max-width: 700px) {
      .body { padding: 18px 14px 32px; }
      .io { grid-template-columns: 1fr; }
      .lede { display: block; }
      .lede .facts { justify-content: flex-start; margin-top: 12px; }
    }

    /* ── the phone ─────────────────────────────────────────────────────
       640px, because that is the host's own breakpoint: below 641px it hides the
       rail entirely and the sidebar drawer becomes the only navigation
       (style.css:2137). Matching it means this console changes shape at the same
       width the shell around it does. Header + tabs measure 41 + 38 = 79px of
       chrome, against 120px for the old three-row masthead. */
    @media (max-width: 640px) {
      .view-head { padding: 8px 14px; }
      /* The tabs scroll rather than wrap: three destinations with live state
         dots do not fit 390px, and a wrapped tab strip reads as two
         navigations. Scroll-snap so a partial swipe settles on a boundary. */
      .tabs {
        padding: 0 14px; overflow-x: auto; scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { scroll-snap-align: start; }
      /* Two columns of facts, not four: at 390px four columns gave each label
         ~85px, which truncated "AGGRESSIVENESS" to "AGGRESSIVE" — a label that
         silently lies about which number it names. */
      .facts { gap: 12px 20px; }
      .fact { min-width: calc(50% - 20px); }

      /* The sheet and the ladder stack instead of competing. A 46% cap is ~150px
         here — not enough for a Bedrock id, so it would ellipsis away the very
         thing the line exists to say. */
      .step { grid-template-columns: 22px minmax(0, 1fr); row-gap: 6px; }
      .step-to { grid-column: 2; max-width: none; grid-template-columns: minmax(0, 1fr) auto; }
      .step-dest { justify-content: flex-start; }
      .step-target { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
      /* The tier head's facts stack rather than truncate: "2 of 3 independent
         rails" is the whole point of the line and must not become "2 of 3 ind…". */
      .tier-head { gap: 4px 12px; }
      /* A drawn (random) chain keeps wrapping, but at 390px there is room for one
         elo per line — so the words carry the "no order here" fact instead of the
         layout, which is why the head says it too. */
      .hops.drawn { gap: 10px 16px; }

      /* The row stops being a three-column grid and becomes one wrapping line:
         dot, name, rail, state. At 390px the grid gave the state a column of its
         own, which forced "ALIVE" onto a third line and made five models 15
         lines tall. */
      .row { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; row-gap: 3px; padding: 10px 0; }
      .row > .dot { align-self: center; }
      .row-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
      .row-main > .row-name { flex: 0 1 auto; }
      .row .row-note { margin-top: 0; }
      .row > div:last-of-type { display: flex; align-items: baseline; gap: 10px; margin-left: auto; }
      .row-value, .row .state { text-align: left; }
      /* A decision row keeps its GRID here, against the flex rule above: as flex,
         the middle cell sized to its own content, so the model name started at a
         different x on every line — measured, the ragged edge DESIGN.md §3 exists
         to prevent, because the reader has to re-find the model on each row.
         Two rows instead: cause and age on the first, model and task on the
         second, both flush left. The cause column keeps its own width so the four
         cause words still line up down the list. */
      .row.route {
        display: grid; grid-template-columns: minmax(0, 1fr) auto;
        row-gap: 4px; column-gap: 12px; align-items: baseline;
      }
      .row.route .cause { grid-column: 1; grid-row: 1; }
      .row.route .row-value { grid-column: 2; grid-row: 1; justify-self: end; }
      /* margin-left:auto is reset explicitly. `.row > div:last-of-type` above is
         written for the MODEL row, where it pushes the state to the far end; a
         decision row's only div is its subject, and inheriting that rule shoved
         each model to a different x — 152px, 51px, 116px, 24px, 249px on five
         consecutive rows, measured. Which is the same ragged edge the two-row
         layout exists to remove. */
      .row.route > div { grid-column: 1 / -1; grid-row: 2; margin-left: 0; display: block; }
    }

    /* Touch. The host requires 44px targets under a coarse pointer
       (style.css: "@media (hover:none) and (pointer:coarse)" ... min-height:44px)
       and every control here was built for a mouse. A missed tap on Refresh is
       harmless; a missed tap on the write gate is not. */
    @media (hover: none) and (pointer: coarse) {
      .tab { min-height: 44px; }
      .btn { min-height: 44px; }
      .scope { min-height: 44px; padding: 0 16px; }
      .row.route { min-height: 56px; }
      summary { min-height: 44px; display: flex; align-items: center; }
      /* iOS Safari zooms in when a focused input is under 16px and never zooms
         back out, so tapping the filter left the operator on a magnified,
         sideways-scrolling console.
         The SELECTOR is the load-bearing part, and it was wrong. A bare
         `input, textarea, select` scores (0,0,1) and every input in this console is
         reached by a CLASS — .probe-input, .editor, .field input — which scores
         (0,1,0) and wins. Measured in a real iPhone 13 context, where
         (pointer:coarse) genuinely matches: the probe field, the decision filter
         and the COMPACT confirmation all computed 14px with this block present, so
         the guard had been decorative. Naming the classes makes it apply.
         max() keeps anything already larger; .editor stays at --t-small on a mouse
         because it holds JSON, and gets 16px here for the same reason as the rest. */
      input, textarea, select,
      .probe-input, .editor, .field input, .field select {
        font-size: max(16px, 1em);
      }
      /* An input the keyboard covers is an input you cannot see while typing.
         The host measures this inset onto ITS documentElement, which a
         same-origin iframe does not inherit — so the console measures its own,
         with the host's formula, in syncKeyboard(). */
      .body { padding-bottom: calc(44px + var(--keyboard-inset, 0px)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen.active { animation: none; }
      * { animation: none !important; transition: none !important; }
    }
  
    /* ── embedded in the Hermes One panel ────────────────────────────────────
       The rail icon is lit and labelled Capability Router, and the console's
       sections are the shell's sidebar now, so the 45px masthead title and the
       37px tab row were 82px of chrome repeating what the shell already shows.
       Both stay in the DOM — the tabs are the state the sidebar reads, and
       clicking a sidebar row clicks the tab — they are just not drawn twice.
       The head survives without its title: it carries the freshness chip and the
       Edit/Refresh actions, which have no other home. */
    .is-embedded nav.tabs { display: none; }
    /* The head matches the shell sidebar's .panel-head exactly, measured off the running
       host: 41px min-height, 8px/16px padding, one hairline below. It was 45px with an
       18px title, which read as a second navigation row one row off from the real one. */
    .is-embedded .view-head {
      min-height: 41px;
      padding: 8px 16px;
      align-items: center;
    }
    .is-embedded .view-title {
      font: 600 var(--t-label)/1.3 var(--sans);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    /* The 41px min-height was already applying; the box measured 45 because the
       ACTIONS were 28px tall and 8px padding top and bottom put it over. 25px of
       content plus 16px of padding lands on 41 exactly. */
    .is-embedded .view-head > .view-actions { min-height: 0; }
    .is-embedded .view-head .btn,
    .is-embedded .view-head .reach {
      min-height: 25px;
      padding-top: 2px;
      padding-bottom: 2px;
      font-size: var(--t-label);
    }

    /* Which clause satisfied the rule. Chips rather than a sentence: the operator
       is scanning for a field name, and three conditions in prose becomes a comma
       list nobody parses.
       The chips themselves are `.chip` — the same component the rule rows and the
       chain plan use — rather than a second near-identical `.clause`. Two chip
       shapes for one concept is how a surface comes to look like two products, and
       the family label the shared chip carries is exactly what the verdict wants:
       "CONTEXT over 400,000 tokens" says which of the three families did the work.
       The list keeps its own margin off, because here it sits beside the label on
       one baseline instead of under a rule id. */
    .verdict-why { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-top: 6px; }
    .verdict-why-label { color: var(--muted); font-size: var(--t-label); }
    .verdict-why .whens { margin: 0; }

    /* The DECLARED route, beside the one that will actually run. The verdict above
       is built from the chain plan — the list the executor iterates — so this line
       exists only to answer "then what does router.yaml say?", and only when the
       two differ. Secondary by construction: it borrows the "because" row's shape
       and label, and the ids stay muted mono so the running route above keeps the
       only `--text` weight in the block. No hue: this is not a condition. */
    .verdict-declared { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-top: 6px; }
    .verdict-route { color: var(--muted); font: var(--t-small) var(--mono); overflow-wrap: anywhere; }
</style>
</head>
<body>
  <!-- The host's own panel header: an 18px/600 sans title on the left, the
       actions on the right, one hairline under it. What used to be here was a
       "ROUTER · HERMES ONE" wordmark — 9 characters saying what the highlighted
       rail icon says for free, in a mono uppercase voice the shell never uses. -->
  <header class="view-head">
    <h1 class="view-title">Capability Router</h1>
    <div class="view-actions">
      <!-- Whether these numbers are current. Not a status chip repeating a state
           something else owns: it reports THIS CONSOLE'S last read, which nothing
           else on screen can say. -->
      <span class="reach" id="reach"><span class="dot"></span><span id="reachText">checking</span></span>
      <!-- Edit, not a padlock. The padlock claimed to be a protection and was
           not: the sidecar has never heard of it (zero mentions in
           one_sidecar.py), and every write is already gated server-side by the
           per-extension token-v1 secret, the host's CSRF token, a loopback-only
           bind, and an optimistic base_hash that answers 409 on drift. The
           compaction action additionally requires confirm=="COMPACT" checked ON
           THE SERVER (one_sidecar.py:392).
           What it did that was worth keeping is the read-only DEFAULT: the
           Pipeline shows the live routing policy, and a stray tap on a line
           should not start editing it. That is a mode, so it is named as one. -->
      <button class="btn mode" id="editMode" type="button" aria-pressed="false">
        <span id="editLabel">Edit</span>
      </button>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <!-- Three destinations, drawn the way the host draws its own nav tabs: a quiet
       label that takes the accent when selected, with a 20px accent bar on the
       bottom edge. Each carries the live state of what it leads to. -->
  <nav class="tabs" role="tablist" aria-label="Console sections">
    <button class="tab" id="tab-health" role="tab" aria-selected="true" aria-controls="panel-health" data-tab="health" type="button">
      <span class="tab-name">Health</span>
      <span class="tab-state" id="stateHealth"><span class="count" id="countHealth" hidden></span><span class="dot"></span></span>
    </button>
    <button class="tab" id="tab-pipeline" role="tab" aria-selected="false" aria-controls="panel-pipeline" data-tab="pipeline" type="button">
      <span class="tab-name">Pipeline</span>
      <span class="tab-state" id="statePipeline"><span class="count" id="countPipeline" hidden></span><span class="dot"></span></span>
    </button>
    <button class="tab" id="tab-routes" role="tab" aria-selected="false" aria-controls="panel-routes" data-tab="routes" type="button">
      <span class="tab-name">Routes</span>
      <span class="tab-state" id="stateRoutes"><span class="count" id="countRoutes" hidden></span><span class="dot"></span></span>
    </button>
  </nav>

  <main class="body" id="shell">
    <div class="measure">
      <!-- The pricing clock, on every screen because the hour decides what a
           route costs on three of the rails below: deepseek and zai bill 2x at
           06:00-10:00 UTC (zai on weekdays only), xiaomi discounts to 0.8x from
           16:00 UTC. The windows are the ones the rails declare, and where the
           router has already priced an hour itself — a chain plan's own multiplier —
           that number wins, so the console and the router never price the same hour
           differently. The hour is shown in UTC (the unit every window is declared
           in) AND in the operator's own time, each labelled, because an operator
           reasons in local time and guessing which one a bare "07:14" meant is how
           a peak gets read three hours off. -->
      <div class="clockbar" id="clockbar" hidden>
        <time class="clock-now" id="clockNow"></time>
        <span class="clock-local" id="clockLocal"></span>
        <ul class="clock-rails" id="clockRails"></ul>
      </div>
      <div id="warnings"></div>

      <!-- ── Health: which models can this router reach right now ────── -->
      <section class="screen active" id="panel-health" role="tabpanel" aria-labelledby="tab-health">
        <!-- The screen's one question, answered in its first line: the rollup of
             the model set, with the router's own three facts on the opposite
             margin. There is no second "Router" heading — the panel header
             already names the surface, and a title that repeats the rail is the
             clutter this console was rebuilt to remove. -->
        <div class="lede">
          <p class="lede-answer" id="modelsNote"></p>
          <div class="facts" id="healthFacts"></div>
        </div>

        <div id="models"></div>

        <div class="group" id="bansGroup" hidden>
          <div class="group-head"><h2>Blocked</h2></div>
          <div id="bans"></div>
        </div>

        <div class="group">
          <div class="group-head"><h2>Compaction</h2><span class="screen-note" id="compactionNote"></span></div>
          <div class="facts" id="compaction"></div>
          <!-- The type-to-confirm stays: this action restarts the agent, and the
               server demands the same phrase independently (one_sidecar.py:392),
               so the two cannot drift apart. The summary carries the consequence,
               so the decision to open it is informed. -->
          <details id="compactionApply">
            <summary>Recalculate thresholds — restarts the agent</summary>
            <div class="field" style="margin-top:10px">
              <label for="compactConfirm">Type COMPACT to confirm</label>
              <input id="compactConfirm" autocomplete="off" placeholder="COMPACT">
            </div>
            <div class="actions"><button class="btn warn" id="compactGo" type="button">Recalculate</button></div>
            <p class="msg" id="compactMsg" aria-live="polite"></p>
          </details>
        </div>
      </section>

      <!-- ── Pipeline: a decision sheet, read top to bottom ─────────── -->
      <section class="screen" id="panel-pipeline" role="tabpanel" aria-labelledby="tab-pipeline">
        <!-- The probe is the first thing in the first viewport, because "where
             would MY task land?" is the question this screen exists for and the
             sheet below is the answer's audit trail. Backed by GET /explain
             (Stage 0, deterministic). -->
        <div class="lede">
          <p class="lede-answer is-quiet" id="pipelineNote">Read top to bottom — the first rule that matches wins.</p>
        </div>

        <form class="probe" id="probeForm">
          <input id="probeTask" class="probe-input" autocomplete="off"
                 placeholder="Try a task — “Debug a race condition in the cache”" aria-label="Task to route">
          <button class="btn" type="submit">Route it</button>
        </form>
        <div id="probeResult"></div>
        <!-- The chain the probed task would actually walk: the requirements the
             signals derived, the elos still eligible in the order they will be
             tried, and the ones the capability filter dropped with the reason.
             Driven by chain_plan on the /explain response; absent until a task is
             probed, because there is no chain plan without a task. -->
        <div id="chainPlan"></div>

        <div class="sheet" id="sheet"></div>

        <div class="group">
          <div class="group-head"><h2>Tier chains</h2><span class="screen-note" id="ladderNote"></span></div>
          <div id="ladder"></div>
        </div>

        <div id="inspector"></div>
        <div class="group">
          <details>
            <summary>Edit the whole policy as JSON</summary>
            <textarea id="policyEditor" class="editor" spellcheck="false" readonly aria-label="Policy JSON"></textarea>
            <!-- No Confirm button. It POSTed /apply/confirm, which on the server
                 is the SAME function as /apply — one_sidecar.py:346 and :353 both
                 return _commit_policy(body). Two buttons, one effect, and nothing
                 on screen said which to press or what the difference was. -->
            <div class="actions">
              <button class="btn go" id="jsonApply" type="button">Apply</button>
              <button class="btn" id="jsonPreview" type="button">Preview</button>
              <button class="btn warn" id="jsonRevert" type="button">Revert</button>
            </div>
            <p class="msg" id="jsonMsg" aria-live="polite"></p>
            <pre class="code" id="jsonDiff" hidden></pre>
          </details>
        </div>
      </section>

      <!-- ── Routes: what it actually decided ───────────────────────── -->
      <section class="screen" id="panel-routes" role="tabpanel" aria-labelledby="tab-routes">
        <div class="lede">
          <p class="lede-answer is-quiet" id="routesNote"></p>
        </div>
        <div class="canvas-row routes waiting" id="routesRow">
          <div>
            <input id="routesFilter" class="probe-input filter" type="search" autocomplete="off" hidden
                   placeholder="Filter by task, model or cause" aria-label="Filter decisions">
            <!-- The question an operator actually arrives with is "did anything go
                 wrong?", and answering it meant reading 47 cause labels and
                 knowing which of them mean refusal. The console already knows, so
                 the knowledge becomes a control — not a colour legend, a filter. -->
            <div class="route-scopes" id="routeScopes" role="group" aria-label="Which decisions to show">
              <button class="scope is-on" id="scopeAll" type="button" aria-pressed="true">All</button>
              <button class="scope" id="scopeOffRule" type="button" aria-pressed="false">Not by rule</button>
            </div>
            <div id="routesTable" class="route-list"></div>
          </div>
          <div class="replay-col">
            <div class="path" id="replayPath"></div>
            <div id="stepDetail"></div>
            <!-- The chain plan the router persisted WITH this decision: the order
                 it really meant to try, what it dropped and why, and any cost
                 control it bypassed. Same presentation as the Explain panel — one
                 chain vocabulary, learned once — and absent for the historical
                 entries written before plans were recorded. -->
            <div id="replayPlan"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    /* True inside the Hermes One panel iframe; the host owns the chrome there. */
    try {
      if (window.self !== window.top) document.documentElement.classList.add('is-embedded');
    } catch (error) { document.documentElement.classList.add('is-embedded'); }
    (() => {
      'use strict';

      const SIDECAR = '/api/extensions/hermes-one-capability-router/sidecar';
      const NARROW_BELOW = 1120;

      const state = {
        mode: 'reading',   // 'reading' or 'editing'
        health: null, status: null, policy: null, blocklist: null,
        liveness: null, compaction: null, routes: [],
        // The model capability registry, when the sidecar publishes one, and the
        // chain plan for the last probed task. Both are optional — a task bound for
        // the classifier has no resolved chain, and an older sidecar reports neither
        // at all — so the console shows what it can verify and says so where it
        // cannot.
        capabilities: null, chainPlan: null,
        plan: null, draft: null, selected: null, replay: null,
        pending: new Set(), unreachable: false, checkedAt: null,
        // Until the first response lands, "nothing here" is not a fact yet.
        loading: true, query: '',
        // How many decisions the sidecar says exist, which is not always how many
        // it sent us.
        routesTotal: 0,
        // Which subset of decisions is on screen. 'all' or 'off-rule'.
        scope: 'all',
        // THE INJECTED CLOCK. null means "use the wall clock", which only nowUtc()
        // ever does. Everything downstream takes the instant as a parameter, so a
        // rendering test pins an hour instead of passing at 05:59 and failing at
        // 06:00 — the same reason rules.py refuses to read a clock at all.
        clock: null,
      };

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = String(text);
        return n;
      };
      const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
      const pretty = (v) => {
        if (typeof v === 'string') return v;
        try { return JSON.stringify(v, null, 2); } catch (_) { return String(v); }
      };

      // Booleans and enums become operator words; DESIGN.md §2.5.
      const say = (v, fallback = '—') => {
        if (v === true) return 'yes';
        if (v === false) return 'no';
        if (v === undefined || v === null || v === '') return fallback;
        if (typeof v === 'object') return Array.isArray(v) ? String(v.length) : pretty(v);
        return String(v);
      };
      const ago = (ts) => {
        if (!ts) return '—';
        const s = Math.max(0, Math.round(Date.now() / 1000 - Number(ts)));
        if (s < 60) return `${s}s ago`;
        if (s < 3600) return `${Math.round(s / 60)}m ago`;
        if (s < 86400) return `${Math.round(s / 3600)}h ago`;
        return `${Math.round(s / 86400)}d ago`;
      };
      const clock = (d) => d.toTimeString().slice(0, 5);
      // The ONE place this console reads a wall clock. Everything time-dependent
      // takes the result as a parameter, so the clock is injected exactly once and
      // a test can pin it by setting state.clock.
      const nowUtc = () => (state.clock instanceof Date ? state.clock : new Date());
      // Token counts are six digits here. 208352 has to be counted digit by digit
      // to be compared with 272000; 208,352 does not. Thin spaces would be prettier
      // and would break copy-paste into a shell, which is what these numbers are
      // for, so a plain separator it is.
      const fmt = (n) => {
        const value = Number(n);
        return Number.isFinite(value) ? value.toLocaleString('en-US') : say(n);
      };

      // "Nothing here" has three different meanings and an operator must be able
      // to tell them apart: we have not asked yet, we cannot ask, or we asked and
      // there is genuinely nothing. Claiming the third while the first is true is
      // the most common lie a console tells.
      const absence = (empty) => state.loading ? 'Loading…'
        : state.unreachable ? 'Unavailable while the sidecar is unreachable.'
        : empty;

      // The WebUI derives a CSRF token from the session (HMAC, server-side) and
      // injects it only into the pages it renders itself — /, /index.html and
      // /session/*. A page the sidecar serves therefore never has one, which is
      // why writing only works when this console is mounted inside the Hermes One
      // shell: there it runs same-origin under the host document and can read the
      // token the host was given.
      const csrf = () => {
        try {
          const own = (window.__HERMES_CONFIG__ || {}).csrfToken;
          if (own) return own;
          // Mounted in the host's panel: the token belongs to the host document.
          return (window.parent.__HERMES_CONFIG__ || {}).csrfToken || '';
        } catch (_) { return ''; }  // cross-origin parent — no token to borrow
      };

      async function call(path, options = {}) {
        const method = options.method || 'GET';
        const key = `${method} ${path.replace(/\?.*$/, '')}`;
        const headers = options.body ? { 'Content-Type': 'application/json' } : {};
        const token = csrf();
        if (token && method !== 'GET') headers['X-Hermes-CSRF-Token'] = token;
        try {
          const res = await fetch(`${SIDECAR}${path}`, {
            method,
            headers: Object.keys(headers).length ? headers : undefined,
            body: options.body ? JSON.stringify(options.body) : undefined,
            credentials: 'same-origin',
          });
          const raw = await res.text();
          let data = {};
          try { data = raw ? JSON.parse(raw) : {}; } catch (_) { data = { raw }; }
          if (res.status === 404) { state.pending.add(key); return { missing: true, data }; }
          state.pending.delete(key);
          if (!res.ok) return { error: true, status: res.status, data };
          return { data, status: res.status };
        } catch (error) {
          state.unreachable = true;
          return { error: true, offline: true, data: { message: error.message } };
        }
      }

      // ── conditions in words ─────────────────────────────────────────
      // A rule's `when` clause is the answer to "why would this catch my task?".
      // The engine's vocabulary is closed (router/signals.py fields,
      // router/rules.py operators), so it can be translated exactly rather than
      // dumped as JSON.
      //
      // Three FAMILIES now share that vocabulary, and the family is part of the
      // meaning: `size_lines: {gt: 400}` describes the TASK, `est_input_tokens:
      // {gt: 400000}` describes the CONTEXT it needs, and `needs_vision: {eq:
      // true}` describes a CAPABILITY the model must have. `family` below is what
      // the chip renders as its own word, so the distinction survives being read
      // aloud rather than living in a border colour.
      const FIELD = {
        verb_class:       { noun: 'verb' },
        lang:             { noun: 'language' },
        keywords:         { noun: 'keywords' },
        has_code:         { yes: 'has code', no: 'has no code' },
        has_stacktrace:   { yes: 'has a stacktrace', no: 'has no stacktrace' },
        size_lines:       { unit: 'lines' },
        num_files:        { unit: 'files' },
        num_requirements: { unit: 'requirements' },
        char_len:         { unit: 'characters' },
        // Context: how much the turn needs held, in tokens. Six-digit numbers, so
        // they take the thousands separator the facts strip already uses — 400000
        // has to be counted digit by digit against a 272,000 window.
        est_input_tokens: { noun: 'estimated context', unit: 'tokens', num: true, family: 'context' },
        // Capability: what the model must be able to do. Phrased as the capability
        // itself, because the chip's own NEEDS label supplies the verb.
        needs_vision:            { yes: 'vision', no: 'no vision', family: 'capability' },
        needs_tools:             { yes: 'tool calls', no: 'no tool calls', family: 'capability' },
        needs_structured_output: { yes: 'structured output', no: 'no structured output', family: 'capability' },
        attachment_kinds:        { noun: 'attachments', family: 'capability' },
      };
      const AMOUNT = { gt: 'over', gte: 'at least', lt: 'under', lte: 'at most' };

      function phraseCondition(field, condition) {
        const spec = FIELD[field] || {};
        const noun = spec.noun || field;
        const parts = [];
        Object.keys(condition || {}).forEach((op) => {
          const raw = condition[op];
          // A token count is read against another token count, so it is written
          // the way this console writes every other one.
          const value = spec.num ? fmt(raw) : raw;
          if (spec.yes && (op === 'eq' || op === 'ne')) {
            // A boolean signal reads as presence, never as "= true".
            const affirmative = (op === 'eq') === (raw === true);
            parts.push(affirmative ? spec.yes : spec.no);
            return;
          }
          if (spec.unit && AMOUNT[op]) { parts.push(`${AMOUNT[op]} ${value} ${spec.unit}`); return; }
          switch (op) {
            case 'eq': parts.push(`${noun} is ${value}`); break;
            case 'ne': parts.push(`${noun} is not ${value}`); break;
            case 'in': parts.push(`${noun} is ${[].concat(raw).join(' or ')}`); break;
            case 'nin': parts.push(`${noun} is not ${[].concat(raw).join(' or ')}`); break;
            case 'contains': parts.push(`${noun} include “${value}”`); break;
            case 'starts_with': parts.push(`${noun} start with “${value}”`); break;
            case 'ends_with': parts.push(`${noun} end with “${value}”`); break;
            case 'matches': parts.push(`${noun} matches /${value}/`); break;
            default:
              // An operator this console has not learned must still render — a
              // dropped condition would misrepresent why the rule fires.
              parts.push(`${noun} ${op} ${value}`);
          }
        });
        return parts.join(' and ');
      }

      // Which family a predicate belongs to. Unknown fields are task shape: that
      // is what every field in signals.py was before context and capability
      // arrived, so it is the honest default for one this console has not learned.
      const CHIP_KIND = { context: 'context', capability: 'needs' };
      function predicateFamily(field) {
        const spec = FIELD[field];
        return (spec && spec.family) || 'shape';
      }
      function predicateChip(field, condition) {
        const family = predicateFamily(field);
        return { family, kind: CHIP_KIND[family] || '', text: phraseCondition(field, condition) };
      }
      function predicateChips(when) {
        if (!when || typeof when !== 'object') return [];
        return Object.keys(when)
          .map((field) => predicateChip(field, when[field]))
          .filter((chip) => chip.text);
      }

      // The requirements the planner DERIVED from the signals, said in the same
      // three-family vocabulary as the rule that asked for them — so "why is this
      // elo ineligible" and "what did the rule ask for" read as one language.
      const REQUIREMENT_CHIP = {
        min_context:       (v) => ({ family: 'context', kind: 'context', text: `at least ${fmt(v)} tokens` }),
        vision:            () => ({ family: 'capability', kind: 'needs', text: 'vision' }),
        tool_calling:      () => ({ family: 'capability', kind: 'needs', text: 'tool calls' }),
