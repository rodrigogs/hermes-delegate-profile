      // A tier used to read as one model with a trailing list of names, which hid
      // the three things that decide whether the chain is any good: how it picks
      // the next hop, whether its hops share an upstream, and what each elo costs
      // and can hold.
      function renderLadder() {
        const box = $('ladder');
        clear(box);
        const note = $('ladderNote');
        const tiers = (state.policy && state.policy.tiers) || {};
        const names = Object.keys(tiers);
        if (!names.length) {
          note.textContent = '';
          box.append(el('p', 'nothing', absence('No tiers defined — every task lands on the default.')));
          return;
        }
        const registry = state.capabilities;
        const billing = billingIndex(state.policy);
        // The tier chains are DECLARED config, so they are read at the console's own
        // hour: there is no plan here to carry one, and a tier using cheapest_now
        // has to show that the order on screen is only true of this hour.
        const when = whenOf(nowUtc());
        // No plan means no plan.multipliers, so THIS is the screen where the server's
        // other price answer earns its keep: liveness already priced every routable
        // elo at the hour it names, and where that hour is this one its number is
        // preferred over anything computed here.
        const live = liveMultipliers(state.liveness, when);
        let unverified = 0;

        names.forEach((name) => {
          const t = tiers[name] || {};
          const hops = tierChain(t);
          // pin_primary absent HERE is the router's documented default (True), not
          // an unreported fact: this is the same file rules._pin_primary_of reads.
          const strategy = strategyWords(t.fallback_strategy, {
            pinPrimary: declaredPin(t.pin_primary), when,
          });
          const rails = independentRails(hops);
          const shared = sharedUpstream(hops);
          hops.forEach((hop) => { if (!hopCaps(hop, registry).verified) unverified += 1; });

          const block = el('div', 'tier');
          const head = el('div', 'tier-head');
          head.append(el('span', 'tier-name', name));
          head.append(el('span', 'tier-fact', hops.length > 1 ? strategy.label : 'one elo, nothing to pick'));
          // Redundancy in the only terms that mean anything: distinct upstreams. A
          // count of vendors would call two OpenRouter resellers two rails.
          head.append(el('span', `tier-fact${rails < 2 ? ' thin' : ''}`,
                          `${rails} independent rail${rails === 1 ? '' : 's'} of ${hops.length} hop${hops.length === 1 ? '' : 's'}`));
          // The tier's own time knobs, in the operator's words. They are facts about
          // the CONFIG — what it will decline to pay, and which rails it steps
          // around — while "which rail is expensive right now" belongs to the clock
          // line at the top of the screen and is said only there.
          timeKnobWords(t).forEach((words) => head.append(el('span', 'tier-fact', words)));
          const floorChips = requirementChips(t.requirements);
          block.append(head);
          if (strategy.note) block.append(el('div', 'tier-fact', strategy.note));
          // A per-tier floor is a condition on every elo in the chain, so it is
          // said in the same chips a rule's own conditions use.
          if (floorChips.length) block.append(chipList(floorChips));
          block.append(chainList(hops, {
            strategy, registry, billing, when, live,
            // A price-ordered chain must show the prices it was ordered by; an
            // ordinary tier shows one only where a window is actually moving it.
            showPrice: strategy.timeRelative,
          }));

          if (hops.length < 2) {
            block.append(el('div', 'tier-note',
              `No fallback declared — if ${hops.length ? (hops[0].provider || 'this rail') : 'this tier'} refuses, the tier has nowhere to go. Add a hop on another vendor.`));
          } else if (shared && shared.first === 1 && shared.second === 2) {
            block.append(el('div', 'tier-note',
              `Hops 1 and 2 both resolve to ${shared.group}, so the first fallback survives nothing the primary does not. Reorder so hop 2 is on another upstream.`));
          } else if (shared) {
            block.append(el('div', 'tier-note',
              `Hops ${shared.first} and ${shared.second} both resolve to ${shared.group} — one upstream outage takes both.`));
          }
          box.append(block);
        });

        // The registry is what turns a model id into a context window. Without it
        // the chain still routes and still bills, so the honest report is which
        // elos are unchecked — not a note about a missing endpoint.
        note.textContent = unverified
          ? `${unverified} elo${unverified === 1 ? '' : 's'} unverified — no capability record, so the filter cannot check them.`
          : 'Every elo a tier can try, and how it picks the next one.';
      }

      // ── The chain plan for one probed task ──────────────────────────
      // /explain returns chain_plan: the requirements the signals derived, the
      // elos still eligible IN THE ORDER THEY WILL BE TRIED, the ones the filter
      // dropped with a reason, and two conditions an operator must never discover
      // by accident — a bypassed filter and an unverified elo.
      // Which clock the plan was made against. `plan` when it reports the hour it
      // used, `console` when it does not — and in that case the console's own hour
      // is the one the clock line at the top of the screen names, so the two can
      // never disagree. A plan that says it was time-agnostic is honoured as such:
      // that is a real answer, and it is the one that makes cheapest_now degrade.
      function planWhen(plan, fallback) {
        const p = plan && typeof plan === 'object' ? plan : {};
        const hour = Number(p.utc_hour);
        if (Number.isFinite(hour) && hour >= 0 && hour <= 23) {
          const weekday = Number(p.utc_weekday);
          return {
            when: { hour: Math.floor(hour), weekday: Number.isFinite(weekday) ? weekday : null },
            source: 'plan',
          };
        }
        if (p.time_agnostic === true) return { when: null, source: 'plan' };
        return { when: whenOf(fallback), source: 'console' };
      }
      // The tier's declared price ceiling, read from wherever the plan carries it.
      function timeCapOf(plan) {
        const p = plan && typeof plan === 'object' ? plan : {};
        const raw = p.time_cap && typeof p.time_cap === 'object' ? p.time_cap.max_multiplier
          : (p.time_cap !== undefined ? p.time_cap : p.max_multiplier);
        const value = Number(raw);
        return Number.isFinite(value) ? value : null;
      }
      // Elos the cap refused that the capability filter did not already report, so
      // the Dropped list names each elo exactly once.
      function cappedEntries(plan, rejected) {
        const p = plan && typeof plan === 'object' ? plan : {};
        const already = {};
        (Array.isArray(rejected) ? rejected : []).forEach((hop) => {
          if (hop && typeof hop === 'object') already[String(hop.model || '')] = true;
        });
        const list = Array.isArray(p.capped) ? p.capped : [];
        const out = [];
        list.forEach((item) => {
          const hop = typeof item === 'string' ? { model: item }
            : (item && typeof item === 'object' ? item : null);
          if (!hop) return;
          const model = String(hop.model || '');
          if (!model || already[model]) return;
          already[model] = true;
          out.push(Object.assign({}, hop, { reject_reason: hop.reject_reason || 'time_cap' }));
        });
        return out;
      }

      // WHICH ELOS ARE ACTUALLY OUT OF THE CHAIN, and which are only complained
      // about. The two are different facts and the plan reports both in the same two
      // lists, so the flag that separates them has to be read.
      //
      // Both bypasses RETAIN their diagnostics and RESTORE the chain:
      // capabilities.filter_chain sets `eligible` to the original chain and keeps
      // every `rejected` reason ("a consumer that renders `rejected` as 'dropped'
      // must therefore check `bypassed` first"), and apply_time_cap does the same
      // with `capped`. Rendering those entries under "Dropped" therefore printed the
      // SAME elo twice in one viewport — once as a numbered eligible hop, once as
      // excluded — and the second was false. It is reachable on the shipped policy:
      // a turn around 840,000 est_input_tokens matches huge-context-read → T3, the
      // derived min_context exceeds every hop's window, all three are rejected and
      // the filter bypasses itself to keep the task routable.
      //
      // The two flags are independent: the filter can bypass (restoring everything
      // it rejected) and the cap can then remove a hop from the restored chain for
      // real. So each list is placed by its OWN flag, and a real removal outranks a
      // diagnostic naming the same elo — the elo's absence from the chain is the
      // fact an operator is reading. Truthy, not `=== true`: a bypass claim fails
      // toward "a control gave way", which is the loud direction.
      function droppedElos(plan) {
        const p = plan && typeof plan === 'object' ? plan : {};
        const filterBypassed = !!p.bypassed;
        const capBypassed = !!p.time_cap_bypassed;
        const rejected = (Array.isArray(p.rejected) ? p.rejected : [])
          .filter((hop) => hop && typeof hop === 'object');
        // Deduped only against itself here; naming each elo once across BOTH lists is
        // this function's job, below.
        const capped = cappedEntries(p, []);
        const dropped = [];
        const retained = [];
        const seen = {};
        const take = (hop, removed) => {
          const model = String((hop && hop.model) || '');
          if (model && seen[model]) return;
          if (model) seen[model] = true;
          (removed ? dropped : retained).push(hop);
        };
        if (!filterBypassed) rejected.forEach((hop) => take(hop, true));
        if (!capBypassed) capped.forEach((hop) => take(hop, true));
        if (filterBypassed) rejected.forEach((hop) => take(hop, false));
        if (capBypassed) capped.forEach((hop) => take(hop, false));
        // Which control gave way, in the operator's words, so the retained list can
        // name it instead of leaving "why is this here?" to be inferred.
        const gaveWay = filterBypassed && capBypassed ? 'capability filter and the time cap'
          : filterBypassed ? 'capability filter'
          : capBypassed ? 'time cap' : '';
        return { dropped, retained, filterBypassed, capBypassed, gaveWay };
      }

      function renderChainPlan(plan) {
        const box = $('chainPlan');
        clear(box);
        if (!plan || typeof plan !== 'object') return;
        const chain = Array.isArray(plan.chain) ? plan.chain : [];
        const rejected = Array.isArray(plan.rejected) ? plan.rejected : [];
        const unknown = Array.isArray(plan.unknown) ? plan.unknown.map(String) : [];
        const req = plan.requirements && typeof plan.requirements === 'object' ? plan.requirements : {};
        const chips = requirementChips(req);
        // Nothing to plan is not a section (DESIGN.md §2.1): a task that reaches
        // the classifier has no resolved chain yet, and a framed void saying so
        // would be the console reporting on itself.
        if (!chain.length && !rejected.length && !chips.length) return;

        // The hour every price and every position below is relative to. The plan's
        // own hour wins when it reports one — that is the clock the router planned
        // against; otherwise the console's, which is the hour the clock line at the
        // top of the screen already names, so there is still one authority for it.
        const clock = planWhen(plan, nowUtc());
        const when = clock.when;
        // "planned at 03:00 UTC" is only worth a line when the plan was made at
        // ANOTHER hour than the one the clock line at the top of the screen is
        // reporting. Saying it about the current hour is the same fact twice
        // (DESIGN.md §2.3), and it was the second "07:00 UTC" in one sentence.
        const consoleWhen = whenOf(nowUtc());
        const elsewhere = clock.source === 'plan' && when
          && (!consoleWhen || consoleWhen.hour !== when.hour);
        // `plan.strategy` is the strategy that RAN, and it is the one that decides
        // whether the chain below gets ordinals — so it is the one asked here.
        const strategy = strategyWords(plan.strategy, {
          pinPrimary: plan.pin_primary,
          when,
          degraded: plan.strategy_degraded === true,
        });
        const registry = state.capabilities;
        const billing = billingIndex(state.policy);
        const flags = timeFlagIndex(plan);
        const multipliers = plan.multipliers && typeof plan.multipliers === 'object' ? plan.multipliers : null;
        // liveness fills in an elo the plan priced no multiplier for, but only when it
        // was evaluated at the hour this plan was made at — never as a substitute for
        // the plan's own number.
        const live = liveMultipliers(state.liveness, when);
        const cap = timeCapOf(plan);
        const outcome = droppedElos(plan);

        // BYPASSED FIRST, and as loud as this console gets. It means the filter
        // disqualified every elo and was overridden to keep routing alive: the task
        // will run on a model that cannot meet its stated requirements.
        if (outcome.filterBypassed) {
          const line = el('div', 'warn-line bad');
          line.append(el('strong', '', 'Capability filter bypassed.'),
                      el('span', '', 'No elo in this chain can meet these requirements, so the router will try them all anyway rather than refuse the task. '
                                   + 'Add an elo that qualifies, or lower the tier’s requirements.'));
          box.append(line);
        }
        // The time cap bypassing is the same class of event and gets the same
        // volume: a cost control was DROPPED, deliberately, because enforcing it
        // would have left the task with no route. The request pays peak price, and
        // an operator who finds that out from an invoice instead of this line has
        // been failed by the console.
        if (outcome.capBypassed) {
          const line = el('div', 'warn-line bad');
          line.append(el('strong', '', 'Time cap bypassed.'),
                      el('span', '', `Every elo was over the tier’s price cap${cap !== null ? ` of ${times(cap)}` : ''} at ${when ? hourLabel(when.hour) : 'this hour'}, so the cap was dropped rather than leave the task with no rail. `
                                   + 'This request pays peak price. Add a rail that is off-peak at this hour, raise the cap, or move the work to an off-peak hour.'));
          box.append(line);
        }
        // A strategy that did not run is not a strategy — and the two words are BOTH
        // in the plan: `strategy_declared` is what the tier asked for and `strategy`
        // is what ran. This line used to read the effective one, so after a degrade
        // it rendered "The tier declares “sequential”, but it did not run" — a
        // sentence that contradicts itself, about the one field that was correct.
        //
        // The REASON is the router's too. rules._effective_strategy computes it on the
        // same conditions order_chain degrades on and reports it as
        // `strategy_degraded_reason` ("no rng was injected, so the tail was not
        // shuffled"), which beats a guess at which input the caller forgot. The guess
        // is kept only for a plan that reports no reason at all, and it is derived
        // from the DECLARED word rather than from the effective one — asking
        // strategyWords about "sequential" is what returned an empty note and made the
        // guess unconditional.
        if (plan.strategy_degraded === true) {
          const declaredWord = String(plan.strategy_declared == null ? '' : plan.strategy_declared).trim();
          const reported = String(plan.strategy_degraded_reason == null ? '' : plan.strategy_degraded_reason).trim();
          const guess = declaredWord && declaredWord !== strategy.key
            ? strategyWords(declaredWord, { pinPrimary: plan.pin_primary, when, degraded: true }).note
            : '';
          const why = reported || guess || 'the caller supplied neither a clock nor a random source';
          const line = el('div', 'warn-line');
          line.append(el('strong', '', 'Fallback order degraded.'),
                      // A declared word the plan did not report is not invented: the
                      // degrade is still stated, without naming a strategy nobody sent.
                      el('span', '', (declaredWord && declaredWord !== strategy.key
                                        ? `The tier declares “${declaredWord}”, and it did not run: ${why}. `
                                        : `The declared fallback order did not run: ${why}. `)
                                   + `The chain below is the order that DID run — ${strategy.label}.`));
          box.append(line);
        }

        const group = el('div', 'group');
        const head = el('div', 'group-head');
        head.append(el('h2', '', 'Chain plan'));
        // The degradation already has a line of its own above, and it says more
        // than this note can; repeating it here would be the same fact twice in one
        // viewport, which is what the head note is not for (DESIGN.md §2.2).
        const note = plan.strategy_degraded === true ? '' : strategy.note;
        head.append(el('span', 'screen-note',
                       `${strategy.label}${note ? ` — ${note}` : ''}`
                       + (elsewhere ? ` · planned at ${hourLabel(when.hour)}` : '')));
        group.append(head);

        if (chips.length) group.append(chipList(chips));
        else group.append(el('p', 'nothing', 'No capability requirements derived, so every elo in the chain qualifies.'));

        // A bypass with no per-elo reasons is the one empty state this panel cannot
        // fill in for itself: the filter dropped every elo and then reported which
        // ones as an empty list, so the reasons exist nowhere. Saying that is the
        // honest answer — an absent Dropped section beside "bypassed" otherwise
        // reads as "nothing was dropped", which is the opposite of what happened.
        if (outcome.filterBypassed && !rejected.length) {
          group.append(el('div', 'tier-note',
            'The router reported no per-elo reasons for this bypass, so compare the requirements above against each elo below yourself.'));
        }

        if (chain.length) {
          group.append(chainList(chain, {
            strategy, registry, billing, when, flags, multipliers, live,
            // The Explain panel is where the cost comparison is audited, so every
            // eligible elo shows the prices it was compared on — not only the ones
            // that happen to be inside a window.
            showPrice: true,
          }));
          const rails = independentRails(chain);
          group.append(el('div', `tier-fact rails${rails < 2 ? ' thin' : ''}`,
                          `${rails} independent rail${rails === 1 ? '' : 's'} across ${chain.length} eligible hop${chain.length === 1 ? '' : 's'}`));
          // A chain that filtering collapsed onto ONE upstream has no fallback at
          // all, and it does not look any different from a healthy three-hop tier
          // unless the console says so. The declared chain still lists three hops,
          // so this is invisible in router.yaml — it is a property of THIS task.
          if (rails < 2) {
            group.append(el('div', 'tier-note',
              `No fallback for this task: every eligible hop resolves to ${upstreamGroup(chain[0] && chain[0].provider) || 'one upstream'}. `
              + 'One outage there and the task has nowhere to go — the declared chain is wider, but this task’s requirements ruled the rest out.'));
          }
        } else {
          group.append(el('p', 'nothing', 'No elo survived the filter — see the rejections below.'));
        }

        // Unverified elos run UNCHECKED: the filter neither cleared nor rejected
        // them, so their eligibility is an assumption.
        if (unknown.length) {
          group.append(el('div', 'tier-note',
            `Unverified, so eligible by assumption: ${unknown.join(', ')}. `
            + 'Nothing published their capabilities — declare the window and flags on the elo in router.yaml to have them checked.'));
        }

        // Elos that are OUT: a capability rejection and a cost refusal answer the
        // same question — "why is it not in the chain?" — so they share one list and
        // an operator does not have to know which subsystem said no in order to find
        // the elo. Every entry here is genuinely absent from the chain above; the ones
        // a bypass put back are below, under their own heading, because a heading that
        // said "Dropped" over an elo still in the chain was the console contradicting
        // itself half a screen apart.
        const rows = (list) => list.forEach((hop) => group.append(rejectRow(hop, {
          registry,
          needed: req.min_context,
          when,
          cap,
          flags: flags[String(hop && hop.model || '')],
          multiplier: multipliers ? multipliers[String(hop && hop.model || '')] : undefined,
          live: live[String(hop && hop.model || '')],
        })));
        if (outcome.dropped.length) {
          const rejectHead = el('div', 'group-head later');
          rejectHead.append(el('h2', '', `Dropped (${outcome.dropped.length})`));
          rejectHead.append(el('span', 'screen-note', 'Ineligible for this task — not banned, not down.'));
          group.append(rejectHead);
          rows(outcome.dropped);
        }
        // The bypass's retained diagnostics. NOTHING HERE WAS DROPPED — the control
        // gave way rather than leave the task with no route, so each of these elos is
        // one of the numbered hops above and will be tried. The reasons are still
        // worth the space: "nothing can meet this requirement" is only actionable
        // beside WHICH requirement each elo failed.
        if (outcome.retained.length) {
          const keptHead = el('div', 'group-head later');
          keptHead.append(el('h2', '', `Still in the chain (${outcome.retained.length})`));
          // ONE sentence, carrying the three facts the heading cannot imply: that
          // nothing was dropped, WHICH control gave way, and that a reason here is not
          // an exclusion. What the router will do about it and what the operator can
          // do are already said, once, in the bypass line at the top of the panel —
          // repeating either here would be the same fact twice (DESIGN.md §2.3).
          keptHead.append(el('span', 'screen-note',
                             `Nothing was dropped — the ${outcome.gaveWay || 'control'} gave way, so these are objections, not exclusions.`));
          group.append(keptHead);
          rows(outcome.retained);
        }

        box.append(group);
      }

      function pickBind(node) {
        state.selected = node.id;
        renderSheet();
        renderInspector(node);
      }

      // ── WHERE THIS TASK ACTUALLY GOES ───────────────────────────────
      // The headline verdict is this console's primary answer, so it is built from
      // the CHAIN PLAN — the list the executor iterates — and not from the decision
      // output's declared tier route. The two are different answers whenever the
      // capability filter, the time cap or the strategy did anything at all, and the
      // verdict was reading the one that does not run: for a vision task on T2 it
      // rendered "routed to glm-5.3 on zai, falls back to gpt-5.6-luna →
      // deepseek-v4-flash" while the Chain-plan panel directly below it correctly
      // reported gpt-5.6-luna as the only eligible hop and the other two rejected
      // for no_vision. Two panels, one screen, opposite answers.
      //
      // WHAT IS FIRST IS NOT ALWAYS KNOWABLE, and that is reported rather than
      // rounded off. `random` with pin_primary false has no first hop until the
      // request is made, so `first` is empty and the verdict says so — the same rule
      // that keeps the chain list from drawing an ordinal on a shuffled chain. A
      // degraded strategy DID run in declared order, so it counts as ordered; the
      // clock plays no part here, because whether an order exists does not depend on
      // the hour, only what the order is, and the plan has already applied it.
      //
      // With no plan the declared route is all there is, and it is returned marked
      // `source: 'declared'` so the caller can label it for what it is.
      function verdictRoute(plan, output) {
        const out = output && typeof output === 'object' ? output : {};
        const declaredFallback = (Array.isArray(out.fallback) ? out.fallback : [])
          .map((hop) => String((hop && hop.model) || '')).filter(Boolean);
        const declaredModel = String(out.model || '');
        const declared = {
          model: declaredModel,
          provider: String(out.provider || ''),
          fallback: declaredFallback,
          route: (declaredModel ? [declaredModel] : []).concat(declaredFallback),
        };
        const p = plan && typeof plan === 'object' ? plan : {};
        const hops = (Array.isArray(p.chain) ? p.chain : []).filter((h) => h && typeof h === 'object');
        const models = hops.map((hop) => String(hop.model || '')).filter(Boolean);
        if (!models.length) {
          return {
            source: declared.route.length ? 'declared' : 'none',
            first: declared.model,
            provider: declared.provider,
            rest: declared.fallback,
            ordered: true,
            pinPrimary: null,
            models: declared.route,
            declared,
            differs: false,
          };
        }
        const strategy = strategyWords(p.strategy, {
          pinPrimary: p.pin_primary,
          degraded: p.strategy_degraded === true,
        });
        const pinned = strategy.pinPrimary === true;
        const leads = strategy.ordered || pinned;
        // Same key the chain list draws its ordinals from, so the sentence and the
        // numbered hops beneath it can never disagree about which elo runs first.
        const providerOf = (model) => {
          const hop = hops.find((h) => String(h.model || '') === model);
          return String((hop && hop.provider) || '');
        };
        return {
          source: 'plan',
          first: leads ? models[0] : '',
          provider: leads ? providerOf(models[0]) : '',
          rest: leads ? models.slice(1) : models.slice(),
          ordered: strategy.ordered,
          // Three-valued, straight off the plan: false means the tier says nothing is
          // pinned, null means the plan did not report it — and "unreported" must not
          // be described as "shuffled", which is a claim about a field nobody sent.
          pinPrimary: strategy.pinPrimary,
          models,
          declared,
          // Comparison by the whole sequence, not by length: a time policy that
          // reordered two hops changed where the task goes without dropping anything.
          differs: declared.route.join('␀') !== models.join('␀'),
        };
      }

      async function probe(task) {
        const box = $('probeResult');
        clear(box);
        // A stale chain plan under a fresh verdict would describe the previous
        // task, so the plan is dropped the moment a new probe starts.
        state.chainPlan = null;
        renderChainPlan(null);
        if (!task) return;
        box.append(el('div', 'verdict', 'Routing…'));
        const res = await call(`/explain?task=${encodeURIComponent(task)}`);
        clear(box);
        if (res.missing || res.error) {
          // Two different obstacles, two different next actions: a policy that
          // fails lint is the operator's to fix, an absent endpoint is not.
          const why = (res.data && (res.data.error || res.data.message)) || '';
          box.append(el('p', 'nothing', /invalid/i.test(why)
            ? 'The router policy is invalid, so a dry run is refused. Fix the errors named above, then try again.'
            : 'The dry run is unavailable on this sidecar.'));
          return;
        }
        const d = res.data || {};
        const dec = d.decision || {};
        const out = dec.output || {};
        // The chain plan rides on the decision (rules.explain), with the envelope
        // accepted too so a sidecar that hoists it does not silently show nothing. It
        // is read HERE, before the verdict, because the verdict is built from it — it
        // used to be read thirty lines further down, which is how the headline came to
        // answer from the declared route while the panel below answered from the plan.
        state.chainPlan = (dec.chain_plan && typeof dec.chain_plan === 'object') ? dec.chain_plan
          : (d.chain_plan && typeof d.chain_plan === 'object') ? d.chain_plan : null;
        const route = verdictRoute(state.chainPlan, out);
        const verdict = el('div', 'verdict');
        // A deny rule refuses the task; it has no model to report. Verified against
        // rules.match: {'then': {'deny': true}} yields output {deny: true} with no
        // model, so the routed-to branch rendered "routed to —" for a refusal while
        // the Pipeline row one line above correctly said "→ refuse". renderSheet
        // already tests then.deny; this is the same test on the decision side.
        if (out.deny === true) {
          verdict.append(el('span', '', 'Caught by '));
          verdict.append(el('span', 'verdict-model', dec.matched_rule_id || 'default'));
          verdict.append(el('span', '', ', which '));
          const refuse = el('span', 'verdict-model', 'refuses');
          refuse.style.color = 'var(--bad-text)';
          verdict.append(refuse);
          verdict.append(el('span', '', ' the task \u2014 no model is asked.'));
        } else if (d.requires_classifier) {
          // Honest limit: /explain runs Stage 0 only, so a task bound for the
          // classifier cannot be previewed all the way to a model.
          //
          // TWO different reasons land here and they were collapsed into one
          // sentence. Measured against the live policy:
          //   "rename a variable"            -> matched_rule_id null, cause
          //                                     default_fallthrough  (no rule)
          //   "please review this pull req"  -> matched_rule_id review-request,
          //                                     cause classifier     (a rule DID
          //                                     match and it delegates)
          // Saying "No rule catches it" for the second was simply false, and it
          // threw away the rule id the server had already worked out.
          if (dec.matched_rule_id) {
            verdict.append(el('span', '', 'Caught by '));
            verdict.append(el('span', 'verdict-model', dec.matched_rule_id));
            verdict.append(el('span', '', ', which asks the classifier — so the model depends on that call.'));
          } else {
            verdict.append(el('span', '', 'No rule catches it — it would go to the classifier, so the model depends on that call.'));
          }
        } else {
          // Real spaces in the text, not a layout gap standing in for them: this
          // string is read aloud as well as looked at.
          verdict.append(el('span', '', 'Caught by '));
          verdict.append(el('span', 'verdict-model', dec.matched_rule_id || 'default'));
          // A list of model ids, each in mono as its own span: they are machine facts
          // an operator copies, and the separators are real characters rather than a
          // layout gap standing in for them.
          const names = (list, separator) => list.forEach((model, i) => {
            if (i) verdict.append(el('span', '', separator));
            verdict.append(el('span', 'verdict-model', model));
          });
          if (route.first) {
            verdict.append(el('span', '', ', routed to '));
            verdict.append(el('span', 'verdict-model', route.first));
            if (route.provider) verdict.append(el('span', '', ` on ${route.provider}`));
            if (route.rest.length && route.ordered) {
              verdict.append(el('span', '', '. Falls back to '));
              names(route.rest, ' → ');
            } else if (route.rest.length) {
              // A pinned random tail: hop 1 genuinely runs first and the rest
              // genuinely have no order, so neither half is written as the other.
              verdict.append(el('span', '', '. Then, in a random order, '));
              names(route.rest, ', ');
            }
            verdict.append(el('span', '', '.'));
          } else if (route.rest.length) {
            // Nothing is first: `random` with pin_primary false or unreported. Naming
            // one anyway is the claim the chain list already refuses to draw as an
            // ordinal — and the two cases are not the same claim. false is the tier
            // saying "shuffle everything"; null is the plan not saying, and describing
            // that as shuffled would be inventing the field's value.
            verdict.append(el('span', '', ', routed to any of '));
            names(route.rest, ', ');
            verdict.append(el('span', '', route.pinPrimary === false
              ? ' — drawn at random per request, so which runs first is not decided until then.'
              : ' — the plan does not report whether the primary is pinned, so which runs first cannot be said here.'));
          } else {
            // No plan and no declared model: the decision named no route at all, which
            // is a finding rather than an em dash.
            verdict.append(el('span', '', ', which names no model — nothing here can say where this task would go.'));
          }
        }
        box.append(verdict);
        // WHICH clause did the work. /explain has always returned matched_clauses
        // and this console ignored it, so the verdict named a rule without saying
        // what in the task satisfied it — the operator had to open the rule and
        // guess. A rule with three conditions is three different reasons it could
        // have fired.
        const clauses = dec.matched_clauses && typeof dec.matched_clauses === 'object'
          ? Object.entries(dec.matched_clauses) : [];
        if (clauses.length) {
          const why = el('div', 'verdict-why');
          why.append(el('span', 'verdict-why-label',
                        clauses.length === 1 ? 'because ' : 'because all of '));
          clauses.forEach(([field, test]) => {
            // phraseCondition already owns this vocabulary — it handles boolean
            // signals as presence rather than "= true", carries units, and knows
            // `in` — so the chips read exactly like the rule rows above them
            // instead of inventing a second wording for the same condition.
            why.append(el('span', 'clause', phraseCondition(field, test) || field));
          });
          box.append(why);
        }
        // The DECLARED route, secondary and labelled as such — the tier as router.yaml
        // writes it, beside the chain that will actually be walked. It earns a line
        // only where the two DIFFER: identical, it is the same fact twice (DESIGN.md
        // §2.2), and it names no reasons because the Dropped list below owns those.
        if (route.source === 'plan' && route.differs && route.declared.route.length) {
          const line = el('div', 'verdict-declared');
          line.append(el('span', 'verdict-why-label', 'declared route '));
          line.append(el('span', 'verdict-route', route.declared.route.join(' → ')));
          box.append(line);
        }
        renderChainPlan(state.chainPlan);
        // Mark the winning line on the sheet itself.
        // The rule the evaluation actually stopped at. Was hardcoded to 'default'
        // for every classifier-bound task, which marked the wrong line whenever a
        // real rule had matched and delegated.
        // String(): a YAML `id: 7` arrives as a number and dataset values are always
        // strings, so === never matched and no row was marked at all.
        state.probeRule = dec.matched_rule_id != null
          ? String(dec.matched_rule_id)
          : (d.requires_classifier ? '__classifier' : '__default');
        // renderSheet's line() applies .hit from state.probeRule, so the mark survives
        // an Edit/Refresh re-render instead of being painted on afterwards.
        renderSheet();
      }

      // ── Replay: the path a recorded decision really took ─────────────
      // Not a graph of the whole policy. A trace has 2-4 steps; drawing all
      // fifteen policy nodes to highlight three of them makes the reader hunt
      // for the answer. The recorded path IS a short sequence, so it is drawn
      // as one — same vertical vocabulary as the decision sheet.
      const STAGE_WORDS = {
        blocklist: 'checked the blocklist',
        signals: 'read the task',
        rules: 'matched the rules',
        session_pin: 'checked the session pin',
        cache: 'looked in the cache',
        classifier: 'asked the classifier',
        veto: 'refused the request',
        fail_safe: 'fell back to the fail-safe',
      };

      function stepNode(step) {
        const stage = step && step.stage;
        if (stage === 'rules') {
          const out = step.out || {};
          return out.rule_id != null ? `rule:${out.rule_id}` : 'default';
        }
        if (stage === 'veto') return 'blocklist';
        return stage || null;
      }

      // What this step concluded, in the operator's words — the reader should not
      // have to open the JSON to learn the outcome of a step.
      function stepOutcome(step) {
        const out = (step && step.out) || {};
        if (out.rule_id != null) return String(out.rule_id);
        if (out.deny === true) return 'refused';
        if (out.blocked === false) return 'clear';
        if (out.model) return String(out.model);
        if (out.tier) return String(out.tier);
        if (out.hit === false) return 'miss';
        return '';
      }

      function drawPath() {
        const box = $('replayPath');
        clear(box);
        if (!state.replay) {
          box.append(el('p', 'nothing', 'Pick a decision on the left.'));
          return;
        }
        const { steps, at } = state.replay;
        steps.forEach((step, i) => {
          const cls = i === at ? ' on' : (i < at ? ' past' : ' ahead');
          const node = el('button', `trace${cls}`);
          node.type = 'button';
          node.append(el('span', 'trace-ord', String(i + 1)));
          const what = el('div', 'trace-what');
          what.append(el('div', 'trace-stage', STAGE_WORDS[step.stage] || String(step.stage || '—')));
          const outcome = stepOutcome(step);
          if (outcome) what.append(el('div', 'trace-outcome', outcome));
          node.append(what);
          if (step.cause) {
            const c = el('span', 'cause', String(step.cause).replace(/_/g, ' '));
            c.style.color = causeColor(step.cause);
            node.append(c);
          }
          node.addEventListener('click', () => { state.replay.at = i; renderStep(); });
          box.append(node);
        });
      }

      const EDITABLE = new Set(['tier', 'rule', 'classifier', 'fail_safe', 'default']);

      function fullPolicy() {
        const base = state.policy && typeof state.policy === 'object' ? state.policy : {};
        const full = JSON.parse(JSON.stringify(base));
        const st = state.status || {};
        if (full.classifier === undefined && st.classifier) full.classifier = JSON.parse(JSON.stringify(st.classifier));
        if (full.enabled === undefined && typeof st.enabled === 'boolean') full.enabled = st.enabled;
        if (full.blocklist === undefined && state.blocklist) {
          full.blocklist = {
            manual_ban: state.blocklist.manual_bans || [],
            fallback_chain: state.blocklist.fallback_chain || [],
          };
        }
        return full;
      }

      function renderInspector(node) {
        const box = $('inspector');
        clear(box);
        // Nothing selected is not a condition to report: the sheet above already
        // shows every rule and the ladder every tier, and the screen note already
        // says how to edit. DESIGN.md §2.1.
        if (!node) return;
        const editing = state.mode === 'editing' && node.bind && EDITABLE.has(node.bind);
        box.append(el('h2', 'inspector-head', node.name));
        if (!editing) {
          const policy = state.policy || {};
          let fragment = null;
          if (node.bind === 'rule') fragment = (policy.rules || [])[node.ruleIndex];
          else if (node.bind === 'tier') fragment = (policy.tiers || {})[node.tier];
          else if (node.bind) fragment = policy[node.bind];
          if (node.runtime) box.append(el('p', 'nothing', 'Runtime state — rebuilt per call, nothing to configure.'));
          else box.append(Object.assign(el('pre', 'code', pretty(fragment || {})), {}));
          return;
        }

        state.draft = fullPolicy();
        const field = (label, get, set, options) => {
          const wrap = el('div', 'field');
          wrap.append(el('label', '', label));
          let input;
          if (options) {
            input = document.createElement('select');
            options.forEach((o) => {
              const opt = document.createElement('option');
              opt.value = o; opt.textContent = o || '—';
              input.appendChild(opt);
            });
          } else {
            input = document.createElement('input');
          }
          input.value = get() == null ? '' : String(get());
          input.addEventListener('input', () => set(input.value));
          wrap.append(input);
          box.append(wrap);
        };

        const d = state.draft;
        if (node.bind === 'tier') {
          const t = d.tiers[node.tier] = d.tiers[node.tier] || {};
          field('model', () => t.model, (v) => { t.model = v; });
          field('provider', () => t.provider, (v) => { t.provider = v; });
        } else if (node.bind === 'rule') {
          const r = d.rules[node.ruleIndex] = d.rules[node.ruleIndex] || {};
          r.then = r.then || {};
          const tiers = Object.keys(d.tiers || {});
          field('routes to', () => r.then.model, (v) => { r.then.model = v; }, tiers.concat(['']));
          field('profile', () => r.then.profile, (v) => { r.then.profile = v; });
        } else if (node.bind === 'classifier' || node.bind === 'fail_safe') {
          const f = d[node.bind] = d[node.bind] || {};
          field('model', () => f.model, (v) => { f.model = v; });
          field('provider', () => f.provider, (v) => { f.provider = v; });
        } else if (node.bind === 'default') {
          const def = d.default = d.default || {};
          field('routes to', () => def.model, (v) => { def.model = v; });
          field('action', () => def.action, (v) => { def.action = v; });
        }

        // Apply leads, because applying is the intention; Preview is for the
        // operator who wants to see the diff first. Apply no longer depends on
        // Preview having been pressed — it plans for itself.
        const actions = el('div', 'actions');
        const applyBtn = el('button', 'btn go', 'Apply');
        const previewBtn = el('button', 'btn', 'Preview');
        const revertBtn = el('button', 'btn warn', 'Revert');
        actions.append(applyBtn, previewBtn, revertBtn);
        box.append(actions);
        const msg = el('p', 'msg'); msg.id = 'nodeMsg'; msg.setAttribute('aria-live', 'polite');
        box.append(msg);
        const diff = el('pre', 'code'); diff.id = 'nodeDiff'; diff.hidden = true;
        box.append(diff);

        applyBtn.addEventListener('click', () => doApply('/apply', msg, state.draft, diff));
        previewBtn.addEventListener('click', () => doPreview(state.draft, msg, diff));
        revertBtn.addEventListener('click', () => doApply('/apply/revert', msg));
      }

      // ── write path ──────────────────────────────────────────────────
      // What actually stops a write, and nothing else.
      //
      // This used to refuse when the editor was closed, which added a click to
      // every write path and protected nothing: the sidecar has never heard of the
      // console's mode, and it already requires a per-extension token-v1 secret,
      // the host's CSRF token, a loopback bind and a matching base_hash. The
      // compaction action also checks confirm=="COMPACT" server-side. A client-side
      // mode was the one gate an attacker could skip and the operator could not.
      //
      // Both remaining tests describe an obstacle the operator can DO something
      // about, and each names the fix.
      function writable(msg, action) {
        if (state.unreachable) { setMsg(msg, `${action} unavailable — sidecar unreachable.`, 'bad'); return false; }
        if (!csrf()) {
          setMsg(msg, `${action} cannot apply from a standalone console — open the Router panel inside Hermes One.`, 'bad');
          return false;
        }
        return true;
      }
      function setMsg(node, text, kind) {
        if (!node) return;
        node.textContent = text;
        node.className = `msg${kind ? ` ${kind}` : ''}`;
      }

      // Plan a policy and record it. Returns true only if the result is safe to
      // write, and leaves the reason in `msg` when it is not.
      async function plan(policy, msg, diffNode) {
        const res = await call('/plan', { method: 'POST', body: { policy } });
        if (res.missing) { setMsg(msg, 'This sidecar has no /plan endpoint.', 'bad'); return false; }
        if (res.error) { setMsg(msg, `Rejected (HTTP ${res.status || 'network'}).`, 'bad'); return false; }
        state.plan = res.data;
        if (diffNode) {
          diffNode.hidden = false;
          diffNode.textContent = res.data.diff || pretty(res.data.preview || {});
        }
        if (!res.data.valid) {
          setMsg(msg, `Invalid: ${(res.data.errors || []).join('; ')}`, 'bad');
          return false;
        }
        return true;
      }

      // The explicit preview: "show me what this would change, without changing
      // it". A different intention from Apply, so it keeps its own control — and
      // it is the one that renders the diff.
      async function doPreview(policy, msg, diffNode) {
        if (!writable(msg, 'Preview')) return;
        setMsg(msg, 'Checking…');
        if (await plan(policy, msg, diffNode)) {
          setMsg(msg, 'No problems found — this is what would change.', 'ok');
        }
      }

      // Apply plans for itself.
      //
      // /plan is not optional: it returns the base_hash that /apply refuses to
      // write without (router/service.py:357, the optimistic-concurrency pin). But
      // that is the machine's bookkeeping, and it used to be the operator's chore —
      // click Validate, read "Valid — apply to write it", click Apply. Two clicks
      // for one intention, and a middle state whose only content was an
      // instruction to press the next button.
      //
      // Now Apply plans first and stops on the plan's own verdict. An invalid draft
      // never reaches /apply, exactly as before; the difference is that the
      // operator learns WHY from one click instead of two.
      // In flight, so a second click cannot start a second plan+apply pair. Two
      // overlapping pairs race on the same base_hash: the first writes, the second
      // 409s, and the operator is told "Policy changed underneath" about their own
      // click.
      let applying = false;

      async function doApply(path, msg, draft, diffNode) {
        if (!writable(msg, 'Apply')) return;
        if (applying) { setMsg(msg, 'Still writing the last change…', 'bad'); return; }
        applying = true;
        try {
        if (path !== '/apply/revert') {
          const policy = draft !== undefined ? draft : (state.draft || (state.plan && state.plan.policy));
          if (policy === undefined || policy === null) { setMsg(msg, 'Nothing to apply.', 'bad'); return; }
          setMsg(msg, 'Checking…');
          // The diff is passed through, not discarded. Folding Validate into Apply
          // removed the step that used to render it, and with it the guarantee that
          // an operator SAW a concurrent edit being removed before the write: /plan
          // deep-merges the draft over whatever is on disk now and replaces lists
          // wholesale (router/service.py:50), so a rule added by a CLI edit or
          // another tab since page load is deleted by the next Apply. The diff
          // contains that deletion; it was being computed and thrown away.
          const planned = await plan(policy, msg, diffNode);
          if (!planned) return;
          // A plan with no diff changes nothing on disk — but the server snapshots
          // the current file to .bak before every write (service.py:415), so
          // applying a no-op destroys the only thing Revert can restore. The JSON
          // twisty makes this one click away: renderAll() refills that textarea
          // with the live policy whenever the console is not in editing mode, so in
          // the default state its Apply is a guaranteed no-op write.
          if (state.plan && state.plan.diff === '') {
            setMsg(msg, 'Nothing to change — this is already the policy on disk.', 'ok');
            return;
          }
        }
        const body = path === '/apply/revert' ? {} : { plan: state.plan, policy: state.plan.policy };
        const res = await call(path, { method: 'POST', body });
        if (res.missing) { setMsg(msg, 'This sidecar has no such endpoint.', 'bad'); return; }
        if (res.status === 409) { setMsg(msg, 'Policy changed underneath — validate again.', 'bad'); state.plan = null; await load(); return; }
        if (res.error) { setMsg(msg, `Failed (HTTP ${res.status || 'network'}).`, 'bad'); return; }
        setMsg(msg, 'Written.', 'ok');
        state.plan = null; state.draft = null;
        await load();
        } finally {
          applying = false;
        }
      }

      async function doCompaction() {
        const msg = $('compactMsg');
        if (!writable(msg, 'Recalculate')) return;
        if ($('compactConfirm').value !== 'COMPACT') { setMsg(msg, 'Type COMPACT exactly to confirm.', 'bad'); return; }
        const aggressiveness = state.compaction && Number.isFinite(state.compaction.aggressiveness)
          ? state.compaction.aggressiveness : 50;
        const res = await call('/apply', { method: 'POST', body: { action: 'compaction', confirm: 'COMPACT', aggressiveness } });
        if (res.error || res.missing) {
          // The status alone sent an operator hunting: the real 400 was a
          // resolvable path bug and the reason was in the body all along.
          const why = (res.data && (res.data.error || res.data.message)) || `HTTP ${res.status || 'n/a'}`;
          setMsg(msg, `Refused — ${why}`, 'bad');
          return;
        }
        $('compactConfirm').value = '';
        setMsg(msg, 'Scheduled — the agent restarts and reverts itself if unhealthy.', 'ok');
      }

      // ── Routes + replay ─────────────────────────────────────────────
      // Free-text over the three things an operator remembers about a decision:
      // what it was asked, where it went, and why.
      function matchesQuery(r, q) {
        if (!q) return true;
        return [r.task, r.model, r.cause, r.rule_id]
          .some((f) => String(f || '').toLowerCase().includes(q));
      }

      // Decisions that did NOT come from a rule matching. Two kinds, and the
      // distinction matters:
      //   * a blocklist veto refused outright — no model was chosen;
      //   * the fail-safe DID choose a model, because nothing else would take the
      //     task (here: the classifier erroring).
      // This pill used to say "Refused" for both. Measured against the live log:
      // 21 of 50 matched, but only 4 were refusals — the other 17 all named a model
      // they successfully routed to. So the word was false for 81% of what it
      // counted, and an operator reading "Refused 21" would open an investigation
      // into 17 non-refusals.
      //
      // One pill, not two: "did anything go off the rule path?" is a single
      // question, and splitting it would need a third combined pill to ask it — plus
      // a third sub-44px tap target. The breakdown goes in the note instead, where
      // there is room for the words that make it precise.
      function isOffRulePath(route) {
        const cause = String(route && route.cause || '');
        return cause.includes('veto') || cause.includes('fail_safe');
      }

      function isVeto(route) {
        return String(route && route.cause || '').includes('veto');
      }

      function inScope(route) {
        return state.scope === 'off-rule' ? isOffRulePath(route) : true;
      }

      function renderRoutes() {
        const box = $('routesTable');
        clear(box);
        // The replay column earns its half of the screen only once it holds a
        // trace. Driven from state, not from the click, so a failed pick or a
        // refresh that clears the selection gives the width back.
        $('routesRow').classList.toggle('waiting', !state.replay);
        const all = Array.isArray(state.routes) ? state.routes : [];
        const q = state.query.trim().toLowerCase();
        const routes = all.filter((r) => inScope(r) && matchesQuery(r, q));
        $('routesFilter').hidden = all.length < 8;

        // The counts live ON the controls, so "how many went off the rule path" is
        // answered before the operator decides whether to look.
        const offRule = all.filter(isOffRulePath);
        const vetoed = offRule.filter(isVeto).length;
        // clear() and append, never a raw-markup sink: this console renders
        // persisted, attacker-influenceable route text, so the whole file is held
        // to textContent only and a test enforces it by scanning the source. These
        // two labels are static, but an exception is the one the next person copies
        // — and the test cannot tell an exception from a mistake.
        const scopeLabel = (node, word, count) => {
          clear(node);
          node.append(el('span', '', word), el('span', 'scope-count', String(count)));
        };
        const showingOffRule = state.scope === 'off-rule';
        scopeLabel($('scopeAll'), 'All', all.length);
        scopeLabel($('scopeOffRule'), 'Not by rule', offRule.length);
        $('scopeAll').classList.toggle('is-on', !showingOffRule);
        $('scopeOffRule').classList.toggle('is-on', showingOffRule);
        $('scopeAll').setAttribute('aria-pressed', String(!showingOffRule));
        $('scopeOffRule').setAttribute('aria-pressed', String(showingOffRule));
        // Nothing off the rule path is good news and must not read as a broken filter.
        $('scopeOffRule').disabled = offRule.length === 0 && !showingOffRule;
        $('routeScopes').hidden = all.length < 2;

        // The note says three things, in this order of usefulness: what the current
        // scope actually means, what a search matched, and what to do next. It used
        // to ignore the scope entirely — in the filtered view with no query it still
        // read "Pick one to replay its path", so the one place that could explain
        // what had been filtered said nothing about it.
        //
        // "N went off the rule path — X refused, Y fail-safe" is the sentence a two
        // -word pill cannot carry: it gives the definition, and it distinguishes the
        // refusals (no model chosen) from the fail-safe catches (a model WAS chosen,
        // because nothing else would take the task).
        const windowNote = state.routesTotal > all.length
          ? ` Counting the most recent ${all.length} of ${state.routesTotal} recorded.`
          : '';
        $('routesNote').textContent = !all.length
          ? (state.pending.has('GET /routes') ? 'This sidecar does not record decisions yet.' : '')
          : q ? `${routes.length} of ${all.length} match “${state.query.trim()}”.${windowNote}`
          : showingOffRule
            ? `${offRule.length} of ${all.length} did not come from a rule — `
              + `${vetoed} refused, ${offRule.length - vetoed} caught by the fail-safe.${windowNote}`
          // "Pick one to replay its path" stayed on screen after picking one, so
          // the instruction outlived its own task and read as though the click
          // had not registered. Once a trace is open the note says what is open.
          : state.replay ? `Replaying one decision — pick another to switch.${windowNote}`
              : `Pick one to replay its path.${windowNote}`;
        if (!all.length) {
          box.append(el('p', 'nothing', absence('No decisions recorded yet.')));
          return;
        }
        if (!routes.length) {
          box.append(el('p', 'nothing', 'No decision matches that search.'));
          return;
        }
        routes.forEach((r) => {
          // A button, not a div: choosing a trace is an action, and an operator
          // on a keyboard must be able to reach and take it.
          const row = el('button', `row route${state.replay && state.replay.id === r.id ? ' picked' : ''}`);
          row.type = 'button';
          row.dataset.routeId = r.id;
          if (state.replay && state.replay.id === r.id) row.setAttribute('aria-current', 'true');
          const cause = el('span', 'cause', String(r.cause || '—').replace(/_/g, ' '));
          cause.style.color = causeColor(r.cause);
          row.append(cause);
          const mid = el('div');
          mid.append(el('div', 'row-name', r.model || '—'));
          if (r.task) mid.append(el('div', 'row-note', r.task));
          row.append(mid, el('span', 'row-value', ago(r.ts)));
          row.addEventListener('click', () => pickRoute(r.id));
          box.append(row);
        });
      }

      async function pickRoute(id) {
        const res = await call(`/routes?id=${encodeURIComponent(id)}`);
        if (res.error || res.missing) { $('routesNote').textContent = 'That trace could not be read.'; return; }
        const steps = Array.isArray(res.data.steps) ? res.data.steps : [];
        state.replay = { id, steps, at: 0 };
        renderRoutes();
        renderStep();
      }

      function renderStep() {
        drawPath();
        const box = $('stepDetail');
        clear(box);
        if (!state.replay) return;
        const { steps, at } = state.replay;
        const step = steps[at] || {};
        const io = el('div', 'io');
        [['in', step.in], ['out', step.out]].forEach(([label, value]) => {
          if (value === undefined) return;
          const cell = el('div');
          cell.append(el('div', 'io-label', label));
          cell.append(el('pre', 'code', pretty(value)));
          io.append(cell);
        });
        box.append(io);
      }

      // ── edit mode ───────────────────────────────────────────────────
      function setMode(mode) {
        state.mode = mode;
        const open = mode === 'editing';
        const button = $('editMode');
        button.setAttribute('aria-pressed', String(open));
        // The label names what the button DOES next, so the operator never has to
        // work out whether a state word is a description or an instruction.
        button.title = open ? 'Stop editing' : 'Edit the routing policy';
        $('editLabel').textContent = open ? 'Done' : 'Edit';
        $('policyEditor').readOnly = !open;
        // The JSON twisty's write buttons follow the read-only default too. They are
        // static markup, so unlike the inspector's — which renderInspector simply
        // does not build in reading mode — they have to be disabled explicitly.
        // Without this, expanding "Edit the whole policy as JSON" to READ it put a
        // live green Apply and a live Revert one tap away, and renderAll() keeps
        // that textarea pre-filled with the live policy whenever the console is not
        // editing, so jsonDraft() always parses and the "Nothing to apply" guard
        // could never fire on that path. Revert is the destructive one: it takes no
        // plan, shows no diff, and restores whatever the .bak holds.
        $('jsonApply').disabled = !open;
        $('jsonRevert').disabled = !open;
        $('pipelineNote').textContent = open
          ? 'Editing — click any line to change it.'
          : 'Read top to bottom — the first rule that matches wins.';
        renderWarnings();
        renderRail();
        renderInspector(null);
        if (state.policy) renderSheet();
      }

      // ── layout ──────────────────────────────────────────────────────
      function isNarrow() {
        const embedded = window.self !== window.top;
        return embedded || window.innerWidth < NARROW_BELOW;
      }
      function applyLayout() {
        $('shell').classList.toggle('is-narrow', isNarrow());
      }

      // The on-screen keyboard covers the bottom of the frame without changing
      // its layout height, so a focused filter or probe input can end up behind
      // it with no way to scroll to it. The host solves this for its own composer
      // by measuring visualViewport and publishing --keyboard-bottom-inset on its
      // documentElement — which this document, being a separate one, does not
      // inherit. Same measurement, same guards, our own custom property.
      function syncKeyboard() {
        const root = document.documentElement;
        const vv = window.visualViewport;
        let touch = false;
        try { touch = matchMedia('(hover:none) and (pointer:coarse)').matches; } catch (_) { touch = false; }
        if (!vv || !touch) { root.style.removeProperty('--keyboard-inset'); return; }
        // A pinch-zoomed viewport makes the difference reflect the zoom rather
        // than the keyboard, which on Chromium with "force enable zoom" yields a
        // large spurious inset that jitters while panning.
        if (Math.abs((vv.scale || 1) - 1) > 0.05) { root.style.removeProperty('--keyboard-inset'); return; }
        const inset = Math.max(0, Math.ceil(window.innerHeight - (vv.height + vv.offsetTop)));
        if (inset > 0) root.style.setProperty('--keyboard-inset', `${inset}px`);
        else root.style.removeProperty('--keyboard-inset');
      }

      // ── load ────────────────────────────────────────────────────────
      function renderAll() {
        renderClock();
        renderWarnings();
        renderRail();
        renderHealth();
        renderRoutes();
        renderSheet();
        renderLadder();
        // A refresh must not silently drop the plan the operator is reading; it is
        // re-rendered from state so new capability data lands in it.
        renderChainPlan(state.chainPlan);
        if (!state.selected) renderInspector(null);
        if (state.replay) renderStep();
        if (state.mode !== 'editing' || !$('policyEditor').value) {
          $('policyEditor').value = state.policy ? pretty(fullPolicy()) : '';
        }
      }

      async function load() {
        const button = $('refresh');
        button.disabled = true;
        button.textContent = 'Refreshing…';
        try { await fetchAll(); } finally {
          button.disabled = false;
          button.textContent = 'Refresh';
        }
      }

      async function fetchAll() {
        state.unreachable = false;
        const [health, status, policy, blocklist, liveness, compaction, routes, capabilities] = await Promise.all([
          call('/health'), call('/status'), call('/policy'), call('/blocklist'),
          call('/liveness'), call('/compaction'), call('/routes?limit=200'),
          // Optional: the capability registry is what turns a model id into a
          // context window. A sidecar without it is not an error — the chain view
          // reports those elos as unverified, which is the truth either way.
          call('/capabilities'),
        ]);
        state.health = health.data || null;
        state.status = status.data || null;
        state.policy = policy.data || null;
        state.blocklist = blocklist.data || null;
        state.liveness = liveness.data || null;
        state.compaction = compaction.missing ? null : (compaction.data || null);
        state.capabilities = capabilityRegistry(capabilities);
        state.routes = (routes.data && Array.isArray(routes.data.routes)) ? routes.data.routes : [];
        // The envelope reports how many decisions EXIST; we were discarding it and
        // then presenting the page we happened to receive as the whole record.
        // Measured: the console asked for the default 50 while 71 were recorded, so
        // every hit count was understated by ~27% (trivial-mechanical-edit showed
        // 19x against a real 26x) and a rule that fired only in the dropped 21 would
        // have rendered "never fired" — a false negative on the exact question the
        // sheet exists to answer. Truncation drops the OLDEST rows, so this gets
        // worse as the log grows; raising the limit alone would only move the cliff.
        state.routesTotal = Number(routes.data && routes.data.count) || state.routes.length;
        state.checkedAt = new Date();
        state.loading = false;
        renderAll();
      }

      function wire() {
        const tabs = [...document.querySelectorAll('.tab')];
        const select = (tab) => {
          tabs.forEach((t) => {
            const on = t === tab;
            t.setAttribute('aria-selected', String(on));
            // Only the selected tab is in the tab order; arrows move between
            // them. This is what role="tablist" promises a screen reader.
            t.tabIndex = on ? 0 : -1;
          });
          document.querySelectorAll('.screen')
            .forEach((s) => s.classList.toggle('active', s.id === `panel-${tab.dataset.tab}`));
        };
        tabs.forEach((tab, i) => {
          tab.tabIndex = tab.getAttribute('aria-selected') === 'true' ? 0 : -1;
          tab.addEventListener('click', () => select(tab));
          tab.addEventListener('keydown', (e) => {
            const step = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1
                       : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1
                       : e.key === 'Home' ? -i
                       : e.key === 'End' ? tabs.length - 1 - i : 0;
            if (!step) return;
            e.preventDefault();
            const next = tabs[(i + step + tabs.length) % tabs.length];
            select(next);
            next.focus();
          });
        });
        $('editMode').addEventListener('click', () => setMode(state.mode === 'editing' ? 'reading' : 'editing'));
        $('refresh').addEventListener('click', load);
        $('compactGo').addEventListener('click', doCompaction);
        // One parse, used by both buttons. Malformed JSON is reported before any
        // request goes out, because "your text is not JSON" is not something the
        // server should have to tell you.
        const jsonDraft = () => {
          try { return { ok: true, value: JSON.parse($('policyEditor').value) }; }
          catch (e) { setMsg($('jsonMsg'), `Not valid JSON: ${e.message}`, 'bad'); return { ok: false }; }
        };
        $('jsonApply').addEventListener('click', () => {
          const draft = jsonDraft();
          if (draft.ok) doApply('/apply', $('jsonMsg'), draft.value, $('jsonDiff'));
        });
        $('jsonPreview').addEventListener('click', () => {
          const draft = jsonDraft();
          if (draft.ok) doPreview(draft.value, $('jsonMsg'), $('jsonDiff'));
        });
        $('jsonRevert').addEventListener('click', () => doApply('/apply/revert', $('jsonMsg')));
        $('probeForm').addEventListener('submit', (e) => { e.preventDefault(); probe($('probeTask').value.trim()); });
        $('routesFilter').addEventListener('input', (e) => { state.query = e.target.value; renderRoutes(); });
        const setScope = (scope) => { state.scope = scope; renderRoutes(); };
        $('scopeAll').addEventListener('click', () => setScope('all'));
        $('scopeOffRule').addEventListener('click', () => setScope('off-rule'));
        // The clock line has to stay true without a refresh: a window that opened
        // five minutes ago while the console sat open is exactly the case it exists
        // for. One minute is fine — every boundary it reports is on the hour — and
        // it repaints two spans and three list items, nothing else. Guarded because
        // a headless harness need not provide timers.
        if (typeof setInterval === 'function') setInterval(renderClock, 60000);
        window.addEventListener('resize', applyLayout);
        // visualViewport fires for the keyboard; resize does not, on iOS.
        window.visualViewport?.addEventListener('resize', syncKeyboard);
        window.visualViewport?.addEventListener('scroll', syncKeyboard);
      }

      wire();
      applyLayout();
      syncKeyboard();
      // The clock needs no sidecar: its windows are declared, so it is true before
      // the first read answers and stays true if none ever does.
      renderClock();
      setMode('reading');
      load();

      globalThis.__router = {
        state, setMode, renderRail, renderHealth, renderRoutes, renderStep, renderInspector,
        renderWarnings,
        drawPath, stepNode, stepOutcome, causeColor, worstOf, modelState,
        phraseCondition, phraseWhen, renderSheet, renderLadder, ruleHits, probe,
        // Context, capability and fallback-strategy reading: every one of these is
        // pure, so the words an operator acts on are pinned by tests rather than
        // eyeballed on a screenshot.
        predicateFamily, predicateChip, predicateChips, requirementChips,
        billingBadge, ctxWindow, rejectWhy, contextShortfall, strategyWords,
        upstreamGroup, independentRails, sharedUpstream, hopCaps, billingIndex,
        capabilityRegistry, tierChain, renderChainPlan,
        // The time layer. Every one of these takes its clock as a PARAMETER, which
        // is what keeps them pure and what keeps these tests from passing at 05:00
        // UTC and failing at 07:00 — the failure mode the injected clock exists to
        // prevent in the router itself.
        whenOf, timeFace, hourLabel, entryWindows, eloWindows, priceMultiplier,
        nextWindowChange, windowWords, railWindowRows, effectivePrices, money,
        priceWords, pricePublished, declaredPin, timePolicyMove, timeFlagIndex,
        timeKnobWords, planWhen, timeCapOf, cappedEntries, renderClock, nowUtc,
        // The server's own numbers, and the two questions the console must answer
        // from the RUNNING path rather than from the declared config: which elos are
        // really out of the chain, and where this task actually goes.
        liveMultipliers, droppedElos, verdictRoute,
        say, ago, fmt, isNarrow, csrf, writable, call, load, absence, matchesQuery,
        syncKeyboard,
        // The write spine: the only code here that changes how the agent routes
        // real work. It is exported so its refusals can be tested directly —
        // tests/test_router_nav_writespine.js used to pin an equivalent path in
        // router-nav.js, and that file is now only a mount.
        plan, doPreview, doApply, setMsg,
      };
    })();
  </script>
</body>
</html>
